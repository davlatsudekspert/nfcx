name: nfcstore_nova
description: "NFCSTORE Nova — raqamli identity, NFC va biznes platformasi."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Holat boshqaruvi. Riverpod tanlandi: compile-time xavfsiz, global
  # BuildContext talab qilmaydi va repository qatlamini test ichida
  # almashtirish bitta override bilan bo'ladi.
  flutter_riverpod: ^2.6.1

  # Marshrutlash — deep link (NFC karta tegizilganda) va typed route
  # kerak, Navigator 1.0 buni qo'lda qilishni talab qilardi.
  go_router: ^14.6.2

  # Tarmoq — interceptor, timeout va upload progress bitta joyda.
  dio: ^5.7.0

  # Sessiya tokeni Keystore/Keychain ichida. SharedPreferences EMAS.
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.4

  cached_network_image: ^3.4.1
  # Rasm keshining hajmi (NovaImageCache). Allaqachon cached_network_image
  # orqali o'rnatilgan — yangi paket yuklanmaydi.
  flutter_cache_manager: ^3.4.1
  qr_flutter: ^4.1.0
  share_plus: ^10.1.3
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  video_player: ^2.9.2
  nfc_manager: ^3.5.0
  app_links: ^6.3.2
  file_picker: ^11.0.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Reels testlari: soxta video platformasi (haqiqiy dekodersiz
  # oldindan yuklash / yo'q qilish / tabdan chiqishni sinash uchun).
  # `video_player` ning o'zi shu paketga tayanadi — yangi kod emas.
  video_player_platform_interface: ^6.2.0

  # HAQIQIY HISOB E2E — emulyatorda ishlaydi, haqiqiy backendga
  # ulanadi. Oddiy `flutter test` bu papkani ko'rmaydi, shuning uchun
  # sinov hisobisiz ham `flutter test` o'tadi.
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  # ISHLATILMAYDIGAN SHRIFTLAR OLIB TASHLANDI.
  #
  # Kursiv serif ilovada hech qayerda chaqirilmaydi; `w800`
  # tipografiya yumshatilgandan keyin qolmadi; mono `w700` ham
  # ishlatilmaydi (eng og'iri — `w600`). Har bir shrift fayli
  # APK ga TO'LIQ tushadi, ishlatilsa ham, ishlatilmasa ham.
  assets:
    - assets/brand/
    - assets/demo/
    - assets/welcome/
  fonts:
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-400.ttf
          weight: 400
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-400.ttf
          weight: 400
        - asset: assets/fonts/PlayfairDisplay-500.ttf
          weight: 500
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-600.ttf
          weight: 600
