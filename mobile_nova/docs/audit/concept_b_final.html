<!DOCTYPE html>
<html lang="uz" data-theme="pearl" data-device="390">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFCSTORE — Concept B · Final</title>
<style>
/* ============================================================
   THEME SYSTEM — 5 ta to‘liq premium palette
   ============================================================ */
:root{
  --r-pill:100px;
  --r-blob:44px;
  --r-soft:28px;
  --r-gentle:22px;
  --phone-w:390;
  --ease-spring:cubic-bezier(.34,1.4,.5,1);
  --ease-smooth:cubic-bezier(.4,0,.2,1);
  --dur-fast:.25s;
  --dur-med:.45s;
  --dur-slow:.7s;
}

/* ============ 1 · PEARL / CHAMPAGNE ============ */
html[data-theme="pearl"]{
  --bg-1:#FAF7F2; --bg-2:#EFE7DA; --bg-vignette:rgba(196,164,124,.14);
  --surface:rgba(253,251,247,.82); --surface-2:rgba(253,251,247,.55); --surface-solid:#FDFBF7;
  --text-1:#2A2A2E; --text-2:#5A5A62; --text-3:#9A9AA2;
  --accent-1:#E0CDA9; --accent-2:#C4A47C; --accent-3:#8E7550;
  --accent-b:#C5D8CB; --accent-b-dark:#6E8A7A;
  --accent-c:#D5CFE4; --accent-c-dark:#8E7FB8;
  --accent-d:#CBDCE8; --accent-d-dark:#6B8FA8;
  --glow:rgba(196,164,124,.35); --glow-b:rgba(159,184,168,.35);
  --shadow-float:0 22px 50px rgba(160,140,110,.16), 0 8px 20px rgba(160,140,110,.08);
  --shadow-soft:0 12px 32px rgba(160,140,110,.10), 0 4px 12px rgba(160,140,110,.06);
  --shadow-tiny:0 4px 12px rgba(160,140,110,.08);
  --border-1:rgba(255,255,255,.95); --border-2:rgba(196,164,124,.22);
  --phone-frame:linear-gradient(150deg,#D9CFBE,#B8A88E);
  --error:#D88A8A; --success:#8FB89A; --warn:#DDB878;
  --ambient-1:rgba(224,205,169,.45); --ambient-2:rgba(197,216,203,.4);
}

/* ============ 2 · GRAPHITE / PLATINUM ============ */
html[data-theme="graphite"]{
  --bg-1:#1A1B1F; --bg-2:#0A0B0E; --bg-vignette:rgba(200,200,210,.08);
  --surface:rgba(38,40,46,.72); --surface-2:rgba(38,40,46,.45); --surface-solid:#22232A;
  --text-1:#F0EFEB; --text-2:#B8B8BE; --text-3:#7A7A82;
  --accent-1:#DDDDDE; --accent-2:#BEBEC0; --accent-3:#8E8E92;
  --accent-b:#8FA0B0; --accent-b-dark:#A8BDD0;
  --accent-c:#A8B0C4; --accent-c-dark:#8A94B0;
  --accent-d:#8898A8; --accent-d-dark:#A0B4C4;
  --glow:rgba(220,220,224,.22); --glow-b:rgba(143,160,176,.22);
  --shadow-float:0 22px 50px rgba(0,0,0,.55), 0 8px 20px rgba(0,0,0,.35);
  --shadow-soft:0 12px 32px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.2);
  --shadow-tiny:0 4px 12px rgba(0,0,0,.3);
  --border-1:rgba(255,255,255,.14); --border-2:rgba(200,200,210,.14);
  --phone-frame:linear-gradient(150deg,#2E3038,#14151A);
  --error:#E09494; --success:#94C4A0; --warn:#E0C088;
  --ambient-1:rgba(180,180,190,.14); --ambient-2:rgba(143,160,176,.14);
}

/* ============ 3 · OCEAN / ICE ============ */
html[data-theme="ocean"]{
  --bg-1:#0F1E30; --bg-2:#04101C; --bg-vignette:rgba(111,199,224,.14);
  --surface:rgba(30,54,82,.7); --surface-2:rgba(30,54,82,.45); --surface-solid:#152B44;
  --text-1:#E8F0F8; --text-2:#A8C0D8; --text-3:#6A88A8;
  --accent-1:#A8D8E8; --accent-2:#6FC7E0; --accent-3:#4A8FB0;
  --accent-b:#A8D4C4; --accent-b-dark:#88C0B0;
  --accent-c:#B8C8E8; --accent-c-dark:#8AA4CC;
  --accent-d:#D0E8F4; --accent-d-dark:#A8C8E0;
  --glow:rgba(111,199,224,.3); --glow-b:rgba(168,212,196,.3);
  --shadow-float:0 22px 50px rgba(0,10,25,.6), 0 8px 20px rgba(0,10,25,.4);
  --shadow-soft:0 12px 32px rgba(0,10,25,.45), 0 4px 12px rgba(0,10,25,.25);
  --shadow-tiny:0 4px 12px rgba(0,10,25,.35);
  --border-1:rgba(200,230,255,.15); --border-2:rgba(111,199,224,.2);
  --phone-frame:linear-gradient(150deg,#1E3A5A,#0A1A2E);
  --error:#E09494; --success:#94C4A0; --warn:#E0C088;
  --ambient-1:rgba(111,199,224,.28); --ambient-2:rgba(168,212,196,.22);
}

/* ============ 4 · AURORA / VIOLET ============ */
html[data-theme="aurora"]{
  --bg-1:#1E1832; --bg-2:#0A0716; --bg-vignette:rgba(184,160,224,.16);
  --surface:rgba(50,38,78,.72); --surface-2:rgba(50,38,78,.45); --surface-solid:#2A2040;
  --text-1:#F4EDF8; --text-2:#C8B8E0; --text-3:#8A7AA8;
  --accent-1:#D5C4EC; --accent-2:#B8A0E0; --accent-3:#8A6FB0;
  --accent-b:#9ED8E0; --accent-b-dark:#7EC0CC;
  --accent-c:#E0B8D8; --accent-c-dark:#C090B8;
  --accent-d:#B8C4E8; --accent-d-dark:#8A9AC8;
  --glow:rgba(184,160,224,.35); --glow-b:rgba(158,216,224,.3);
  --shadow-float:0 22px 50px rgba(10,5,25,.6), 0 8px 20px rgba(10,5,25,.4);
  --shadow-soft:0 12px 32px rgba(10,5,25,.45), 0 4px 12px rgba(10,5,25,.25);
  --shadow-tiny:0 4px 12px rgba(10,5,25,.35);
  --border-1:rgba(220,200,240,.15); --border-2:rgba(184,160,224,.22);
  --phone-frame:linear-gradient(150deg,#3A2E58,#1A1028);
  --error:#E09494; --success:#94C4A0; --warn:#E0C088;
  --ambient-1:rgba(184,160,224,.32); --ambient-2:rgba(158,216,224,.24);
}

/* ============ 5 · MIDNIGHT NAVY / SOFT GOLD ============ */
html[data-theme="midnight"]{
  --bg-1:#0A1428; --bg-2:#050A18; --bg-vignette:rgba(212,179,106,.10);
  --surface:rgba(18,32,54,.72); --surface-2:rgba(18,32,54,.45); --surface-solid:#0F1E38;
  --text-1:#F5EFE2; --text-2:#B8B4A6; --text-3:#6E6A60;
  --accent-1:#E8D4A0; --accent-2:#C9A96A; --accent-3:#8E7340;
  --accent-b:#A8B8C4; --accent-b-dark:#C4D0D8;
  --accent-c:#B8B0C8; --accent-c-dark:#8E88A0;
  --accent-d:#C4C8D0; --accent-d-dark:#9AA0A8;
  --glow:rgba(201,169,106,.32); --glow-b:rgba(168,184,196,.22);
  --shadow-float:0 22px 50px rgba(0,5,15,.7), 0 8px 20px rgba(0,5,15,.5), 0 0 60px rgba(201,169,106,.10);
  --shadow-soft:0 12px 32px rgba(0,5,15,.55), 0 4px 12px rgba(0,5,15,.35);
  --shadow-tiny:0 4px 12px rgba(0,5,15,.4);
  --border-1:rgba(212,179,106,.14); --border-2:rgba(201,169,106,.24);
  --phone-frame:linear-gradient(150deg,#12213A,#050A18);
  --error:#E0A0A0; --success:#A8C4A8; --warn:#E0C088;
  --ambient-1:rgba(201,169,106,.22); --ambient-2:rgba(50,90,140,.24);
}

/* ============================================================
   BASE
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
html,body{
  background:linear-gradient(180deg,#16161a 0%,#08080c 100%);
  color:var(--text-1);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Inter,Arial,sans-serif;
  min-height:100vh;overflow-x:hidden;
  transition:color var(--dur-slow) var(--ease-smooth);
}
body{display:flex;}

/* ============================================================
   REVIEW PANEL
   ============================================================ */
.review{
  width:310px;flex-shrink:0;
  background:rgba(14,14,18,.95);
  backdrop-filter:blur(30px);
  border-right:1px solid rgba(255,255,255,.08);
  height:100vh;overflow-y:auto;
  padding:22px 16px 40px;position:sticky;top:0;color:#E0E0E4;
}
.review::-webkit-scrollbar{width:5px;}
.review::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px;}
.review .brand-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.review h1{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#F0F0F4;}
.review .badge-b{font-size:9px;font-weight:800;letter-spacing:.8px;padding:2px 7px;border-radius:8px;background:linear-gradient(150deg,var(--accent-1),var(--accent-2));color:#1a1206;}
.review .sub{font-size:11px;color:#7A7A82;margin-bottom:14px;line-height:1.55;}
.review .notice{font-size:10.5px;line-height:1.5;color:#D4B36A;background:rgba(212,179,106,.08);border:1px solid rgba(212,179,106,.22);padding:9px 11px;border-radius:14px;margin-bottom:14px;}
.review .section-label{font-size:9.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#6A6A72;margin:14px 0 6px;padding-left:4px;}
.review .switcher{display:flex;gap:4px;padding:3px;background:rgba(255,255,255,.06);border-radius:12px;margin-bottom:8px;}
.review .switcher button{flex:1;padding:8px 4px;border-radius:9px;border:none;background:transparent;color:#8A8A92;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s;letter-spacing:.2px;}
.review .switcher button.active{background:rgba(255,255,255,.14);color:#F0F0F4;}
.review .theme-sw{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;}
.review .theme-sw button{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);color:#B8B8BE;font-size:10.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s;text-align:left;}
.review .theme-sw button.active{border-color:var(--accent-2);background:rgba(255,255,255,.08);color:#F0F0F4;}
.review .theme-sw .sw{width:14px;height:14px;border-radius:50%;flex-shrink:0;}
.review .theme-sw .sw.pearl{background:linear-gradient(150deg,#E0CDA9,#C4A47C);}
.review .theme-sw .sw.graphite{background:linear-gradient(150deg,#DDDDDE,#4A4A52);}
.review .theme-sw .sw.ocean{background:linear-gradient(150deg,#6FC7E0,#1E3A5A);}
.review .theme-sw .sw.aurora{background:linear-gradient(150deg,#B8A0E0,#3A2E58);}
.review .theme-sw .sw.midnight{background:linear-gradient(150deg,#C9A96A,#0A1428);}
.review .group{margin-bottom:12px;}
.review .group h2{font-size:9.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#6A6A72;margin-bottom:5px;padding-left:6px;}
.review .item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;font-size:11.5px;color:#B8B8BE;cursor:pointer;transition:.15s;margin-bottom:1px;}
.review .item:hover{background:rgba(255,255,255,.06);color:#F0F0F4;}
.review .item.active{background:rgba(255,255,255,.1);color:#F0F0F4;font-weight:600;}
.review .item .dot{width:5px;height:5px;border-radius:50%;background:#5A5A62;flex-shrink:0;}
.review .item.active .dot{background:var(--accent-2);}
.review .item .demo{margin-left:auto;font-size:8.5px;font-weight:800;letter-spacing:.4px;color:#E0C088;padding:1px 5px;border-radius:5px;background:rgba(224,192,136,.14);}
.review .item .future{margin-left:auto;font-size:8.5px;font-weight:800;letter-spacing:.4px;color:#94C4A0;padding:1px 5px;border-radius:5px;background:rgba(148,196,160,.14);}

/* ============================================================
   STAGE
   ============================================================ */
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;min-height:100vh;position:relative;transition:padding var(--dur-med) var(--ease-smooth);}
.stage.gallery{align-items:flex-start;padding:32px;flex-wrap:wrap;gap:28px;}

/* ============================================================
   PHONE
   ============================================================ */
.phone{
  width:calc(var(--phone-w) * 1px);
  height:calc(var(--phone-w) * 844 / 390 * 1px);
  background:linear-gradient(180deg,var(--bg-1) 0%,var(--bg-2) 100%);
  border-radius:calc(var(--phone-w) * 46 / 390 * 1px);
  position:relative;overflow:hidden;
  box-shadow:
    0 0 0 calc(var(--phone-w) * 8 / 390 * 1px) var(--phone-frame),
    0 0 0 calc(var(--phone-w) * 9 / 390 * 1px) rgba(0,0,0,.3),
    calc(var(--phone-w) * 50 / 390 * 1px) calc(var(--phone-w) * 100 / 390 * 1px) calc(var(--phone-w) * 120 / 390 * 1px) rgba(0,0,0,.55),
    0 0 calc(var(--phone-w) * 180 / 390 * 1px) var(--glow);
  flex-shrink:0;
  transition:width .5s var(--ease-smooth), height .5s var(--ease-smooth), border-radius .5s var(--ease-smooth), background var(--dur-slow), box-shadow var(--dur-slow);
}
.phone::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(120% 80% at 50% 0%, var(--bg-vignette), transparent 60%);
}
.statusbar{
  height:calc(var(--phone-w) * 42 / 390 * 1px);
  display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 calc(var(--phone-w) * 26 / 390 * 1px) calc(var(--phone-w) * 6 / 390 * 1px) calc(var(--phone-w) * 30 / 390 * 1px);
  font-size:calc(var(--phone-w) * 12.5 / 390 * 1px);
  font-weight:600;color:var(--text-1);position:relative;z-index:150;
}
.status-right{display:flex;align-items:center;gap:calc(var(--phone-w) * 5 / 390 * 1px);}
.status-right svg{width:calc(var(--phone-w) * 16 / 390 * 1px);height:auto;}
.viewport{position:absolute;top:calc(var(--phone-w) * 42 / 390 * 1px);left:0;right:0;bottom:0;overflow:hidden;z-index:2;}
.screen{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  padding:0 calc(var(--phone-w) * 20 / 390 * 1px) calc(var(--phone-w) * 130 / 390 * 1px);
  opacity:0;pointer-events:none;transform:translateY(14px) scale(.985);
  transition:opacity var(--dur-med) var(--ease-smooth), transform .55s var(--ease-spring);
  scrollbar-width:none;
}
.screen::-webkit-scrollbar{display:none;}
.screen.active{opacity:1;pointer-events:auto;transform:translateY(0) scale(1);}
.screen.fullbleed{padding:0;}

/* ============================================================
   BOTTOM NAV
   ============================================================ */
.bnav{
  position:absolute;bottom:calc(var(--phone-w) * 14 / 390 * 1px);
  left:calc(var(--phone-w) * 16 / 390 * 1px);right:calc(var(--phone-w) * 16 / 390 * 1px);
  height:calc(var(--phone-w) * 72 / 390 * 1px);
  background:var(--surface);backdrop-filter:blur(28px) saturate(160%);
  -webkit-backdrop-filter:blur(28px) saturate(160%);
  border-radius:var(--r-pill);border:1px solid var(--border-1);
  box-shadow:var(--shadow-float);
  display:flex;align-items:center;justify-content:space-around;
  padding:0 calc(var(--phone-w) * 8 / 390 * 1px);z-index:100;
  transition:transform var(--dur-med) var(--ease-spring), background var(--dur-slow), box-shadow var(--dur-slow);
}
.bnav.hidden{transform:translateY(140%);}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-3);cursor:pointer;padding:8px 0;border:none;background:none;font-family:inherit;transition:color .3s;position:relative;}
.bnav-item svg{width:calc(var(--phone-w) * 21 / 390 * 1px);height:calc(var(--phone-w) * 21 / 390 * 1px);transition:transform .3s var(--ease-spring);}
.bnav-item span{font-size:calc(var(--phone-w) * 9.5 / 390 * 1px);font-weight:600;letter-spacing:.3px;}
.bnav-item.active{color:var(--text-1);}
.bnav-item.active svg{transform:translateY(-1px) scale(1.06);}
.bnav-item.active::before{content:"";position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:calc(var(--phone-w) * 34 / 390 * 1px);height:calc(var(--phone-w) * 34 / 390 * 1px);border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 70%);z-index:-1;}
.bnav-item.center .wrap{width:calc(var(--phone-w) * 52 / 390 * 1px);height:calc(var(--phone-w) * 52 / 390 * 1px);border-radius:50%;background:linear-gradient(150deg,var(--accent-1),var(--accent-2));display:flex;align-items:center;justify-content:center;color:var(--bg-1);margin-top:calc(var(--phone-w) * -22 / 390 * 1px);box-shadow:0 calc(var(--phone-w) * 12 / 390 * 1px) calc(var(--phone-w) * 24 / 390 * 1px) var(--glow), inset 0 1px 0 rgba(255,255,255,.4);transition:transform .3s var(--ease-spring), background var(--dur-slow);}
.bnav-item.center.active .wrap{transform:scale(1.08) translateY(-3px);}
.bnav-item.center svg{width:calc(var(--phone-w) * 24 / 390 * 1px);height:calc(var(--phone-w) * 24 / 390 * 1px);color:var(--bg-1);}
.bnav-item.center.active{color:var(--accent-3);}

/* ============================================================
   PRIMITIVES
   ============================================================ */
.capsule{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 18px;border-radius:var(--r-pill);
  background:var(--surface);backdrop-filter:blur(20px);
  border:1px solid var(--border-1);box-shadow:var(--shadow-tiny);
  font-size:12.5px;font-weight:600;color:var(--text-1);
  cursor:pointer;transition:all .3s var(--ease-spring), background var(--dur-slow);
}
.capsule:active{transform:scale(.94);}
.capsule.active{background:linear-gradient(150deg,var(--accent-1),var(--accent-2));color:var(--bg-1);border-color:transparent;box-shadow:0 12px 28px var(--glow);}

.btn-soft{
  height:56px;border-radius:var(--r-pill);border:none;
  background:linear-gradient(150deg,var(--accent-1) 0%, var(--accent-2) 100%);
  color:var(--bg-1);font-size:15px;font-weight:700;letter-spacing:.2px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  cursor:pointer;font-family:inherit;width:100%;
  box-shadow:0 16px 32px var(--glow), inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .3s var(--ease-spring), background var(--dur-slow);
}
.btn-soft:active{transform:scale(.97);}
.btn-soft.mint{background:linear-gradient(150deg,var(--accent-b),var(--accent-b-dark));color:#fff;box-shadow:0 16px 32px var(--glow-b), inset 0 1px 0 rgba(255,255,255,.4);}
.btn-soft.danger{background:linear-gradient(150deg,#E8B8B8,#D88A8A);color:#fff;box-shadow:0 16px 32px rgba(216,138,138,.32);}
.btn-ghost{
  height:56px;border-radius:var(--r-pill);
  background:var(--surface);backdrop-filter:blur(20px);
  border:1px solid var(--border-1);color:var(--text-1);
  font-size:15px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:10px;
  cursor:pointer;font-family:inherit;width:100%;box-shadow:var(--shadow-soft);
  transition:transform .3s var(--ease-spring), background var(--dur-slow);
}
.btn-ghost:active{transform:scale(.97);}
.btn-soft:disabled,.btn-ghost:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}

.inp-soft{
  width:100%;height:56px;border-radius:var(--r-gentle);padding:0 20px;
  background:var(--surface);backdrop-filter:blur(12px);
  border:1px solid var(--border-1);
  box-shadow:inset 0 2px 8px rgba(0,0,0,.06), var(--shadow-tiny);
  color:var(--text-1);font-size:15px;font-family:inherit;
  outline:none;letter-spacing:.1px;transition:.3s var(--ease-smooth);
}
.inp-soft:focus{background:var(--surface-solid);box-shadow:inset 0 2px 8px rgba(0,0,0,.04), 0 0 0 4px var(--glow), var(--shadow-soft);border-color:var(--accent-2);}
.inp-soft::placeholder{color:var(--text-3);}
.inp-soft.err{box-shadow:inset 0 2px 8px rgba(216,138,138,.08), 0 0 0 4px rgba(216,138,138,.18), var(--shadow-soft);}

.lbl-soft{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-3);margin-bottom:8px;display:block;padding-left:6px;}
.field{margin-bottom:16px;}

.t-title{font-size:32px;font-weight:500;letter-spacing:-1.2px;color:var(--text-1);line-height:1.08;font-family:Georgia,"Times New Roman",serif;}
.t-sub{font-size:14px;color:var(--text-2);letter-spacing:.1px;margin-top:8px;line-height:1.55;}
.t-section{font-size:13px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-3);}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 14px;padding:0 4px;}
.sec-link{font-size:12px;color:var(--accent-3);font-weight:600;letter-spacing:.3px;cursor:pointer;background:none;border:none;font-family:inherit;}

.av-orb{
  width:44px;height:44px;border-radius:50%;
  background:linear-gradient(150deg,var(--accent-1),var(--accent-2));
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;color:var(--bg-1);flex-shrink:0;
  box-shadow:0 8px 20px var(--glow), inset 0 1px 0 rgba(255,255,255,.4);
  position:relative;transition:background var(--dur-slow);
}
.av-orb.b{background:linear-gradient(150deg,var(--accent-b),var(--accent-b-dark));color:#fff;}
.av-orb.c{background:linear-gradient(150deg,var(--accent-c),var(--accent-c-dark));color:#fff;}
.av-orb.d{background:linear-gradient(150deg,var(--accent-d),var(--accent-d-dark));color:#fff;}

.row{display:flex;align-items:center;justify-content:space-between;padding:6px 0 16px;gap:12px;}
.icon-soft{
  width:44px;height:44px;border-radius:50%;
  background:var(--surface);backdrop-filter:blur(20px);
  border:1px solid var(--border-1);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-1);cursor:pointer;flex-shrink:0;box-shadow:var(--shadow-tiny);
  transition:transform .3s var(--ease-spring), background var(--dur-slow);
}
.icon-soft:active{transform:scale(.92);}
.icon-soft svg{width:18px;height:18px;}

/* ============================================================
   ANIMATIONS
   ============================================================ */
@keyframes floatSoft{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulseOrb{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.6);opacity:0}}
@keyframes waveRipple{0%{transform:scale(.7);opacity:.55}100%{transform:scale(1.9);opacity:0}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes orbit{from{transform:rotate(0) translateX(115px) rotate(0)}to{transform:rotate(360deg) translateX(115px) rotate(-360deg)}}
@keyframes morphBlob{
  0%,100%{border-radius:60% 40% 55% 45% / 50% 60% 40% 50%;}
  25%{border-radius:45% 55% 40% 60% / 60% 45% 55% 40%;}
  50%{border-radius:55% 45% 60% 40% / 45% 55% 45% 55%;}
  75%{border-radius:40% 60% 45% 55% / 55% 40% 60% 45%;}
}
@keyframes ambientDrift{
  0%{transform:translate(-30px,20px) scale(1);}
  33%{transform:translate(20px,-20px) scale(1.06);}
  66%{transform:translate(-10px,30px) scale(.98);}
  100%{transform:translate(-30px,20px) scale(1);}
}
@keyframes confirmationPop{
  0%{transform:scale(.6);opacity:0;}
  60%{transform:scale(1.06);}
  100%{transform:scale(1);opacity:1;}
}
.screen.active > *{animation:fadeInUp .55s var(--ease-spring) both;}

.aurora{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
.aurora .blob-a,.aurora .blob-b{position:absolute;filter:blur(40px);}
.aurora .blob-a{width:70%;height:50%;top:-10%;right:-15%;background:radial-gradient(circle,var(--ambient-1),transparent 70%);animation:ambientDrift 14s ease-in-out infinite;}
.aurora .blob-b{width:60%;height:40%;bottom:-10%;left:-15%;background:radial-gradient(circle,var(--ambient-2),transparent 70%);animation:ambientDrift 18s ease-in-out infinite reverse;}

/* ============================================================
   NFC ORB
   ============================================================ */
.orb-hero{position:relative;margin:8px auto 26px;width:270px;height:270px;display:flex;align-items:center;justify-content:center;}
.orb-hero .halo{position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle at 30% 30%, var(--glow), transparent 60%);filter:blur(14px);animation:breathe 5s ease-in-out infinite;}
.orb-hero .blob-shape{
  position:absolute;width:200px;height:200px;
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.9), transparent 45%), linear-gradient(150deg,var(--accent-1) 0%, var(--accent-2) 55%, var(--accent-3) 100%);
  animation:morphBlob 12s ease-in-out infinite;
  box-shadow:0 30px 60px var(--glow), 0 15px 30px var(--glow), inset -12px -20px 40px rgba(0,0,0,.12), inset 12px 16px 32px rgba(255,255,255,.3);
  display:flex;align-items:center;justify-content:center;z-index:2;
  transition:background var(--dur-slow);
}
.orb-hero .ring{position:absolute;width:200px;height:200px;border-radius:50%;border:1.5px solid var(--accent-2);opacity:.4;animation:pulseOrb 3.6s ease-out infinite;}
.orb-hero .ring:nth-child(2){animation-delay:1.2s;}
.orb-hero .ring:nth-child(3){animation-delay:2.4s;}
.orb-hero .nfc-mark{position:relative;z-index:3;width:64px;height:64px;display:flex;align-items:center;justify-content:center;color:var(--bg-1);}
.orb-hero .nfc-mark svg{width:100%;height:100%;filter:drop-shadow(0 2px 6px rgba(0,0,0,.15));}

/* ============================================================
   ORBIT — NFC Center
   ============================================================ */
.orbit{position:relative;width:320px;height:320px;margin:8px auto 26px;}
.orbit .center-orb{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:130px;height:130px;
  background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.9), transparent 45%), linear-gradient(150deg,var(--accent-1),var(--accent-2));
  animation:morphBlob 10s ease-in-out infinite, breathe 4s ease-in-out infinite;
  box-shadow:0 24px 50px var(--glow), inset -8px -12px 24px rgba(0,0,0,.1), inset 8px 12px 24px rgba(255,255,255,.3);
  display:flex;align-items:center;justify-content:center;z-index:5;color:var(--bg-1);cursor:pointer;
  transition:transform .3s var(--ease-spring), background var(--dur-slow);
}
.orbit .center-orb:active{transform:translate(-50%,-50%) scale(.95);}
.orbit .center-orb svg{width:48px;height:48px;}
.orbit .wave{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:200px;height:200px;border-radius:50%;border:1.5px solid var(--accent-2);opacity:.5;animation:waveRipple 3.2s ease-out infinite;}
.orbit .wave:nth-child(2){animation-delay:1.06s;}
.orbit .wave:nth-child(3){animation-delay:2.13s;}
.orbit .item{
  position:absolute;top:50%;left:50%;width:56px;height:56px;border-radius:50%;
  background:var(--surface);backdrop-filter:blur(14px);border:1px solid var(--border-1);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text-1);
  box-shadow:var(--shadow-soft);cursor:pointer;
  animation:orbit 22s linear infinite;margin:-28px 0 0 -28px;
  transition:transform .3s var(--ease-spring);
}
.orbit .item:hover{transform:scale(1.12);}
.orbit .item:nth-of-type(1){animation-delay:0s;background:linear-gradient(150deg,var(--accent-1),var(--accent-2));color:var(--bg-1);}
.orbit .item:nth-of-type(2){animation-delay:-7.33s;background:linear-gradient(150deg,var(--accent-b),var(--accent-b-dark));color:#fff;}
.orbit .item:nth-of-type(3){animation-delay:-14.66s;background:linear-gradient(150deg,var(--accent-c),var(--accent-c-dark));color:#fff;}

/* ============================================================
   TILES
   ============================================================ */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.tile{
  border-radius:var(--r-blob);padding:18px;
  background:var(--surface);backdrop-filter:blur(20px);
  border:1px solid var(--border-1);box-shadow:var(--shadow-soft);
  cursor:pointer;transition:all .3s var(--ease-spring), background var(--dur-slow);
  position:relative;overflow:hidden;
}
.tile:active{transform:scale(.97);}
.tile.tall{grid-row:span 2;}
.tile.hero{grid-column:span 2;}
.tile .deco{position:absolute;border-radius:50%;filter:blur(20px);opacity:.5;pointer-events:none;}
.tile .deco.d1{width:100px;height:100px;background:radial-gradient(circle,var(--accent-1),transparent 70%);top:-30px;right:-30px;}
.tile .deco.d2{width:120px;height:120px;background:radial-gradient(circle,var(--accent-b),transparent 70%);bottom:-40px;left:-40px;}

.chip-scroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 8px;}
.chip-scroll::-webkit-scrollbar{display:none;}

/* stories */
.story-bubbles{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;}
.story-bubbles::-webkit-scrollbar{display:none;}
.bub{display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0;cursor:pointer;width:64px;}
.bub-ring{width:60px;height:60px;border-radius:50%;padding:3px;background:linear-gradient(150deg,var(--accent-1),var(--accent-2));display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px var(--glow);transition:background var(--dur-slow);}
.bub-ring.seen{background:linear-gradient(150deg,var(--text-3),var(--text-2));box-shadow:none;opacity:.5;}
.bub-ring.you{background:conic-gradient(from 220deg,var(--accent-2) 0 35%, var(--text-3) 35% 100%);}
.bub-ring.biz{background:linear-gradient(150deg,var(--accent-b),var(--accent-b-dark));box-shadow:0 8px 20px var(--glow-b);}
.bub-inner{width:100%;height:100%;border-radius:50%;background:var(--surface-solid);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--accent-3);border:2.5px solid var(--bg-1);}
.bub-inner.biz{color:var(--accent-b-dark);}
.bub-name{font-size:10.5px;font-weight:600;color:var(--text-2);letter-spacing:.1px;}

/* post */
.post-soft{border-radius:var(--r-blob);padding:20px;margin-bottom:14px;background:var(--surface);backdrop-filter:blur(20px);border:1px solid var(--border-1);box-shadow:var(--shadow-soft);cursor:pointer;transition:background var(--dur-slow);}
.post-soft .head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.post-soft .av-orb{width:40px;height:40px;font-size:13px;}
.post-soft .meta .n{font-size:13.5px;font-weight:600;color:var(--text-1);display:flex;align-items:center;gap:6px;}
.post-soft .meta .t{font-size:11px;color:var(--text-3);margin-top:2px;}
.post-soft .body{font-size:14px;line-height:1.6;color:var(--text-2);letter-spacing:.1px;margin-bottom:14px;}
.post-soft .media{height:140px;border-radius:24px;margin-bottom:14px;background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.4), transparent 60%), linear-gradient(150deg,var(--accent-1),var(--accent-2));display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;opacity:.85;transition:background var(--dur-slow);}
.post-soft .media.mint{background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.4), transparent 60%), linear-gradient(150deg,var(--accent-b),var(--accent-b-dark));}
.post-soft .actions{display:flex;align-items:center;gap:20px;color:var(--text-2);font-size:12.5px;font-weight:500;}
.post-soft .act{display:flex;align-items:center;gap:6px;cursor:pointer;transition:color .2s, transform .2s var(--ease-spring);}
.post-soft .act svg{width:18px;height:18px;}
.post-soft .act.liked{color:var(--accent-3);}
.post-soft .act.saved{color:var(--accent-3);}
.post-soft .act:active{transform:scale(.9);}

.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r-pill);font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
.pill.biz{background:rgba(159,184,168,.2);color:var(--accent-b-dark);}
.pill.gold{background:rgba(196,164,124,.2);color:var(--accent-3);}
.pill.active{background:rgba(143,184,154,.18);color:#5A8068;}
.pill.warn{background:rgba(221,184,120,.2);color:#A07E30;}

/* list */
.list-soft{display:flex;flex-direction:column;gap:8px;}
.list-soft .item{
  display:flex;align-items:center;gap:14px;
  padding:16px 18px;border-radius:26px;
  background:var(--surface);backdrop-filter:blur(14px);
  border:1px solid var(--border-1);box-shadow:var(--shadow-tiny);
  cursor:pointer;transition:all .25s;
  width:100%;text-align:left;font-family:inherit;color:inherit;
}
.list-soft .item:active{transform:scale(.98);background:var(--surface-solid);}
.lic-soft{width:42px;height:42px;border-radius:50%;background:linear-gradient(150deg,var(--accent-1),var(--accent-2));display:flex;align-items:center;justify-content:center;color:var(--bg-1);flex-shrink:0;box-shadow:0 6px 16px var(--glow);transition:background var(--dur-slow);}
.lic-soft.b{background:linear-gradient(150deg,var(--accent-b),var(--accent-b-dark));color:#fff;box-shadow:0 6px 16px var(--glow-b);}
.lic-soft.c{background:linear-gradient(150deg,var(--accent-c),var(--accent-c-dark));color:#fff;}
.lic-soft.d{background:linear-gradient(150deg,var(--accent-d),var(--accent-d-dark));color:#fff;}
.lic-soft.err{background:linear-gradient(150deg,#E8B8B8,#D88A8A);color:#fff;}
.lic-soft svg{width:18px;height:18px;}

/* toast */
.toast{position:absolute;bottom:130px;left:50%;transform:translateX(-50%) translateY(20px) scale(.95);padding:14px 22px;border-radius:var(--r-pill);background:rgba(30,30,34,.94);color:#F0F0F4;backdrop-filter:blur(20px);font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .35s var(--ease-spring);z-index:300;box-shadow:0 20px 40px rgba(0,0,0,.35);max-width:320px;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}
.toast.err{background:rgba(216,138,138,.96);color:#fff;}
.toast.ok{background:rgba(143,184,154,.96);color:#fff;}

/* sheet */
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);z-index:190;opacity:0;pointer-events:none;transition:.3s;}
.sheet-bg.open{opacity:1;pointer-events:auto;}
.sheet{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,var(--surface-solid) 0%, var(--bg-1) 100%);border-radius:40px 40px 0 0;padding:14px 22px 38px;transform:translateY(100%);transition:transform .5s var(--ease-spring), background var(--dur-slow);max-height:80vh;overflow-y:auto;box-shadow:0 -20px 40px rgba(0,0,0,.2);}
.sheet.open{transform:translateY(0);}
.sheet-handle{width:46px;height:5px;border-radius:3px;background:var(--text-3);opacity:.4;margin:0 auto 20px;}

/* otp */
.otp-row{display:flex;gap:10px;justify-content:center;margin:26px 0;}
.otp-pill{width:48px;height:60px;border-radius:22px;background:var(--surface);backdrop-filter:blur(14px);border:1px solid var(--border-1);box-shadow:inset 0 2px 6px rgba(0,0,0,.06), var(--shadow-tiny);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:var(--text-1);font-family:Georgia,serif;transition:.3s;cursor:text;}
.otp-pill.filled{background:linear-gradient(150deg,var(--accent-1),var(--accent-2));border-color:transparent;color:var(--bg-1);}
.otp-pill.focused{background:var(--surface-solid);box-shadow:0 0 0 4px var(--glow), var(--shadow-soft);border-color:var(--accent-2);}
.otp-pill.err{background:rgba(216,138,138,.15);border-color:rgba(216,138,138,.4);color:#A06060;}

.prog{height:6px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden;border:1px solid var(--border-1);}
.prog > div{height:100%;background:linear-gradient(90deg,var(--accent-1),var(--accent-2));border-radius:var(--r-pill);transition:width .6s var(--ease-spring), background var(--dur-slow);}

.empty-soft{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 20px;gap:18px;}
.empty-soft .orb{width:140px;height:140px;background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.5), transparent 50%), linear-gradient(150deg,var(--accent-1),var(--accent-2));animation:morphBlob 10s ease-in-out infinite, breathe 4s ease-in-out infinite;display:flex;align-items:center;justify-content:center;box-shadow:0 24px 50px var(--glow), inset -8px -12px 24px rgba(0,0,0,.1), inset 8px 12px 24px rgba(255,255,255,.3);margin-bottom:6px;transition:background var(--dur-slow);}
.empty-soft h3{font-size:19px;font-weight:600;color:var(--text-1);font-family:Georgia,serif;letter-spacing:-.3px;}
.empty-soft p{font-size:13.5px;color:var(--text-2);max-width:250px;line-height:1.6;}

.sk-soft{background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:shimmer 1.6s infinite;border-radius:28px;}

/* reels */
.reels-host{position:absolute;inset:0;background:#000;overflow:hidden;}
.reel-full{position:absolute;inset:0;opacity:0;transition:opacity .5s;pointer-events:none;overflow:hidden;}
.reel-full.active{opacity:1;pointer-events:auto;}
.reel-full .bg{position:absolute;inset:0;}
.reel-full .grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.4) 0%,transparent 25%,transparent 55%,rgba(0,0,0,.75) 100%);}
.reel-full .progress-row{position:absolute;top:20px;left:20px;right:20px;display:flex;gap:6px;}
.reel-full .progress-row .bar{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden;}
.reel-full .progress-row .bar.active{background:#fff;}
.reel-full .bottom{position:absolute;left:0;right:0;bottom:120px;padding:0 22px;display:flex;align-items:flex-end;gap:16px;}
.reel-full .info{flex:1;min-width:0;}
.reel-full .user{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.reel-full .user .av-orb{width:42px;height:42px;font-size:14px;}
.reel-full .user .nm{font-size:14.5px;font-weight:700;color:#fff;display:flex;align-items:center;gap:6px;}
.reel-full .user .hd{font-size:11.5px;color:rgba(255,255,255,.75);margin-top:2px;}
.reel-full .caption{font-size:14px;color:rgba(255,255,255,.95);line-height:1.5;margin-bottom:12px;}
.reel-full .nfc-pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:100px;background:rgba(255,255,255,.18);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.3);font-size:11.5px;font-weight:700;color:#fff;cursor:pointer;}
.reel-full .actions{display:flex;flex-direction:column;gap:20px;align-items:center;}
.reel-full .act-col{display:flex;flex-direction:column;align-items:center;gap:5px;color:#fff;cursor:pointer;transition:color .2s, transform .2s var(--ease-spring);}
.reel-full .act-col:active{transform:scale(.9);}
.reel-full .act-col svg{width:28px;height:28px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));}
.reel-full .act-col span{font-size:10.5px;font-weight:600;}
.reel-full .act-col.liked svg{color:var(--accent-1);}
.reel-full .act-col.saved svg{color:var(--accent-1);}

/* product */
.prod-soft{border-radius:var(--r-blob);overflow:hidden;background:var(--surface);border:1px solid var(--border-1);box-shadow:var(--shadow-soft);cursor:pointer;transition:all .3s var(--ease-spring);}
.prod-soft:active{transform:scale(.98);}
.prod-soft .img{height:150px;background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.4), transparent 55%), linear-gradient(150deg,var(--accent-1),var(--accent-2));display:flex;align-items:center;justify-content:center;position:relative;opacity:.9;transition:background var(--dur-slow);}
.prod-soft .info{padding:14px 16px 18px;}
.prod-soft .nm{font-size:13.5px;font-weight:600;color:var(--text-1);margin-bottom:6px;}
.prod-soft .pr{font-size:15px;font-weight:700;color:var(--accent-3);letter-spacing:-.2px;}

.mode-switch{display:flex;padding:5px;border-radius:var(--r-pill);background:var(--surface-2);border:1px solid var(--border-1);margin-bottom:20px;}
.mode-switch .m{flex:1;padding:12px;border-radius:var(--r-pill);text-align:center;font-size:13px;font-weight:700;color:var(--text-3);cursor:pointer;transition:.4s var(--ease-spring);letter-spacing:.2px;}
.mode-switch .m.active{background:var(--surface-solid);color:var(--text-1);box-shadow:var(--shadow-tiny), inset 0 1px 0 rgba(255,255,255,.6);}

/* confirmation animation */
@keyframes confirmationPop{0%{transform:scale(.6);opacity:0;}60%{transform:scale(1.06);}100%{transform:scale(1);opacity:1;}}
.confirm-orb{animation:confirmationPop .7s var(--ease-spring) both;}

/* success pulse */
@keyframes successPulse{0%{box-shadow:0 0 0 0 var(--glow);}100%{box-shadow:0 0 0 60px transparent;}}
.success-pulse{animation:successPulse 1.2s ease-out;}

@media (max-width:900px){.review{display:none;}}
</style>

function nav(id, opts={}){
  if(!SCREENS[id]){ toast('Ekran topilmadi','err'); return; }
  if(!opts.replace && S.current !== id) S.history.push(S.current);
  S.current = id;
  const sc = SCREENS[id];
  const vp = document.getElementById('viewport');
  vp.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'screen' + (sc.bleed?' fullbleed':'');
  el.dataset.screen = id;
  el.innerHTML = sc.render();
  vp.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('active'));
  const bnav = document.getElementById('bottomNav');
  if(sc.hideNav){ bnav.classList.add('hidden'); }
  else { bnav.classList.remove('hidden'); bnav.innerHTML = renderBottomNav(sc.tab); }
  document.querySelectorAll('.review .item').forEach(i=>i.classList.toggle('active', i.dataset.screen === id));
  el.scrollTop = 0;
  requestAnimationFrame(()=>initOTP());
  if(id === 'reels') requestAnimationFrame(bindReels);
}
function back(){ const prev = S.history.pop() || 'home'; nav(prev, {replace:true}); }
function renderBottomNav(active){
  const tabs = [
    {id:'home',label:'Home',icon:I.home},
    {id:'discover',label:'Discover',icon:I.search},
    {id:'reels',label:'Reels',icon:I.reels,center:true},
    {id:'nfc',label:'NFC',icon:I.nfc},
    {id:'profile',label:'Profile',icon:I.user}
  ];
  return tabs.map(t=>`
    <button class="bnav-item ${t.center?'center':''} ${active===t.id?'active':''}" onclick="nav('${t.id}')">
      ${t.center ? `<div class="wrap">${t.icon}</div>` : t.icon}
      <span>${t.label}</span>
    </button>`).join('');
}

/* OTP */
let otpVal = ['','','','','',''];
let otpBound = false;
function initOTP(){
  const cells = document.querySelectorAll('.otp-pill[data-idx]');
  if(!cells.length) return;
  otpVal = ['','','','','',''];
  cells.forEach(c=>c.addEventListener('click',()=>focusOTP(parseInt(c.dataset.idx))));
  focusOTP(0);
  if(!otpBound){ document.addEventListener('keydown', otpKey); otpBound = true; }
}
function otpKey(e){
  const cells = document.querySelectorAll('.otp-pill[data-idx]');
  if(!cells.length) return;
  const f = document.querySelector('.otp-pill.focused');
  if(!f) return;
  const i = parseInt(f.dataset.idx);
  if(e.key>='0' && e.key<='9'){ e.preventDefault(); setOTP(i,e.key); }
  else if(e.key==='Backspace'){ e.preventDefault(); clearOTP(i); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); focusOTP(i-1); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); focusOTP(i+1); }
}
function setOTP(i,v){
  if(i<0||i>5) return;
  otpVal[i]=v;
  const c = document.querySelector(`.otp-pill[data-idx="${i}"]`);
  if(!c) return;
  c.textContent = v; c.classList.add('filled'); c.classList.remove('focused');
  if(i<5) focusOTP(i+1);
  updateOTP();
}
function clearOTP(i){
  if(i<0||i>5) return;
  otpVal[i]='';
  const c = document.querySelector(`.otp-pill[data-idx="${i}"]`);
  if(c){ c.textContent=''; c.classList.remove('filled','err'); }
  if(i>0) focusOTP(i-1); else focusOTP(0);
  updateOTP();
}
function focusOTP(i){
  if(i<0||i>5) return;
  document.querySelectorAll('.otp-pill').forEach(c=>c.classList.remove('focused'));
  const c = document.querySelector(`.otp-pill[data-idx="${i}"]`);
  if(!c) return;
  if(!c.textContent){ c.classList.add('focused'); }
  else if(i<5){ focusOTP(i+1); }
}
function updateOTP(){
  const full = otpVal.every(v=>v);
  const btn = document.getElementById('otpBtn');
  if(btn) btn.disabled = !full;
}

/* ============================================================
   INTERACTIONS
   ============================================================ */
function toggleLike(el){
  el.classList.toggle('liked');
  const ic = el.querySelector('div');
  if(ic) ic.innerHTML = el.classList.contains('liked') ? I.heartF : I.heart;
  const sp = el.querySelector('span');
  if(sp){ const n = parseInt(sp.textContent)||0; sp.textContent = el.classList.contains('liked') ? n+1 : Math.max(0,n-1); }
}
function toggleSave(el){
  if(el.tagName === 'BUTTON'){
    el.classList.toggle('saved');
    el.innerHTML = el.classList.contains('saved') ? I.bookmarkF : I.bookmark;
    el.style.color = el.classList.contains('saved') ? 'var(--accent-3)' : '';
    toast(el.classList.contains('saved') ? 'Saqlandi' : 'Saqlashdan olindi', el.classList.contains('saved') ? 'ok' : '');
    return;
  }
  const saved = el.classList.contains('saved');
  el.classList.toggle('saved');
  el.innerHTML = saved ? I.bookmark : I.bookmarkF;
  toast(saved ? 'Saqlashdan olindi' : 'Saqlandi', saved ? '' : 'ok');
}
function toggleFollow(el){
  const t = el.textContent.trim();
  if(t === 'Following' || t === 'Followed'){
    el.textContent = '+ Follow';
    el.style.background = ''; el.style.color = '';
  } else {
    el.textContent = 'Following';
    el.style.background = 'linear-gradient(150deg,var(--accent-b),var(--accent-b-dark))';
    el.style.color = '#fff';
    toast('Follow qilindi','ok');
  }
}
function bindReels(){
  const h = document.getElementById('reelsHost');
  if(!h) return;
  let sy = 0;
  h.addEventListener('touchstart', e => { sy = e.touches[0].clientY; });
  h.addEventListener('touchend', e => { const d = sy - e.changedTouches[0].clientY; if(Math.abs(d)>50) setReel(S.currentReel + (d>0?1:-1)); });
  h.addEventListener('wheel', e => { if(Math.abs(e.deltaY)<20) return; setReel(S.currentReel + (e.deltaY>0?1:-1)); }, {passive:true});
}

/* ============================================================
   REVIEW PANEL
   ============================================================ */
function buildReviewPanel(){
  document.getElementById('reviewLogo').innerHTML = BRAND_LOGO(26,{dark:true});
  const groups = {};
  Object.entries(SCREENS).forEach(([id, sc]) => {
    const g = sc.group || 'Other';
    if(!groups[g]) groups[g] = [];
    groups[g].push([id, sc.title, sc.demo, sc.future]);
  });
  const order = ['Entry','Auth','Core','Social','NFC','Profile','Business','Shop','System','States'];
  let html = '';
  order.forEach(g=>{
    if(!groups[g]) return;
    html += `<div class="group"><h2>${g}</h2>`;
    groups[g].forEach(([id,title,demo,future])=>{
      const tag = demo?'<span class="demo">DEMO</span>':future?'<span class="future">FUTURE</span>':'';
      html += `<div class="item" data-screen="${id}" onclick="nav('${id}')"><span class="dot"></span>${title}${tag}</div>`;
    });
    html += `</div>`;
  });
  document.getElementById('screenList').innerHTML = html;
}
function setTheme(th){
  S.theme = th;
  document.documentElement.setAttribute('data-theme', th);
  document.querySelectorAll('.review .theme-sw button').forEach(b=>b.classList.toggle('active', b.dataset.th === th));
  document.getElementById('reviewLogo').innerHTML = BRAND_LOGO(26,{dark:true});
}
function setDevice(w){
  S.device = w;
  document.documentElement.setAttribute('data-device', String(w));
  document.documentElement.style.setProperty('--phone-w', String(w));
  document.querySelectorAll('.review #deviceSw button').forEach(b=>b.classList.toggle('active', parseInt(b.dataset.dev) === w));
}
const galleryOrder = Object.keys(SCREENS);
function setViewMode(mode){
  S.galleryMode = mode === 'gallery';
  document.querySelectorAll('.review #viewSw button').forEach(b=>b.classList.toggle('active', b.dataset.view === mode));
  const stage = document.getElementById('stage');
  if(mode === 'gallery'){
    stage.classList.add('gallery');
    document.getElementById('phone').style.display = 'none';
    let gal = document.getElementById('galleryHost');
    if(!gal){ gal = document.createElement('div'); gal.id = 'galleryHost'; stage.appendChild(gal); }
    gal.style.cssText = 'display:flex;flex-wrap:wrap;gap:28px;justify-content:center;width:100%;';
    gal.innerHTML = '';
    galleryOrder.forEach(id=>{
      const sc = SCREENS[id]; if(!sc) return;
      const wrap = document.createElement('div');
      const scale = S.device / 390;
      wrap.style.cssText = `width:${S.device}px;height:${844*scale}px;position:relative;flex-shrink:0;transform:scale(.55);transform-origin:top center;margin:-${844*scale*0.22}px 0 -${844*scale*0.22}px;`;
      wrap.innerHTML = `<div class="phone" style="position:absolute;top:0;left:0;width:${S.device}px;height:${844*scale}px;">
        <div class="statusbar"><div>9:41</div><div class="status-right">
          <svg viewBox="0 0 17 11" fill="currentColor" style="width:14px;"><rect y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" width="3" height="11" rx="1"/></svg>
        </div></div>
        <div class="viewport"><div class="screen active" style="padding-bottom:20px;">${sc.render()}</div></div>
      </div>`;
      const lb = document.createElement('div');
      lb.style.cssText = 'position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:#B8B8BE;letter-spacing:.4px;';
      lb.textContent = sc.title;
      wrap.appendChild(lb);
      gal.appendChild(wrap);
    });
  } else {
    stage.classList.remove('gallery');
    document.getElementById('phone').style.display = '';
    const gal = document.getElementById('galleryHost'); if(gal) gal.remove();
    nav(S.current, {replace:true});
  }
}

function clock(){ const d = new Date(); document.getElementById('clock').textContent = `${d.getHours()}:${d.getMinutes().toString().padStart(2,'0')}`; }
clock(); setInterval(clock, 30000);

document.querySelectorAll('#deviceSw button').forEach(b=> b.addEventListener('click', ()=>setDevice(parseInt(b.dataset.dev))));
document.querySelectorAll('#themeSw button').forEach(b=> b.addEventListener('click', ()=>setTheme(b.dataset.th)));
document.querySelectorAll('#viewSw button').forEach(b=> b.addEventListener('click', ()=>setViewMode(b.dataset.view)));

buildReviewPanel();
setDevice(390);
setTheme('pearl');
nav('welcome');
</script>
