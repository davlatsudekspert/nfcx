# Gradle JVM xotirasi — RUNNER'GA MOS.
#
# Ilgari bu yerda `-Xmx8G -XX:MaxMetaspaceSize=4G` turardi: bu ikkisi
# birgalikda GitHub Actions runnerining butun operativ xotirasidan
# ko'p. Yuk kichik bo'lgan paytda build baribir o'tib ketardi, lekin
# `local_auth` (androidx.biometric) qo'shilgach R8 bosqichida JVM
# swapga tushib, build BUTUNLAY QOTIB QOLDI — ikki urinishda ham
# "Universal APK" bosqichida 60 daqiqadan ortiq osilib turdi va
# xatolik ham bermadi.
#
# 4G heap R8 va AAPT2 uchun yetarli, metaspace esa 1G dan oshmaydi.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

android.useAndroidX=true

# `android.enableJetifier` ATAYLAB YO'Q.
#
# U har bir bog'liqlikni AndroidX ga qayta yozadi va buni HAR
# BUILDDA qiladi — sekinlikning katta qismi shundan. Loyihadagi
# barcha plaginlar allaqachon AndroidX, ya'ni jetifier hech narsani
# tuzatmay, faqat vaqt yeyardi.
