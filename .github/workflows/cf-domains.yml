# CLOUDFLARE DOMENLARINI KO'RISH VA KO'CHIRISH.
#
# NIMA UCHUN BU FAYL BOR. 2026-09-15 da sayt ham, ilova ham ishlamay
# qoldi. Sabab kodda emas edi: `nfcstore.uz` domeni `nfcstore-uz`
# Worker'iga ulangan, deploy esa (ikkala yo'l ham) `nfcstore-api` ga
# chiqadi — chunki `wrangler.jsonc` da shu nom yozilgan. Ya'ni yangi
# kod bir Worker'ga, foydalanuvchilar esa boshqasiga tushardi.
#
# Tuzatish Cloudflare panelida bir necha bosish, lekin panelga kirish
# har kimda ham yo'q. Shu workflow o'sha ishni API orqali qiladi —
# repoda allaqachon mavjud `CLOUDFLARE_API_TOKEN` bilan.
#
# XAVFSIZLIK: standart rejim — FAQAT O'QISH. Hech narsa
# o'zgartirilmaydi, shunchaki qaysi domen qaysi Worker'da ekani
# chiqariladi. O'zgartirish uchun `mode: apply` ni QO'LDA tanlash
# kerak va u tasdiq so'zini ham talab qiladi.
name: Cloudflare domenlari

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "read = faqat ko'rish (xavfsiz). apply = domenni ko'chirish."
        required: true
        default: read
        type: choice
        options: [read, apply]
      target:
        description: "Domen qaysi Worker'ga ulansin"
        required: true
        default: nfcstore-uz
        type: choice
        options: [nfcstore-uz, nfcstore-api]
      drop_routes:
        description: "nfcstore-api dagi eski /api/* marshrutlarini o'chirish"
        required: false
        default: false
        type: boolean
      confirm:
        description: "apply uchun: aynan KO'CHIR deb yozing"
        required: false
        default: ''
  push:
    branches:
      - claude/adoring-ritchie-whjcgs
    paths:
      - '.github/workflows/cf-domains.yml'

permissions:
  contents: read

jobs:
  domains:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Dashboard havolasidan olingan (dash.cloudflare.com/<account_id>/...).
      CF_ACCOUNT: 31c4b3d8ece4b65de515debc4552334a
      MODE: ${{ inputs.mode || 'read' }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Token bormi
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret yo'q."
            exit 1
          fi
          echo "Token bor (uzunligi: ${#CF_API_TOKEN})."

      # Token qanday huquqlarga ega ekanini AVVAL bilib olamiz — aks
      # holda o'zgartirish yarim yo'lda to'xtab, sayt umuman ochilmay
      # qolishi mumkin edi.
      - name: Token tekshiruvi
        run: |
          curl -sS -H "Authorization: Bearer $CF_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify \
            | python3 -m json.tool

      - name: Worker domenlari (faqat o'qish)
        run: |
          echo "=== Hisobdagi barcha Worker Custom Domain'lari ==="
          curl -sS -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/domains" \
            > domains.json
          python3 - <<'PY'
          import json
          d = json.load(open('domains.json'))
          if not d.get('success'):
              print('SO\'ROV RAD ETILDI:', json.dumps(d.get('errors'), ensure_ascii=False))
              raise SystemExit(0)
          rows = d.get('result') or []
          if not rows:
              print('Custom Domain topilmadi.')
          for r in rows:
              print('%-26s -> %-16s (zone: %s, id: %s)' % (
                  r.get('hostname'), r.get('service'), r.get('zone_name'), r.get('id')))
          json.dump(rows, open('rows.json', 'w'))
          PY

      - name: Domenni ko'chirish
        if: ${{ inputs.mode == 'apply' }}
        env:
          TARGET: ${{ inputs.target }}
        run: |
          if [ "$CONFIRM" != "KO'CHIR" ]; then
            echo "::error::Tasdiq so'zi noto'g'ri. `confirm` maydoniga aynan: KO'CHIR"
            exit 1
          fi
          python3 - <<'PY'
          import json, os, subprocess, sys

          TOKEN = os.environ['CF_API_TOKEN']
          ACC = os.environ['CF_ACCOUNT']
          BASE = f'https://api.cloudflare.com/client/v4/accounts/{ACC}/workers/domains'
          # QAYSI WORKER'DA YANGI KOD BOR — TEKSHIRIB ANIQLANDI.
          #
          # Avval `wrangler.jsonc` dagi nomga qarab `nfcstore-api` deb
          # xulosa qilingan edi. Bu NOTO'G'RI bo'lib chiqdi: Cloudflare
          # Workers Builds skript nomini o'zi biriktirilgan Worker'ga
          # majburan o'zgartiradi, ya'ni Git integratsiyasi aslida
          # `nfcstore-uz` ni yangilab turgan. Uchala manzil yonma-yon
          # so'roq qilinganda aniq ko'rindi:
          #   nfcstore-uz  /api/feed -> 200 {"feed":[...]}   YANGI
          #   nfcstore-api /api/feed -> 404 not_found        ESKI
          # Shuning uchun nishon endi taxmin emas, kirish maydonidan.
          TARGET = os.environ.get('TARGET') or 'nfcstore-uz'
          HOSTS = ['nfcstore.uz', 'www.nfcstore.uz']

          # BO'SH JAVOB = MUVAFFAQIYAT, XATO EMAS.
          #
          # Bu yerda haqiqiy zarar yetkazgan xato bor edi. Cloudflare
          # DELETE uchun `204 No Content` va BO'SH tana qaytaradi.
          # Ilgari bu funksiya bo'sh tanani JSON deb o'qiy olmay
          # `success: False` derdi. Natijada skript "o'chirish rad
          # etildi, hech narsa o'zgarmadi" deb yozdi — HOLBUKI
          # `nfcstore.uz` bog'lanishi O'CHIB KETGAN edi va qayta
          # qo'shilmadi. Domen umuman yo'qoldi ("Could not resolve
          # host"). Endi bo'sh tana muvaffaqiyat deb qaraladi.
          def api(method, url, body=None):
              cmd = ['curl', '-sS', '-X', method, '-H', f'Authorization: Bearer {TOKEN}',
                     '-H', 'Content-Type: application/json', url]
              if body is not None:
                  cmd += ['--data', json.dumps(body)]
              out = subprocess.run(cmd, capture_output=True, text=True).stdout
              if not out.strip():
                  return {'success': True, 'result': None, 'errors': []}
              try:
                  return json.loads(out)
              except Exception:
                  return {'success': False, 'errors': [{'message': out[:400]}]}

          def zone_of(host):
              """Hostning zonasi. Bog'lanish umuman yo'q bo'lsa ham kerak."""
              apex = '.'.join(host.split('.')[-2:])
              r = api('GET', f'https://api.cloudflare.com/client/v4/zones?name={apex}')
              res = r.get('result') or []
              return res[0]['id'] if res else None

          rows = json.load(open('rows.json'))
          by_host = {r.get('hostname'): r for r in rows}

          for host in HOSTS:
              cur = by_host.get(host)

              # BOG'LANISH YO'Q BO'LSA — O'TKAZIB YUBORMAYMIZ, QO'SHAMIZ.
              # Ilgari bu yerda `continue` turardi va aynan shu sabab
              # o'chib ketgan `nfcstore.uz` tiklanmadi: skript uni
              # "yo'q ekan" deb tinchgina tashlab ketdi.
              if cur is None:
                  zid = zone_of(host)
                  if not zid:
                      print(f'{host}: zona topilmadi — qo\'lda qo\'shish kerak.')
                      sys.exit(1)
                  print(f'{host}: bog\'lanish YO\'Q — yangidan qo\'shilyapti')
                  r = api('PUT', BASE, {'environment': 'production', 'hostname': host,
                                        'service': TARGET, 'zone_id': zid,
                                        'override_existing_origin': True})
                  if not r.get('success'):
                      print('  QO\'SHISH RAD ETILDI:', json.dumps(r.get('errors'), ensure_ascii=False))
                      sys.exit(1)
                  print(f'  {TARGET} ga ulandi')
                  continue

              if cur.get('service') == TARGET:
                  print(f'{host}: allaqachon {TARGET} da — tegilmadi.')
                  continue

              zone_id = cur.get('zone_id')
              print(f'{host}: {cur.get("service")} -> {TARGET}')
              body = {'environment': 'production', 'hostname': host,
                      'service': TARGET, 'zone_id': zone_id}

              # AVVAL BUZMAYDIGAN YO'L. Ilgari bu yerda "eskisini
              # o'chirib, keyin yangisini qo'shish" tartibi edi. U
              # xavfli: agar o'chirish o'tib, qo'shish rad etilsa
              # (token huquqi yetmasa) domen HECH QAYSI Worker'da
              # qolmaydi va sayt umuman ochilmaydi. Shuning uchun
              # avval to'g'ridan-to'g'ri qayta biriktirib ko'ramiz —
              # o'tsa, uzilish umuman bo'lmaydi.
              #
              # `override_existing_origin` — AYNAN SHU HOLAT UCHUN.
              # Birinchi urinishda Cloudflare shunday javob berdi:
              #   100116: Hostname 'nfcstore.uz' already in use by
              #   other custom domain. Either delete it, try a
              #   different hostname, or use the option
              #   'override_existing_origin' to override.
              # Ya'ni host band bo'lgani XATO emas — buni bildirib
              # qo'yish kerak ekan. Shu bayroq bilan almashtirish
              # JOYIDA bo'ladi: eski bog'lanishni o'chirish shart
              # emas, demak domen bir lahza ham bo'sh qolmaydi.
              r = api('PUT', BASE, dict(body, override_existing_origin=True))
              if r.get('success'):
                  print(f'  {TARGET} ga ulandi (uzilishsiz)')
                  continue

              print('  to\'g\'ridan-to\'g\'ri ulanmadi:',
                    json.dumps(r.get('errors'), ensure_ascii=False))

              # Zaxira yo'l: bitta host bir vaqtda faqat BITTA
              # Worker'ning Custom Domain'i bo'la oladi, shuning uchun
              # eskisini bo'shatib qayta urinamiz. Shu paytdan
              # boshlab qisqa uzilish bo'lishi mumkin.
              r = api('DELETE', f'{BASE}/{cur["id"]}')
              if not r.get('success'):
                  print('  O\'CHIRISH HAM RAD ETILDI:', json.dumps(r.get('errors'), ensure_ascii=False))
                  print('  Hech narsa o\'zgarmadi — sayt avvalgidek ishlaydi.')
                  sys.exit(1)
              print('  eski bog\'lanish olindi')

              r = api('PUT', BASE, body)
              if not r.get('success'):
                  print('  QO\'SHISH RAD ETILDI:', json.dumps(r.get('errors'), ensure_ascii=False))
                  print('  DIQQAT: domen hozir hech qaysi Worker\'da emas.')
                  print('  Panelda qo\'lda qo\'shing: nfcstore-api -> Domains -> Add Domain')
                  sys.exit(1)
              print(f'  {TARGET} ga ulandi')

          print('\n=== Yakuniy holat ===')
          r = api('GET', BASE)
          for x in (r.get('result') or []):
              print('%-26s -> %s' % (x.get('hostname'), x.get('service')))
          PY

      # ESKI MARSHRUTLARNI OLIB TASHLASH.
      #
      # `nfcstore-api` da `nfcstore.uz/api/*` va `/uploads/*` uchun
      # Route'lar bor. Route Custom Domain'dan ANIQROQ, shuning uchun
      # domen qayerga ulangan bo'lsa ham `/api/*` o'sha eski Worker'ga
      # tushardi. Ilovadagi "Topilmadi. not_found 404" ning sababi
      # aynan shu edi: sayt yangi Worker'dan, API esa eskisidan
      # kelardi. Domenni to'g'rilashning O'ZI yetmaydi — bu marshrutlar
      # turganda API baribir eski koddan javob beradi.
      - name: Eski /api/* marshrutlarini o'chirish
        if: ${{ inputs.mode == 'apply' && inputs.drop_routes }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          TOKEN = os.environ['CF_API_TOKEN']

          def api(method, url, body=None):
              cmd = ['curl', '-sS', '-X', method, '-H', f'Authorization: Bearer {TOKEN}',
                     '-H', 'Content-Type: application/json', url]
              if body is not None:
                  cmd += ['--data', json.dumps(body)]
              out = subprocess.run(cmd, capture_output=True, text=True).stdout
              if not out.strip():
                  return {'success': True, 'result': None, 'errors': []}
              try:
                  return json.loads(out)
              except Exception:
                  return {'success': False, 'errors': [{'message': out[:400]}]}

          z = api('GET', 'https://api.cloudflare.com/client/v4/zones?name=nfcstore.uz')
          res = z.get('result') or []
          if not res:
              print('Zona topilmadi.')
              raise SystemExit(0)
          zid = res[0]['id']
          base = f'https://api.cloudflare.com/client/v4/zones/{zid}/workers/routes'

          routes = api('GET', base).get('result') or []
          if not routes:
              print('Marshrut yo\'q.')
          for rt in routes:
              print('%-34s -> %s' % (rt.get('pattern'), rt.get('script')))
              d = api('DELETE', f"{base}/{rt['id']}")
              print('   o\'chirildi' if d.get('success')
                    else '   RAD ETILDI: ' + json.dumps(d.get('errors'), ensure_ascii=False))

          print('\n=== Qolgan marshrutlar ===')
          for rt in (api('GET', base).get('result') or []):
              print('%-34s -> %s' % (rt.get('pattern'), rt.get('script')))
          PY

      # NIMA QAYERDAN KELAYOTGANINI AJRATISH.
      #
      # Faqat HTTP kodiga qarash yetmaydi: `/api/feed` uchun 404
      # ikki xil sababdan chiqishi mumkin va ular butunlay boshqa
      # narsa:
      #   - Worker ishladi va `{"error":"not_found"}` qaytardi —
      #     demak marshrut deploy qilingan koda yo'q;
      #   - Worker umuman ishlamadi va statik xizmat javob berdi —
      #     demak so'rov Worker'ga yetib bormayapti.
      # Shuning uchun javobning BOSHI ham chiqariladi.
      - name: Qaysi Worker nima javob beradi
        run: |
          probe() {
            echo "--- $1"
            code=$(curl -sS -o body.txt -w '%{http_code}' --max-time 25 "$1" 2>/dev/null || echo 000)
            echo "    HTTP $code | $(head -c 120 body.txt | tr '\n' ' ')"
          }
          for base in https://nfcstore.uz \
                      https://nfcstore-api.davlatsudekspert.workers.dev \
                      https://nfcstore-uz.davlatsudekspert.workers.dev; do
            echo "=========== $base"
            probe "$base/api/feed"
            probe "$base/api/catalog"
            probe "$base/api/settings/payments-enabled"
          done
