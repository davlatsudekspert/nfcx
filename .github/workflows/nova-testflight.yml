name: NFCSTORE signed iOS

on:
  push:
    branches: ['ui/theme-controls']
    paths: ['.github/workflows/nova-testflight.yml']
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Upload the verified IPA to TestFlight (API secrets required)
        type: boolean
        default: false

concurrency:
  group: nova-signed-ios-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  signed:
    if: github.ref == 'refs/heads/ui/theme-controls'
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile_nova
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      IOS_TEAM_ID: 5Z9CT2W378
      IOS_BUNDLE_ID: uz.nfcstore.nova

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable
          cache: true
      - name: Xcode and packages
        run: |
          set -euo pipefail
          xcodebuild -version
          flutter pub get

      - name: Install signing credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.NOVA_IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.NOVA_IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.NOVA_IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$CERTIFICATE_BASE64" && test -n "$CERTIFICATE_PASSWORD" && test -n "$PROFILE_BASE64"
          SIGN_DIR="$RUNNER_TEMP/nova-signing"
          mkdir -p "$SIGN_DIR"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$SIGN_DIR/distribution.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$SIGN_DIR/profile.mobileprovision"
          security cms -D -i "$SIGN_DIR/profile.mobileprovision" > "$SIGN_DIR/profile.plist"
          python3 - <<'PY'
          import os, plistlib, datetime
          p = plistlib.load(open(os.environ['RUNNER_TEMP'] + '/nova-signing/profile.plist', 'rb'))
          assert p['TeamIdentifier'] == [os.environ['IOS_TEAM_ID']]
          assert p['Entitlements']['application-identifier'] == os.environ['IOS_TEAM_ID'] + '.' + os.environ['IOS_BUNDLE_ID']
          assert not p['Entitlements'].get('get-task-allow', True)
          assert p['ExpirationDate'] > datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)
          assert 'TAG' in p['Entitlements']['com.apple.developer.nfc.readersession.formats']
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('IOS_PROFILE_UUID=' + p['UUID'] + '\n')
              f.write('IOS_PROFILE_NAME=' + p['Name'] + '\n')
          PY
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$SIGN_DIR/build.keychain-db"
          security set-keychain-settings -lut 21600 "$SIGN_DIR/build.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$SIGN_DIR/build.keychain-db"
          security import "$SIGN_DIR/distribution.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$SIGN_DIR/build.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$SIGN_DIR/build.keychain-db" >/dev/null
          security list-keychains -d user -s "$SIGN_DIR/build.keychain-db" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$SIGN_DIR/build.keychain-db" | grep 'Apple Distribution'
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$SIGN_DIR/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$SIGN_DIR/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      - name: Configure Runner signing in the temporary checkout
        run: |
          set -euo pipefail
          ruby -rxcodeproj - <<'RUBY'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          target = project.targets.find { |t| t.name == 'Runner' }
          raise 'Runner target missing' unless target
          target.build_configurations.each do |config|
            config.build_settings['DEVELOPMENT_TEAM'] = ENV.fetch('IOS_TEAM_ID')
            config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            config.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('IOS_PROFILE_NAME')
          end
          project.save
          RUBY
          python3 - <<'PY'
          import os, plistlib
          e = plistlib.load(open('ios/Runner/Runner.entitlements', 'rb'))
          assert e['com.apple.developer.nfc.readersession.formats'] == ['TAG']
          options = {'method': 'app-store-connect', 'destination': 'export',
                     'teamID': os.environ['IOS_TEAM_ID'], 'signingStyle': 'manual',
                     'signingCertificate': 'Apple Distribution',
                     'provisioningProfiles': {os.environ['IOS_BUNDLE_ID']: os.environ['IOS_PROFILE_NAME']},
                     'manageAppVersionAndBuildNumber': False, 'stripSwiftSymbols': True}
          plistlib.dump(options, open(os.environ['RUNNER_TEMP'] + '/nova-signing/ExportOptions.plist', 'wb'))
          PY

      - name: Build signed IPA
        run: |
          set -euo pipefail
          BUILD_NUMBER=$((300 + ${{ github.run_number }}))
          echo "IOS_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          flutter build ipa --release --build-name=1.1.0 --build-number="$BUILD_NUMBER" \
            --export-options-plist="$RUNNER_TEMP/nova-signing/ExportOptions.plist"
          test -d build/ios/archive/Runner.xcarchive
          test "$(find build/ios/ipa -maxdepth 1 -name '*.ipa' | wc -l | tr -d ' ')" = 1
          cp build/ios/ipa/*.ipa NFCSTORE-iOS.ipa

      - name: Verify IPA signature and entitlements
        run: |
          set -euo pipefail
          CHECK_DIR="$RUNNER_TEMP/nova-ipa-check"
          mkdir -p "$CHECK_DIR"
          unzip -q NFCSTORE-iOS.ipa -d "$CHECK_DIR"
          APP="$CHECK_DIR/Payload/Runner.app"
          codesign --verify --deep --strict "$APP"
          codesign -d --entitlements :- "$APP" > "$CHECK_DIR/entitlements.plist" 2>/dev/null
          security cms -D -i "$APP/embedded.mobileprovision" > "$CHECK_DIR/profile.plist"
          python3 - <<'PY'
          import os, plistlib
          base = os.environ['RUNNER_TEMP'] + '/nova-ipa-check/'
          p = plistlib.load(open(base + 'Payload/Runner.app/Info.plist', 'rb'))
          e = plistlib.load(open(base + 'entitlements.plist', 'rb'))
          profile = plistlib.load(open(base + 'profile.plist', 'rb'))
          assert p['CFBundleIdentifier'] == os.environ['IOS_BUNDLE_ID']
          assert p['CFBundleShortVersionString'] == '1.1.0'
          assert p['CFBundleVersion'] == os.environ['IOS_BUILD_NUMBER']
          assert int(p['DTSDKName'].removeprefix('iphoneos').split('.')[0]) >= 26
          assert e['application-identifier'] == os.environ['IOS_TEAM_ID'] + '.' + os.environ['IOS_BUNDLE_ID']
          assert not e.get('get-task-allow', True)
          assert e['com.apple.developer.nfc.readersession.formats'] == ['TAG']
          assert profile['UUID'] == os.environ['IOS_PROFILE_UUID']
          print('IPA verified: 1.1.0 (' + p['CFBundleVersion'] + '), iOS SDK 26+, TAG, App Store profile')
          PY
          shasum -a 256 NFCSTORE-iOS.ipa > NFCSTORE-iOS.sha256

      - name: Save IPA in this private repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "ios-build-${{ github.run_id }}" NFCSTORE-iOS.ipa NFCSTORE-iOS.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "NFCSTORE iOS 1.1.0 ($IOS_BUILD_NUMBER)" \
            --notes "Signed App Store IPA; source ui/theme-controls. This release does not submit an App Store review."
          echo "Signed IPA saved: 1.1.0 ($IOS_BUILD_NUMBER)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to TestFlight only when explicitly requested
        if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight
        env:
          API_KEY_ID: ${{ secrets.NOVA_APPSTORE_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.NOVA_APPSTORE_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.NOVA_APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$API_KEY_ID" && test -n "$API_ISSUER_ID" && test -n "$API_PRIVATE_KEY" \
            || { echo '::error::App Store Connect API secrets are missing; IPA was saved but not uploaded.'; exit 1; }
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$API_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8"
          xcrun altool --validate-app --type ios --file NFCSTORE-iOS.ipa --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
          xcrun altool --upload-app --type ios --file NFCSTORE-iOS.ipa --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
          echo 'IPA accepted for Apple processing; check TestFlight for processing status.' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/nova-signing/build.keychain-db" 2>/dev/null || true
          if [ -n "${IOS_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          fi
          rm -rf "$RUNNER_TEMP/nova-signing" "$RUNNER_TEMP/nova-ipa-check" "$HOME/.appstoreconnect/private_keys"
