# JONLI SAYTNI TEKSHIRISH — ilova chaqiradigan yo'llar javob beradimi.
#
# NIMA UCHUN KERAK BO'LDI. 2026-09-15 da ilovada ko'p narsa ishlamay
# qoldi va sabab kodda emas edi: domen bir Worker'da, yangi kod esa
# boshqasida turardi. Buni topish uchun har bir yo'lni qo'lda so'rab
# chiqishga to'g'ri keldi. Endi shu ish bitta tugmada bo'ladi.
#
# Mahalliy testlar buni USHLAY OLMAYDI: ular kodni tekshiradi, bu esa
# JONLI serverni. Kod toza bo'lib turib ham sayt eski nusxani berishi
# mumkin — aynan shunday bo'lgan edi.
#
# TEKSHIRUV FAQAT O'QIYDI. Hech qanday ma'lumot yozilmaydi va
# o'chirilmaydi: barchasi GET, hisobga kirmasdan.
name: Jonli sayt tekshiruvi

on:
  workflow_dispatch:
  # Har deploy'dan keyin o'zi yuradi.
  workflow_run:
    workflows: ["Deploy to Cloudflare (nfcstore.uz)"]
    types: [completed]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Yo'llarni so'rab chiqish
        run: |
          BASE=https://nfcstore.uz
          fail=0

          # Har bir qator: yo'l | kutilgan holat | izoh
          #
          # Kirishsiz so'ralganda 401 KUTILGAN javob — u yo'l BOR
          # degani. Xato belgisi 404 (`not_found`): u yo'l serverda
          # umuman yo'qligini bildiradi, ya'ni eski nusxa ishlayapti.
          check() {
            path="$1"; want="$2"; note="$3"
            code=$(curl -sS -o b.txt -w '%{http_code}' --max-time 25 "$BASE$path" 2>/dev/null || echo 000)
            body=$(head -c 90 b.txt | tr '\n' ' ')
            if [ "$code" = "$want" ]; then
              printf '  OK   %-34s %s\n' "$path" "$code"
            else
              printf '  XATO %-34s kutilgan %s, keldi %s | %s\n' "$path" "$want" "$code" "$body"
              fail=$((fail+1))
            fi
          }

          echo "=== Ochiq yo'llar (hamma ko'radi) ==="
          check /api/feed                            200 "lenta"
          check /api/stories/feed                    200 "istorya lentasi"
          check /api/records                         200 "ID katalogi"
          check /api/categories                      200 "kategoriyalar"
          check /api/companies                       200 "kompaniyalar"
          check /api/settings/payments-enabled       200 "to'lov tizimlari"
          check /api/settings/physical-nfc-pricing   200 "karta narxlari"

          echo "=== Kirish talab qiladiganlar (401 = yo'l JOYIDA) ==="
          check /api/auth/me                         401 "men kimman"
          check /api/companies/mine                  401 "mening kompaniyalarim"
          check /api/orders                          401 "buyurtmalar"
          check /api/blocks                          401 "bloklanganlar"

          echo "=== Sahifa va rasm ==="
          code=$(curl -sS -o page.html -w '%{http_code}' --max-time 25 "$BASE/" || echo 000)
          if [ "$code" = "200" ] && grep -q '<div id="root"' page.html; then
            echo "  OK   /                                  200"
          else
            echo "  XATO /                                  $code yoki sahifa bo'sh"
            fail=$((fail+1))
          fi

          # IKONKA VERSIYASI. Sayt yangilanmasa bu qator eski qoladi —
          # ya'ni deploy yetib bormaganini bir qarashda ko'rsatadi.
          echo "  index.html ikonka versiyasi: $(grep -o 'favicon.ico?v=[0-9]*' page.html | head -1)"

          # Rasm lentadan olinadi: qat'iy yozilgan fayl nomi bir kun
          # o'chib ketishi va tekshiruvni yolg'on yiqitishi mumkin.
          curl -sS --max-time 25 "$BASE/api/feed" > feed.json 2>/dev/null || true
          up=$(python3 -c "
          import json
          try: d = json.load(open('feed.json'))
          except Exception: print(''); raise SystemExit
          for it in (d.get('feed') or []):
              for k in ('avatarUrl','mediaUrl','imageUrl'):
                  v = it.get(k) or ''
                  if v.startswith('/uploads/'): print(v); raise SystemExit
          print('')")
          if [ -n "$up" ]; then
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 "$BASE$up" || echo 000)
            if [ "$code" = "200" ]; then echo "  OK   $up  200"
            else echo "  XATO $up  $code"; fail=$((fail+1)); fi
          else
            echo "  ?    lentada /uploads havolasi yo'q — rasm tekshirilmadi"
          fi

          echo
          if [ "$fail" -gt 0 ]; then
            echo "::error::$fail ta yo'l kutilganday javob bermadi."
            exit 1
          fi
          echo "Hammasi joyida."
