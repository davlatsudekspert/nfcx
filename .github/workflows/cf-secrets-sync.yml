# PRODUCTION SOZLAMALARINI TIKLASH — GitHub Secrets -> nfcstore-uz.
#
# ═══ NIMA UCHUN ═══
#
# 2026-09-15 da `nfcstore.uz` ga xizmat qiluvchi Worker
# `nfcstore-api` dan `nfcstore-uz` ga ko'chdi. Secretlar skriptga
# emas, WORKER'ga biriktirilgan bo'ladi — shuning uchun kod ko'chdi,
# ular ko'chmadi. Natijada emailga kod yuborish, Telegram tasdig'i va
# AI yordamchi JIMGINA o'chib qoldi.
#
# Cloudflare API secret QIYMATINI qaytarmaydi, ya'ni eski Workerdan
# nusxa olishning iloji yo'q. Yagona xavfsiz manba — GitHub Secrets.
#
# ═══ XAVFSIZLIK ═══
#
#  * Qiymat FAQAT `wrangler secret put` ning STDIN'iga beriladi.
#    Buyruq satrida ham, faylda ham, logda ham ko'rinmaydi.
#  * GitHub Actions `***` bilan maskalaydi; bundan tashqari bu yerda
#    hech qaysi qadam qiymatni umuman chop etmaydi.
#  * `wrangler secret put` FAQAT bitta secretni qo'yadi — D1, R2,
#    ASSETS, custom domain va boshqa bog'lanishlarga TEGMAYDI
#    (`wrangler deploy` dan farqi shu).
#  * Eski `nfcstore-api` ga umuman tegilmaydi — rollback uchun qoladi.
name: Cloudflare secretlarini tiklash (nfcstore-uz)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = faqat qaysi nom bor/yo'q. apply = Workerga qo'yish."
        required: true
        default: check
        type: choice
        options: [check, apply]
      only:
        description: "Faqat shu nomlar (vergul bilan), masalan GEMINI_API_KEY. Bo'sh — hammasi."
        required: false
        default: ''
  # `push` trigger OLIB TASHLANDI (2026-09-23): fayl o'zgarganda
  # HAMMA sirlarni jimgina qayta yozardi (standart rejim — apply,
  # `only` bo'sh). Endi faqat qo'lda, `mode` va `only` tanlab.

permissions:
  contents: read

concurrency:
  group: cloudflare-secrets-nfcstore-uz
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER: nfcstore-uz
      MODE: ${{ inputs.mode || 'check' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # QAYSI NOM BOR — QIYMATSIZ.
      #
      # GitHub'da mavjud bo'lmagan secret bo'sh satr bo'lib keladi,
      # shuning uchun "bor/yo'q" ni uzunligi orqali bilamiz. Uzunlik
      # ham chop etilmaydi: u qisqa parollar uchun ishora bo'lardi.
      - name: Qaysi nomlar GitHub Secrets'da bor
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLICK_RETURN_URL: ${{ secrets.CLICK_RETURN_URL }}
        run: |
          for k in RESEND_API_KEY RESEND_FROM TELEGRAM_BOT_TOKEN \
                   TELEGRAM_BOT_USERNAME TELEGRAM_WEBHOOK_SECRET \
                   ADMIN_CHAT_ID GEMINI_API_KEY CLICK_RETURN_URL; do
            if [ -n "${!k}" ]; then echo "  BOR   $k"; else echo "  YO'Q  $k"; fi
          done

      # WORKERGA QO'YISH.
      #
      # Qiymat STDIN orqali beriladi — `wrangler secret put NAME` uni
      # shu yerdan o'qiydi. Buyruq satriga yozilsa `ps` da ko'rinardi.
      # `printf '%s'` ishlatiladi: `echo` oxiriga satr tashlashi mumkin
      # va o'sha ko'rinmas belgi Resend uchun manzilni buzardi (aynan
      # shu xato ilgari `\r` bilan bo'lgan — worker.js `cleanSecret`).
      - name: nfcstore-uz ga sync
        if: ${{ inputs.mode == 'apply' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLICK_RETURN_URL: ${{ secrets.CLICK_RETURN_URL }}
          ONLY: ${{ inputs.only || '' }}
        run: |
          set -u
          put() {
            name="$1"
            # `only` berilgan bo'lsa — faqat ro'yxatdagi nomlar. Ishlab
            # turgan sozlamani (masalan RESEND) GitHub'dagi eski nusxa
            # bilan ustidan yozib yubormaslik uchun.
            if [ -n "${ONLY:-}" ] && ! printf ',%s,' "$ONLY" | tr -d ' ' | grep -q ",$name,"; then
              echo "  tegilmadi   $name  (only ro'yxatida yo'q)"
              return 0
            fi
            val="${!name}"
            if [ -z "$val" ]; then
              echo "  o'tkazildi  $name  (GitHub Secrets'da yo'q)"
              return 0
            fi
            if printf '%s' "$val" \
                 | npx wrangler@4.129.0 secret put "$name" --name "$WORKER" >/dev/null 2>secret-err.txt; then
              echo "  QO'YILDI    $name"
            else
              echo "  XATO        $name"
              # Xato matni Wrangler'dan keladi va qiymatni o'z ichiga
              # olmaydi, lekin ehtiyot uchun faqat boshi ko'rsatiladi.
              head -c 200 secret-err.txt; echo
              return 1
            fi
          }
          # TELEGRAM WEBHOOK SIRI — egasi o'ylab topishi shart emas.
          # Bot tokeni bor-u, sir yo'q bo'lsa, shu yerda tasodifiy
          # yaratiladi (logga chiqmaydi) va pastda Telegram'ga ham
          # aynan shu sir bilan webhook ro'yxatdan o'tkaziladi.
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -z "${TELEGRAM_WEBHOOK_SECRET:-}" ]; then
            TELEGRAM_WEBHOOK_SECRET="$(openssl rand -hex 24)"
            echo "::add-mask::$TELEGRAM_WEBHOOK_SECRET"
            export TELEGRAM_WEBHOOK_SECRET
            GEN_WEBHOOK=1
          fi
          rc=0
          for k in RESEND_API_KEY RESEND_FROM TELEGRAM_BOT_TOKEN \
                   TELEGRAM_BOT_USERNAME TELEGRAM_WEBHOOK_SECRET \
                   ADMIN_CHAT_ID GEMINI_API_KEY CLICK_RETURN_URL; do
            put "$k" || rc=1
          done
          # Webhook — faqat bot tokeni shu ishga tushirishda qo'yilgan bo'lsa.
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_WEBHOOK_SECRET:-}" ] \
             && { [ -z "${ONLY:-}" ] || printf ',%s,' "$ONLY" | tr -d ' ' | grep -q ',TELEGRAM_BOT_TOKEN,'; }; then
            if [ "${GEN_WEBHOOK:-0}" = "1" ] && [ -n "${ONLY:-}" ] \
               && ! printf ',%s,' "$ONLY" | tr -d ' ' | grep -q ',TELEGRAM_WEBHOOK_SECRET,'; then
              # Yangi sir yaratildi — u ham Worker'ga qo'yilishi SHART.
              printf '%s' "$TELEGRAM_WEBHOOK_SECRET" \
                | npx wrangler@4.129.0 secret put TELEGRAM_WEBHOOK_SECRET --name "$WORKER" >/dev/null 2>secret-err.txt \
                && echo "  QO'YILDI    TELEGRAM_WEBHOOK_SECRET (yaratildi)" || { echo "  XATO        TELEGRAM_WEBHOOK_SECRET"; rc=1; }
            fi
            ok=$(curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
              --data-urlencode "url=https://nfcstore.uz/api/telegram/webhook" \
              --data-urlencode "secret_token=${TELEGRAM_WEBHOOK_SECRET}" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print('OK' if d.get('ok') else 'XATO: '+str(d.get('description','')))")
            echo "  Telegram webhook: $ok"
            [ "$ok" = "OK" ] || rc=1
          fi
          exit $rc

      # TEKSHIRUV — Workerda nima bor. Qiymatlar emas, nomlar.
      - name: Natija — jonli Workerda sozlamalar to'liqmi
        if: always()
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: 31c4b3d8ece4b65de515debc4552334a
        run: node scripts/test-worker-secrets.mjs
