name: hasharchilar — Cloudflare hisobini ko'rish (faqat o'qish)

# Hech narsani o'zgartirmaydi: faqat hisobdagi D1, R2, Worker, Pages va
# zonalar NOMLARINI chiqaradi — hasharchilar.uz ni mavjud resurslarga
# ulashdan oldin nima borligini bilish uchun.
on:
  push:
    branches: [claude/peaceful-meitner-zlvydj]
    paths: ['.github/workflows/hasharchilar-cf-discover.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: 31c4b3d8ece4b65de515debc4552334a
    steps:
      - name: Hisob resurslari
        run: |
          set -u
          api() { curl -sS -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          A="/accounts/$CF_ACCOUNT"

          echo "=== Token"; api /user/tokens/verify | jq -c '{success, status: .result.status, errors}'

          echo "=== D1 bazalar"
          api "$A/d1/database?per_page=100" > d1.json
          jq -r '.result[]? | "\(.name)\t\(.uuid)\tcreated=\(.created_at)\tsize=\(.file_size)"' d1.json
          jq -c '.errors' d1.json

          echo "=== 'hashar' nomli bazalardagi jadvallar (faqat sxema)"
          for id in $(jq -r '.result[]? | select(.name|test("hashar";"i")) | .uuid' d1.json); do
            echo "--- $id"
            curl -sS -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H 'content-type: application/json' \
              "https://api.cloudflare.com/client/v4$A/d1/database/$id/query" \
              -d '{"sql":"SELECT name, sql FROM sqlite_master WHERE type IN (\"table\",\"index\") ORDER BY name"}' \
              | jq -r '.result[0].results[]? | "\(.name): \(.sql)"'
          done

          echo "=== R2 bucketlar"; api "$A/r2/buckets" | jq -r '.result.buckets[]?.name, (.errors|tostring)'
          echo "=== Worker skriptlar"; api "$A/workers/scripts" | jq -r '.result[]?.id, (.errors|tostring)'
          echo "=== workers.dev subdomeni"; api "$A/workers/subdomain" | jq -c '.result, .errors'
          echo "=== Worker custom domenlar"; api "$A/workers/domains" | jq -r '.result[]? | "\(.hostname) -> \(.service)"'
          echo "=== Pages loyihalar"; api "$A/pages/projects" | jq -r '.result[]? | "\(.name)\t\(.subdomain)\t\(.domains|join(","))", (.errors|tostring)'
          echo "=== Zonalar"; api "/zones?per_page=50" | jq -r '.result[]? | "\(.name)\t\(.status)\t\(.id)", (.errors|tostring)'

      - name: Mavjud hasharchilar-api Worker (faqat o'qish)
        run: |
          set -u
          api() { curl -sS -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          S="/accounts/$CF_ACCOUNT/workers/scripts/hasharchilar-api"
          echo "=== Sozlamalar va binding'lar"
          api "$S/settings" > settings.json
          jq -c '.result | {compatibility_date, compatibility_flags, bindings: [.bindings[]? | {type, name, id, database_id, bucket_name, text: (if .type=="plain_text" then .text else null end)}]}' settings.json
          jq -c '.errors' settings.json
          echo "=== workers.dev yoqilganmi"; api "$S/subdomain" | jq -c '.result, .errors'
          echo "=== Cron"; api "$S/schedules" | jq -c '.result, .errors'
          echo "=== Bog'langan D1 bazaga ruxsat bormi"
          for id in $(jq -r '.result.bindings[]? | select(.type=="d1") | .id // .database_id' settings.json); do
            api "/accounts/$CF_ACCOUNT/d1/database/$id" | jq -c '{name: .result.name, uuid: .result.uuid, tables: .result.num_tables, errors}'
            curl -sS -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H 'content-type: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/d1/database/$id/query" \
              -d '{"sql":"SELECT name, sql FROM sqlite_master WHERE type=\"table\" ORDER BY name"}' \
              | jq -r '.errors, (.result[0].results[]? | "\(.name): \(.sql)")'
          done
          echo "=== Skript kodi: jadvallar va marshrutlar"
          curl -sS -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4$S/content/v2" -o script.bin -w 'http=%{http_code} bytes=%{size_download}\n'
          file script.bin || true
          grep -aoE 'CREATE TABLE[^;]{0,600}' script.bin | head -20 || true
          grep -aoE "\.(get|post|put|patch|delete)\(['\"][^'\"]{1,80}['\"]" script.bin | sort -u | head -60 || true

      - name: R2 ga yozish ruxsati (kichik sinov fayli, darrov o'chiriladi)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 31c4b3d8ece4b65de515debc4552334a
        run: |
          set -u
          echo "probe $(date -u +%FT%TZ)" > probe.txt
          if npx --yes wrangler@4.147.0 r2 object put hasharchilar-photos/ci/.write-probe --file probe.txt --remote; then
            echo "R2_WRITE=ok"
            npx --yes wrangler@4.147.0 r2 object get hasharchilar-photos/ci/.write-probe --file back.txt --remote && echo "R2_READ=ok: $(cat back.txt)"
            npx --yes wrangler@4.147.0 r2 object delete hasharchilar-photos/ci/.write-probe --remote && echo "R2_DELETE=ok"
          else
            echo "R2_WRITE=denied"
          fi
