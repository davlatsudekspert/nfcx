# NFCSTORE NOVA — iOS BUILD (imzosiz)
#
# NIMA UCHUN: iOS ilovasini faqat macOS + Xcode quradi. Bizda Mac yo'q,
# lekin GitHub'ning macOS runner'ida Xcode tayyor turibdi. Bu workflow
# `mobile_nova/` ni iOS uchun IMZOSIZ quradi va shu bilan kod, plaginlar
# (CocoaPods) va sozlamalar iOS'da yig'ilishini tekshiradi.
#
# BU NIMA EMAS: bu hali App Store / TestFlight'ga yuklash emas. Imzo
# uchun Apple Developer hisobi va App Store Connect API kaliti kerak;
# ular GitHub secrets'ga qo'yilgach, TestFlight bosqichi shu faylga
# qo'shiladi (IOS_RELEASE_CHECKLIST.md ga qarang).
#
# NARX: macOS runner daqiqasi Linux'dan qimmat, shuning uchun bu
# workflow faqat iOS'ga tegishli fayllar o'zgarganda yoki qo'lda
# ishga tushadi.
name: NFCSTORE iOS build

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'mobile_nova/ios/**'
      - 'mobile_nova/pubspec.yaml'
      - 'mobile_nova/pubspec.lock'
      - '.github/workflows/nova-ios.yml'

concurrency:
  group: nova-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile_nova

    steps:
      - uses: actions/checkout@v4

      # Android build bilan AYNAN bir xil Flutter versiyasi.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable
          cache: true

      - name: Xcode versiyasi
        run: xcodebuild -version

      - name: Paketlar
        run: flutter pub get

      # Ilova ochilgan zahoti yiqilmasligi uchun zarur kalitlar.
      # Ulardan biri yo'qolsa build QIZIL bo'lsin — telefonda emas,
      # shu yerda bilinsin.
      - name: Info.plist qo'riqchisi
        run: |
          set -e
          P=ios/Runner/Info.plist
          for k in NFCReaderUsageDescription NSCameraUsageDescription \
                   NSPhotoLibraryUsageDescription NSMicrophoneUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :$k" "$P" >/dev/null \
              || { echo "::error::$k Info.plist da yo'q"; exit 1; }
          done
          grep -q 'CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;' \
            ios/Runner.xcodeproj/project.pbxproj \
            || { echo "::error::NFC entitlement loyihaga ulanmagan"; exit 1; }
          # nfc_manager iOS'da NFCTagReaderSession ishlatadi — TAG shart.
          # NDEF esa Apple tomonidan taqiqlangan: yuklashda ITMS-90778.
          F=$(/usr/libexec/PlistBuddy -c "Print :com.apple.developer.nfc.readersession.formats" \
                ios/Runner/Runner.entitlements)
          echo "$F" | grep -qE '^[[:space:]]*TAG$' \
            || { echo "::error::Runner.entitlements da TAG yo'q — iPhone'da NFC ishlamaydi"; exit 1; }
          if echo "$F" | grep -qE '^[[:space:]]*NDEF$'; then
            echo "::error::Runner.entitlements da NDEF bor — App Store ITMS-90778 bilan rad etadi"
            exit 1
          fi
          # Bundle ID — Android bilan bir xil. App Store Connect'da
          # ilova yaratilgach uni o'zgartirib bo'lmaydi.
          N=$(grep -c 'PRODUCT_BUNDLE_IDENTIFIER = uz.nfcstore.nova;' \
                ios/Runner.xcodeproj/project.pbxproj || true)
          [ "$N" = 3 ] \
            || { echo "::error::Bundle ID uz.nfcstore.nova emas (3 konfiguratsiyadan $N tasi)"; exit 1; }
          # Faqat iPhone: iPad'da NFC yo'q, iPad yoqilsa App Store
          # iPad suratlarini ham talab qiladi.
          if grep -q 'TARGETED_DEVICE_FAMILY = "1,2";' ios/Runner.xcodeproj/project.pbxproj; then
            echo "::error::iPad yoqilgan (TARGETED_DEVICE_FAMILY) — ilova faqat iPhone uchun"
            exit 1
          fi
          echo "Info.plist, NFC entitlement (TAG) va qurilma turi joyida"

      - name: iOS build (imzosiz, release)
        run: flutter build ios --release --no-codesign

      - name: Natijani yig'ish
        run: |
          cd build/ios/iphoneos
          ls -la
          zip -qry ../../../Runner-unsigned.app.zip Runner.app

      - uses: actions/upload-artifact@v4
        with:
          name: nfcstore-ios-unsigned
          path: mobile_nova/Runner-unsigned.app.zip
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # SIMULYATOR: ilova haqiqiy iPhone simulyatorida ochiladimi.
  #
  # Imzo kerak emas. Ilova o'rnatiladi, ishga tushiriladi va bir necha
  # soniya oralig'ida ekran surati olinadi. Suratlar artefakt bo'lib
  # chiqadi — ilova yiqilsa, bu yerda ko'rinadi (va jurnalda sabab).
  # Surat o'lchami 6.9" iPhone — App Store talab qiladigan o'lcham.
  # ─────────────────────────────────────────────────────────────────
  simulator:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile_nova

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable
          cache: true

      - name: Paketlar
        run: flutter pub get

      - name: Simulyator uchun build
        run: flutter build ios --simulator --debug

      - name: iPhone simulyatorini yoqish
        id: sim
        run: |
          set -e
          xcrun simctl list devices available | grep -E "iPhone" || true
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          pref=['iPhone 16 Pro Max','iPhone 15 Pro Max','iPhone 16 Pro','iPhone 16']
          allv=[x for k,v in d.items() if 'iOS' in k for x in v]
          for p in pref:
            for x in allv:
              if x['name']==p: print(x['udid']); raise SystemExit
          print([x for x in allv if 'iPhone' in x['name']][0]['udid'])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          # Tizim tili o'zbekcha bo'lmasa ham ilova o'z tilida ochiladi.
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true

      - name: O'rnatish, ishga tushirish va suratga olish
        run: |
          set -e
          UDID=${{ steps.sim.outputs.udid }}
          mkdir -p ../ios-shots
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app
          BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" build/ios/iphonesimulator/Runner.app/Info.plist)
          echo "Bundle ID: $BID"
          xcrun simctl launch --console-pty "$UDID" "$BID" > ../ios-shots/app-log.txt 2>&1 &
          for t in 4 10 20 35; do
            sleep $([ $t = 4 ] && echo 4 || echo 8)
            xcrun simctl io "$UDID" screenshot "../ios-shots/shot-${t}s.png"
          done
          # Ilova hali tirikmi (yiqilmaganmi)
          if xcrun simctl spawn "$UDID" launchctl list | grep -q "$BID"; then
            echo "Ilova ishlab turibdi"
          else
            echo "::error::Ilova simulyatorda yiqildi — app-log.txt ga qarang"
            tail -80 ../ios-shots/app-log.txt || true
            exit 1
          fi

      # HAQIQIY MEDIA (egasi, 2026-09-27: "mp3 player ham ishlaydimi",
      # "reels qo'yish, post qo'yishni ham tekshir").
      #  * profil pleeri serverdagi haqiqiy mp3 ni o'ynaydi va to'xtaydi;
      #  * iPhone kamerasi beradigan HEVC .mov yuklashdan oldin H.264
      #    .mp4 ga o'tadi (AppDelegate.swift) va o'ynaydi.
      # Manba — lentadagi eng kichik haqiqiy video, runner'da macOS'ning
      # o'z `avconvert` i bilan HEVC .mov qilinadi va simulyatorga lokal
      # HTTP orqali beriladi (simulyator Mac tarmog'idan foydalanadi).
      - name: iPhone media — mp3 pleer va video eksport (haqiqiy)
        run: |
          set -e
          UDID=${{ steps.sim.outputs.udid }}
          M=/tmp/nova-media
          mkdir -p "$M"
          curl -sSf "https://nfcstore.uz/api/feed?limit=30" > "$M/feed.json"
          best=""; bestsize=999999999
          for v in $(python3 -c "import json; print(' '.join(p['videoUrl'] for p in json.load(open('$M/feed.json'))['feed'] if p.get('videoUrl')))"); do
            size=$(curl -sSfI "https://nfcstore.uz$v" | awk 'tolower($1)=="content-length:"{print $2+0}' | tail -1)
            if [ -n "$size" ] && [ "$size" -gt 100000 ] && [ "$size" -lt "$bestsize" ]; then best=$v; bestsize=$size; fi
          done
          test -n "$best" || { echo "::error::lentada video topilmadi"; exit 1; }
          MP3=$(curl -sSf https://nfcstore.uz/api/music | python3 -c "import json,sys; print(json.load(sys.stdin)['tracks'][0]['audioUrl'])")
          echo "video: $best ($bestsize bayt)  mp3: $MP3"
          curl -sSfL -o "$M/src.mp4" "https://nfcstore.uz$best"
          if avconvert --source "$M/src.mp4" --preset PresetHEVCHighestQuality --output "$M/sample.mov" --replace; then
            echo "Manba: HEVC .mov (iPhone formati)"
          else
            echo "::warning::avconvert HEVC .mov yasay olmadi — H.264 manba bilan sinaladi"
            cp "$M/src.mp4" "$M/sample.mov"
          fi
          python3 -c "b=open('$M/sample.mov','rb').read(); print('konteyner:', b[8:12], 'HEVC:', b'hvc1' in b or b'hev1' in b, 'hajm:', len(b))"
          (cd "$M" && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 1
          curl -sSfI http://127.0.0.1:8765/sample.mov | head -1
          # Test `integration_ios/` da turadi: `integration_test/` ga
          # qo'shilsa har push haqiqiy hisobli Android E2E ni ham
          # ishga tushirardi (nova-e2e.yml yo'l filtri). Ishga tushirish
          # uchun vaqtincha ko'chiriladi (nova-video-probe.yml kabi).
          mkdir -p integration_test/ios
          cp integration_ios/ios_media_test.dart integration_test/ios/
          flutter test integration_test/ios/ios_media_test.dart -d "$UDID" \
            --dart-define=MP3_URL="https://nfcstore.uz$MP3" \
            --dart-define=MOV_URL=http://127.0.0.1:8765/sample.mov

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nfcstore-ios-simulator-shots
          path: ios-shots/
          retention-days: 14
