name: Production smoke (ulashish havolalari)

# Deploydan KEYIN tez tekshirish. To'liq E2E ~25 daqiqa oladi va
# emulyator ko'taradi; bu esa soniyalarda javob beradi va FAQAT
# ommaviy sahifalarni GET qiladi — hech narsa yozmaydi, hisobga
# kirmaydi, ma'lumotga tegmaydi.
on:
  workflow_dispatch:
    inputs:
      code:
        description: "Tekshiriladigan NFC kodi"
        required: false
        default: "VIP001"
      email_test:
        description: "Email OTP ni ham tekshirish (HAQIQIY xat yuboriladi)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Ommaviy sahifalarni tekshirish
        env:
          CODE: ${{ inputs.code || 'VIP001' }}
        run: |
          fail=0
          probe() {
            local path="$1" want="$2"
            # -sS: jim, lekin xatoni ko'rsat. Qayta yo'naltirish
            # kuzatiladi (--location): ulashilgan havola brauzerda
            # ham aynan shunday ochiladi.
            out=$(curl -sS --location --max-time 25 \
              -H 'accept: text/html,application/xhtml+xml' \
              -H 'user-agent: Mozilla/5.0 (Android) NFCSTORE-smoke' \
              -w '\n<<<%{http_code}>>>' "https://nfcstore.uz${path}" || echo '<<<000>>>')
            code="${out##*<<<}"; code="${code%%>>>*}"
            body="${out%<<<*}"
            snippet=$(printf '%s' "$body" | tr -d '\r\n' | cut -c1-160)
            if [ "$code" = "$want" ]; then
              echo "OK    $code  $path"
            else
              echo "XATO  $code (kutilgan $want)  $path"
              echo "      tana: $snippet"
              fail=1
            fi
          }

          echo "── Sayt asosiy sahifalari ──"
          probe "/" 200
          probe "/katalog" 200
          probe "/login" 200
          probe "/register" 200

          echo "── Nova ulashish havolalari ──"
          # Shaxsiy profil — ilovadagi Profil, NFC ID, Post, Istorya
          # va Reels ulashuvi AYNAN shu shaklni quradi.
          probe "/$CODE" 200
          probe "/$(printf '%s' "$CODE" | tr 'A-Z' 'a-z')" 200

          echo "── Bildirishnoma API tirikmi ──"
          # 401 — endpoint BOR va kirish talab qiladi (to'g'ri).
          # 404 — deploy qilinmagan. 5xx — yiqilgan.
          # Hech qanday token yuborilmaydi: bu faqat marshrut
          # mavjudligini tekshiradi, ma'lumotga tegmaydi.
          out=$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' \
            -H 'accept: application/json' "https://nfcstore.uz/api/notifications" || echo 000)
          case "$out" in
            401) echo "OK    401  /api/notifications (endpoint bor, kirish talab qiladi)" ;;
            404) echo "XATO  404  /api/notifications — deploy qilinmagan"; fail=1 ;;
            5*)  echo "XATO  $out  /api/notifications — server xatosi"; fail=1 ;;
            *)   echo "XATO  $out  /api/notifications — kutilmagan javob"; fail=1 ;;
          esac

          echo "── FEATURED va izoh moderatsiyasi tirikmi ──"
          # `/api/featured/packages` — OMMAVIY (narxlar ro'yxati),
          # shuning uchun 200 kutiladi. Bu endpoint bir vaqtning
          # o'zida `featured_slots` jadvali yaratilganini ham
          # bilvosita tasdiqlaydi.
          out=$(curl -sS --max-time 25 -w '\n<<<%{http_code}>>>' \
            -H 'accept: application/json' "https://nfcstore.uz/api/featured/packages" || echo '<<<000>>>')
          code="${out##*<<<}"; code="${code%%>>>*}"
          body="${out%<<<*}"
          if [ "$code" = "200" ] && printf '%s' "$body" | grep -q '"packages"'; then
            echo "OK    200  /api/featured/packages"
          else
            echo "XATO  $code  /api/featured/packages"
            echo "      tana: $(printf '%s' "$body" | tr -d '\r\n' | cut -c1-160)"
            fail=1
          fi

          # Admin moderatsiyasi — 401 kutiladi (endpoint bor,
          # admin sessiyasi talab qiladi). HECH QANDAY kalit
          # yuborilmaydi.
          out=$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' \
            -H 'accept: application/json' "https://nfcstore.uz/api/admin/comments" || echo 000)
          case "$out" in
            401) echo "OK    401  /api/admin/comments (endpoint bor, admin talab qiladi)" ;;
            404) echo "XATO  404  /api/admin/comments — deploy qilinmagan"; fail=1 ;;
            200) echo "XATO  200  /api/admin/comments — ADMINSIZ OCHIQ, bu jiddiy"; fail=1 ;;
            5*)  echo "XATO  $out  /api/admin/comments — server xatosi"; fail=1 ;;
            *)   echo "XATO  $out  /api/admin/comments — kutilmagan javob"; fail=1 ;;
          esac

          # Lenta — ilovaning Asosiy ekrani va Reels shu yerdan
          # oziqlanadi. Kirmasdan ham ishlashi kerak.
          out=$(curl -sS --max-time 25 -w '\n<<<%{http_code}>>>' \
            -H 'accept: application/json' "https://nfcstore.uz/api/feed" || echo '<<<000>>>')
          code="${out##*<<<}"; code="${code%%>>>*}"
          if [ "$code" = "200" ] && printf '%s' "${out%<<<*}" | grep -q '"feed"'; then
            echo "OK    200  /api/feed"
          else
            echo "XATO  $code  /api/feed"
            fail=1
          fi

          echo "── NFC ID bozori (ilovadagi qidirish/katalog/xarid) ──"
          # Darajalar va narxlar. Ilova katalogni AYNAN shu javobdan
          # chizadi — narx ilovada yozilmagan, shuning uchun bu
          # endpoint yiqilsa katalog bo'sh qoladi.
          out=$(curl -sS --max-time 25 -w '\n<<<%{http_code}>>>' \
            -H 'accept: application/json' "https://nfcstore.uz/api/settings/id-pricing" || echo '<<<000>>>')
          code="${out##*<<<}"; code="${code%%>>>*}"
          body="${out%<<<*}"
          if [ "$code" = "200" ] && printf '%s' "$body" | grep -q '"tiers"'; then
            echo "OK    200  /api/settings/id-pricing"
            echo "      javob: $(printf '%s' "$body" | tr -d '\r\n' | cut -c1-240)"
          else
            echo "XATO  $code  /api/settings/id-pricing"
            echo "      tana: $(printf '%s' "$body" | tr -d '\r\n' | cut -c1-160)"
            fail=1
          fi

          # BAND KOD — egasi bor, sotuvda emas. Ilovadagi qidiruv
          # "Sotilgan" deb ko'rsatishi shunga tayanadi.
          out=$(curl -sS --max-time 25 -w '\n<<<%{http_code}>>>' \
            -H 'accept: application/json' "https://nfcstore.uz/api/records/$CODE/quote" || echo '<<<000>>>')
          code="${out##*<<<}"; code="${code%%>>>*}"
          body="${out%<<<*}"
          if [ "$code" = "200" ] && printf '%s' "$body" | grep -q '"taken":true'; then
            echo "OK    200  /api/records/$CODE/quote (taken)"
          else
            echo "XATO  $code  /api/records/$CODE/quote"
            echo "      tana: $(printf '%s' "$body" | tr -d '\r\n' | cut -c1-160)"
            fail=1
          fi

          # BO'SH KOD — narx ko'rinishi va hech narsa BAND
          # QILINMASLIGI kerak. Bu GET, ya'ni buyurtma yaratmaydi.
          out=$(curl -sS --max-time 25 -w '\n<<<%{http_code}>>>' \
            -H 'accept: application/json' "https://nfcstore.uz/api/records/QZX742/quote" || echo '<<<000>>>')
          code="${out##*<<<}"; code="${code%%>>>*}"
          body="${out%<<<*}"
          if [ "$code" = "200" ] && printf '%s' "$body" | grep -q '"amount"'; then
            echo "OK    200  /api/records/QZX742/quote (narx bor)"
            echo "      javob: $(printf '%s' "$body" | tr -d '\r\n' | cut -c1-200)"
          else
            echo "XATO  $code  /api/records/QZX742/quote"
            echo "      tana: $(printf '%s' "$body" | tr -d '\r\n' | cut -c1-160)"
            fail=1
          fi

          # SESSIYASIZ XARID QILIB BO'LMASLIGI kerak. 401 — to'g'ri.
          # 2xx bo'lsa — jiddiy: begona odam kod band qila olardi.
          out=$(curl -sS --max-time 25 -X POST -o /dev/null -w '%{http_code}' \
            -H 'content-type: application/json' --data '{"name":"smoke"}' \
            "https://nfcstore.uz/api/records/QZX742" || echo 000)
          case "$out" in
            401) echo "OK    401  POST /api/records/QZX742 (sessiya talab qiladi)" ;;
            2*)  echo "XATO  $out  POST /api/records/QZX742 — SESSIYASIZ BAND QILINDI, jiddiy"; fail=1 ;;
            404) echo "XATO  404  POST /api/records/:code — deploy qilinmagan"; fail=1 ;;
            *)   echo "XATO  $out  POST /api/records/QZX742 — kutilmagan javob"; fail=1 ;;
          esac

          echo "── Saytdagi to'lov oqimi buzilmadimi ──"
          out=$(curl -sS --max-time 25 -w '\n<<<%{http_code}>>>' \
            -H 'accept: application/json' "https://nfcstore.uz/api/settings/payments-enabled" || echo '<<<000>>>')
          code="${out##*<<<}"; code="${code%%>>>*}"
          if [ "$code" = "200" ]; then
            echo "OK    200  /api/settings/payments-enabled — $(printf '%s' "${out%<<<*}" | tr -d '\r\n' | cut -c1-120)"
          else
            echo "XATO  $code  /api/settings/payments-enabled"; fail=1
          fi

          out=$(curl -sS --max-time 25 -w '\n<<<%{http_code}>>>' \
            -H 'accept: application/json' "https://nfcstore.uz/api/settings/physical-nfc-pricing" || echo '<<<000>>>')
          code="${out##*<<<}"; code="${code%%>>>*}"
          if [ "$code" = "200" ] && printf '%s' "${out%<<<*}" | grep -q 'pricePerUnit'; then
            echo "OK    200  /api/settings/physical-nfc-pricing"
          else
            echo "XATO  $code  /api/settings/physical-nfc-pricing"; fail=1
          fi

          # Buyurtmalar — kirmasdan 200 + bo'sh ro'yxat (legacy
          # xulq). 404/5xx bo'lsa "To'lovlar tarixi" ekrani o'ladi.
          out=$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' \
            -H 'accept: application/json' "https://nfcstore.uz/api/orders" || echo 000)
          case "$out" in
            200|401) echo "OK    $out  /api/orders" ;;
            *) echo "XATO  $out  /api/orders"; fail=1 ;;
          esac

          echo "── Yaroqsiz kod 500 BERMASLIGI kerak ──"
          # Yo'q profil uchun toza 404/200 (SPA) bo'lishi mumkin,
          # lekin 5xx — hech qachon.
          out=$(curl -sS --location --max-time 25 -o /dev/null -w '%{http_code}' \
            -H 'accept: text/html' "https://nfcstore.uz/ZZZZ999" || echo 000)
          case "$out" in
            5*) echo "XATO  $out  /ZZZZ999 — yaroqsiz kod server xatosi bermasligi kerak"; fail=1 ;;
            *)  echo "OK    $out  /ZZZZ999" ;;
          esac

          [ "$fail" = "0" ] || { echo "::error::Smoke yiqildi — yuqoriga qarang."; exit 1; }
          echo "Smoke to'liq o'tdi."

      # EMAIL OTP — ATAYLAB IXTIYORIY.
      #
      # Bu qadam HAQIQIY xat yuboradi, shuning uchun doimiy smoke'ga
      # kiritilmadi: har tekshiruvda begona pochtaga xat yog'dirish
      # Resend'dagi domen obro'sini tushiradi va tezlik cheklovini
      # (bitta manzilga 10 daqiqada 3 ta) behuda yeydi.
      #
      # Manzil sifatida MAVJUD sinov hisobi ishlatiladi
      # (`NFC_LOGIN_EMAIL`) — GitHub uni logda maskalaydi, ya'ni
      # manzil ham, javobdagi hech narsa ham ochilmaydi. Kod
      # javobda umuman qaytmaydi: u faqat xat ichida bo'ladi.
      #
      # Hisob YARATILMAYDI: bu faqat kod so'rash, ro'yxatdan o'tish
      # emas.
      - name: Email OTP — kod kanali
        if: ${{ inputs.email_test }}
        env:
          TO: ${{ secrets.NFC_LOGIN_EMAIL }}
        run: |
          if [ -z "$TO" ]; then
            echo "::error::NFC_LOGIN_EMAIL secret yo'q."; exit 1
          fi
          out=$(curl -sS --max-time 25 -X POST -w '\n<<<%{http_code}>>>' \
            -H 'content-type: application/json' \
            --data "$(printf '{"email":"%s"}' "$TO")" \
            "https://nfcstore.uz/api/auth/request-register-code" || echo '<<<000>>>')
          code="${out##*<<<}"; code="${code%%>>>*}"
          body="${out%<<<*}"
          # Javobdan FAQAT kanal nomi olinadi. Butun tanani chop
          # etmaymiz: unda manzil bo'lishi mumkin.
          channel=$(printf '%s' "$body" | sed -n 's/.*"channel":"\([a-z]*\)".*/\1/p')
          # DIQQAT: `${var:-...}` ning ichida apostrof qo'shtirnoq
          # bilan himoyalanmaydi — u yerda "yo'q" deb yozish butun
          # skriptni sintaksis xatosiga olib keladi.
          echo "HTTP $code | channel=${channel:-?}"
          case "$channel" in
            email)
              echo "OK — server kodni EMAILGA yubordi."
              echo "Resend so'rovni qabul qildi: aks holda 503 email_send_failed kelardi."
              ;;
            none)
              echo "::error::channel=none — RESEND_API_KEY/RESEND_FROM jonli Workerda o'qilmadi."
              exit 1 ;;
            telegram)
              echo "::error::channel=telegram — email yo'li tanlanmadi."
              exit 1 ;;
            *)
              # Xato sababi MAXFIY EMAS: server faqat holat kodini
              # beradi ("http_403" kabi), Resend matni yoki kalit
              # hech qachon javobga tushmaydi.
              reason=$(printf '%s' "$body" | sed -n 's/.*"reason":"\([a-z0-9_]*\)".*/\1/p')
              err=$(printf '%s' "$body" | sed -n 's/.*"error":"\([a-z0-9_]*\)".*/\1/p')
              echo "::error::HTTP $code error=${err:-?} reason=${reason:-?}"
              exit 1 ;;
          esac
