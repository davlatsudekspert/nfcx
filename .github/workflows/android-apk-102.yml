# FINAL POLISH BUILD — Settings / Story / Reels / NFC
name: Android APK +102

on:
  push:
    branches:
      - codex/final-two-fixes
    paths:
      - .github/workflows/android-apk-102.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Functional tests
        shell: bash
        run: |
          mapfile -d '' files < <(find test -name '*_test.dart' ! -path 'test/audit/visual_audit_test.dart' -print0)
          flutter test "${files[@]}"

      - name: Prepare signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "Release keystore not configured; debug signing will be used."
            exit 0
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Keystore exists but password/alias is missing."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > android/app/nfcstore.jks
          cat > android/key.properties <<PROPS
          storeFile=nfcstore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          PROPS

      - name: Build split APKs +101
        run: |
          flutter build apk --release --split-per-abi \
            --build-name=1.0.0 \
            --build-number=102 \
            --dart-define=APP_VERSION=1.0.0+101

      - name: Build universal APK +101
        run: |
          flutter build apk --release \
            --build-name=1.0.0 \
            --build-number=102 \
            --dart-define=APP_VERSION=1.0.0+101

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK"
          fi

      - name: List outputs
        run: |
          ls -lah build/app/outputs/flutter-apk/
          sha256sum build/app/outputs/flutter-apk/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nfcstore-apk-102
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
