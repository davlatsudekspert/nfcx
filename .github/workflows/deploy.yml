name: Deploy to Cloudflare (nfcstore.uz)

# Faqat `main` branchga merge/push bo'lganda ishga tushadi — boshqa
# branchlarda (feature/PR branchlari) hech qanday deploy bo'lmaydi.
on:
  push:
    branches:
      - main
  # QO'LDA QAYTA DEPLOY — "Run workflow" tugmasi.
  #
  # Nima uchun kerak bo'ldi: sayt ishdan chiqqanda yagona chora
  # `main` ga yangi commit push qilish edi — ya'ni tuzatadigan
  # o'zgarish bo'lmasa ham, faqat deploy'ni qayta yurgizish uchun.
  # Cloudflare'ning o'z Git integratsiyasi esa alohida "build token"
  # ga bog'liq va u buzilganda umuman ishga tushmaydi (2026-09-15 da
  # aynan shunday bo'ldi).
  #
  # Bu tugma HECH NARSANI o'zgartirmaydi: o'sha `main` dagi kodni
  # qaytadan chiqaradi, ya'ni ishlab turgan holatga qaytarish uchun
  # eng qisqa yo'l. Actions -> "Deploy to Cloudflare (nfcstore.uz)"
  # -> Run workflow.
  workflow_dispatch:

# Ikkita push ketma-ket kelsa, oldingi deploy tugamasdan yangisi
# boshlanmaydi (production'ga bir vaqtda ikkita deploy yugurmasin uchun).
concurrency:
  group: cloudflare-deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Dependency'larni o'rnatish
        run: npm ci

      # MARSHRUTLAR TEKSHIRUVI — DEPLOY'DAN OLDIN.
      #
      # `hosting/worker.js` da marshrutlash ikki qavat: tashqi `if`
      # `coreApi()` ni chaqiradimi, ichkarisi esa qaysi ishlovchiga
      # berishni hal qiladi. Ichkariga yozib, tashqariga qo'shishni
      # unutish oson va natija JIM: so'rov umumiy tutqichga tushib
      # `{"error":"not_found"}` qaytaradi. `GET /api/feed` aynan
      # shunday bo'ldi va ilovadagi Reels tabi ishlamay turdi.
      - name: API marshrutlari yetib boradimi
        run: node scripts/api-route-reachability-test.mjs

      # CSS QAMROVI TEKSHIRUVI.
      #
      # `src/company-system.css` global emas — u faqat uni import
      # qilgan sahifa bilan birga yuklanadi. Undagi sinfni boshqa
      # sahifada ishlatish JIM xato beradi: element brauzerning
      # uslubsiz standart ko'rinishida chiqadi. Bu loyihada shu xato
      # uch marta takrorlangan (oxirgisi — shaxsiy kabinetdagi
      # "＋ Istorya qo'shish" tugmasi).
      - name: Sahifa ishlatayotgan CSS unga yuklanadimi
        run: node scripts/css-scope-test.mjs

      # PROFIL O'CHIRILGANDA HAMMASI O'CHADIMI.
      #
      # Jadvallar `cards` ga FK bilan bog'lanmagan, ya'ni CASCADE
      # yo'q va tozalash qo'lda qilinadi. Yangi jadval ro'yxatdan
      # tushib qolsa hech qanday xato chiqmaydi — faqat ma'lumot
      # qoladi. Istorya aynan shunday qolib ketgan va 8 xonali kod
      # qayta sotilganda yangi egaga "meros" bo'lib o'tardi.
      - name: Profil o'chirilganda ma'lumot qolmaydimi
        run: node scripts/test-card-cleanup.mjs

      # O'CHIRILGAN HISOB KONTENTI KO'RINMAYDIMI.
      #
      # Admin paneldagi "foydalanuvchini o'chirish" — yumshoq
      # o'chirish (`users.deleted_at`), qator esa buyurtma va to'lov
      # tarixi uchun ataylab qoladi. Ommaviy so'rovlarning birortasi
      # ham bu belgini tekshirmasdi: o'chirilgan hisobning profili,
      # posti va storysi katalogda ham, Reels'da ham turaverardi —
      # egasi buni uch marta xabar qildi. Test har bir ommaviy yo'lni
      # (profil, postlar, storylar, lenta, story lentasi, katalog,
      # qidiruv, kompaniya sahifasi) alohida tekshiradi.
      - name: O'chirilgan hisob kontenti ommaga chiqmaydimi
        run: node scripts/test-deleted-user-content.mjs

      # PROFIL SAHIFALARINING MAKETI.
      #
      # Ikkala profilda ham (shaxsiy `/:code` va biznes `/c/:id`)
      # "Kontaktni saqlash" pastda YOPISHIB turadi. `position:sticky`
      # esa ota-blokda `overflow:hidden` bo'lsa JIMGINA ishlamay
      # qoladi — hech qanday xato chiqmaydi, tugma shunchaki pastga
      # tushib ketadi. Bu ikki test o'sha maketni qo'riqlaydi.
      - name: Shaxsiy profil maketi
        run: node scripts/test-profile-page.mjs

      # OCHIQ PROFIL TEPASI — ko'rish uchun, boshqaruv uchun emas.
      # Ilgari u yerda TOP nishoni katta blok bo'lib, yonida egaga
      # tegishli "Tahrirlash", "Story qo'shish" va "Boshqa raqamli
      # tashrif qog'ozlaringiz" ro'yxati turardi. Ega amallari endi
      # ⋮ menyusida; mehmon ularni umuman ko'rmaydi.
      - name: Ochiq profil tepasi
        run: node scripts/test-public-profile-top.mjs

      # OCHIQ PROFIL BOSHI — BITTA TIZIM.
      # Tartib qat'iy: [nusxalash] [ulashish] [⋮] [♥]. Yurak ilgari
      # obunachilar soni bilan bir qatorda "statistika" bo'lib
      # turardi. Shu yerda avatar atrofidagi ikki halqa (tashqi =
      # story, ichki = musiqa) ustma-ust tushmasligi va musiqa yo'q
      # bo'lganda halqa UMUMAN chizilmasligi ham qo'riqlanadi.
      - name: Ochiq profil boshi va musiqa halqasi
        run: node scripts/test-profile-header.mjs

      - name: Biznes profil maketi
        run: node scripts/test-quick-profile-screen.mjs

      # MUSIQA YUKLASH — E'LON QILINGAN TUR va FAYLNING O'ZI.
      #
      # SHIKOYAT (2026-09, egasi): "androidda mp3 tanlasam
      # qo'llab-quvvatlamaydi deydi". Sabab: yuklovchi brauzer aytgan
      # `Content-Type` ni faylning sehrli baytlari bilan solishtiradi
      # va farq bo'lsa rad etadi. Android esa mp3 ni `audio/mp3` deb
      # e'lon qiladi, baytlar esa `audio/mpeg` beradi — ikkalasi bir
      # xil fayl, nomi boshqa. FLAC umuman tanilmasdi.
      #
      # Test HAQIQIY sehrli baytlar bilan (ID3, xom mp3 kadri, wav,
      # ogg, flac, m4a, webm) yuklaydi va yot faylni (jpg, pdf)
      # hamon rad etishini tekshiradi — ya'ni taqqoslash yumshatildi,
      # olib tashlanmadi.
      - name: Musiqa yuklash formatlari
        run: node scripts/test-audio-upload.mjs

      # SAHIFA FONI.
      #
      # Bu ishda topilgan haqiqiy xato: `theme.css` dagi bitta izohda
      # yulduzcha va qiyshiq chiziq yonma-yon kelib qolgan va IZOHNI
      # ERTA TUGATGAN. Undan keyingi `body{...}` qoidalari jimgina
      # yo'qolgan — faylda bor, brauzerda yo'q, xato ham chiqmaydi.
      # Test shu holatni va fon qatlamlarining o'rnini qo'riqlaydi.
      - name: Sahifa foni va kontrast
        run: node scripts/test-page-background.mjs

      # STORY VA POST MUSTAQILLIGI.
      #
      # Haqiqiy xato: story yuklash bloki IKKI JOYDA ikki xil yozilgan
      # edi va tuzatish faqat bittasiga tushgan. Ikkinchisida saqlash
      # tugmasi umuman yo'q edi — fayl tanlangan zahoti e'lon
      # qilinardi, yonidagi post blokida esa "Postni saqlash" turardi.
      # Egasi shundan "story postsiz saqlanmaydi" degan xulosaga
      # kelgan. Test nusxa qaytib kelishiga yo'l qo'ymaydi.
      # MARKETPLACE — UNIVERSAL NFC AKTIVATSIYA.
      #
      # Bu qo'riqchi eng avvalo PARALLEL TIZIM YARATILMAGANINI
      # tekshiradi: yangi ID generatori yo'q (auth.js dagi allokator
      # chaqiriladi), alohida tarif/limit jadvali yo'q, alohida profil
      # modeli yo'q. Qolgani — pul va egalik bilan bog'liq: bitta
      # kodni ikki odam egallab ololmasligi (qo'lda aralashtirilgan
      # haqiqiy poyga bilan), yarim qolgan aktivatsiyadan orfan ID
      # qolmasligi va tugmani ikki marta bosish ikkinchi ID
      # yaratmasligi.
      - name: Marketplace aktivatsiyasi
        run: node scripts/test-marketplace.mjs

      # KONTAKTNI SAQLASH (vCard) — NFC KARTANING BUTUN MA'NOSI.
      # Odam tegizadi, sahifani yopadi — raqam uning telefonida
      # QOLADI. Tugma BIZNES profilida umuman yo'q edi, shaxsiy
      # profil esa o'z, buzuq nusxasini ishlatardi (vergul
      # qalqonlanmasdi, CRLF yo'q, `NOTE2:` degan mavjud bo'lmagan
      # maydon). Endi uchalasi ham bitta yozuvchidan.
      - name: Kontaktni saqlash (vCard)
        run: node scripts/test-vcard.mjs

      - name: Story va post mustaqilligi
        run: node scripts/test-story-post-separate.mjs

      # STORY VA POST ARALASHMASLIGI — BACKEND KAFOLATI.
      # Interfeys ajratilgani yetarli emas: story yaratish POST
      # jadvaliga tushmasligi va aksincha. Test haqiqiy worker'ga
      # so'rov yuborib, HAR IKKALA sonni bir vaqtda o'lchaydi va
      # shaxsiy/biznes kontekstlari aralashmasligini ham tekshiradi.
      - name: Story va post ajralishi
        run: node scripts/test-story-post-isolation.mjs

      # IZOH TOZALAGICHI — QO'RIQCHILARNING O'ZINI QO'RIQLAYDI.
      #
      # Tekshiruvlar manbadan izohlarni olib tashlab ishlaydi. Ilgari bu
      # oddiy regex bilan qilinardi va u `accept="image/*"` dagi `/*` ni
      # izoh boshi deb o'qib, 117 KB tirik kodni o'chirib yuborardi —
      # natijada qo'riqchi mavjud kodni "yo'q" deb YOLG'ON yiqilardi.
      # Eng yomoni, manbaga yangi izoh qo'shilishi juftlikni surib,
      # minani har safar boshqa joyga ko'chirardi.
      - name: Izoh tozalagich (qo'riqchilar asosi)
        run: node scripts/test-strip-comments.mjs

      # STORY OQIMI — YARATISHDAN KO'RINISHGACHA.
      #
      # Egasining xabari: "3-4 ta story qo'ysam bittasi ko'rinadi".
      # Test haqiqiy worker va SQLite ustida yuradi: ketma-ket to'rtta
      # story yaratadi va GET to'rttasini ham qaytarishini tekshiradi;
      # muddati o'tganlar chegaraga kirmasligini, 11-chisi 409
      # berishini va har bir xato kodining o'z o'zbekcha xabari
      # borligini ham qo'riqlaydi.
      - name: Story oqimi
        run: node scripts/test-story-flow.mjs

      # ISTORYA QOIDALARI — 79 tekshiruv. Bu to'plam repoda bor edi,
      # lekin deploy qo'riqchisiga ULANMAGAN edi. 24 soatlik muddat,
      # egalik, daraja chegarasi va media manbai shu yerda.
      - name: Istorya qoidalari
        run: node scripts/test-stories.mjs

      # LENTA KATAGI — "son bor, rasm yo'q" holatining oldini oladi.
      #
      # Egasining xabari: VIP001 da "Stories 7" deb turardi, lekin
      # bitta rasm ko'rinib, olti katak qop-qora edi. Sababi: video
      # katagida `poster` yo'q edi (brauzer kadr olmaydi) va `<img>`
      # da `onError` umuman yo'q edi (fayl 404 bo'lsa jim yiqilardi)
      # — ikkalasi ham ekranda BIR XIL qora to'rtburchak berardi.
      # Test har katakda yo chizilgan media, yo NOMLANGAN qatlam
      # (xato / video) borligini qo'riqlaydi.
      # GLOBAL MEDIA QO'RIQCHISI.
      #
      # Productionda VIP001 da to'qqizta storydan yettitasi va o'n
      # sakkizta postning ko'pi qop-qora to'rtburchak edi. Ikkala
      # joyda ham sabab bitta: media ko'rsatadigan har bir joy o'zicha
      # <img>/<video> chizardi va "media kelmasa nima ko'rsatamiz?"
      # degan savolga javob bermasdi. Javob endi bitta joyda —
      # MediaThumb da — va bu test o'shani qo'riqlaydi.
      - name: Media qatlami (global)
        run: node scripts/test-media-guard.mjs

      - name: Lenta katagi
        run: node scripts/test-story-grid.mjs

      # POST RO'YXATI. Mediasiz post `<img src="">` chizib qora slot
      # berardi; endi u MATN kartasi bo'ladi.
      - name: Post ro'yxati
        run: node scripts/test-post-grid.mjs

      # NO-OP AUDITI — "bosiladi, lekin hech narsa qilmaydi".
      # `/api/feed`, `/api/my/nfc-devices` va biznes profilidagi
      # "Workspace" tugmasi aynan shu turdagi xato edi.
      - name: No-op auditi
        run: node scripts/test-noop-audit.mjs

      # AUTH / SESSIYA. Asosiy shart: ANONIM TASHRIFCHI XATO EMAS.
      # `/api/auth/me` 200 + user:null berishi kerak, 401 emas —
      # aks holda frontend buni "sessiya tugadi" deb o'qib, odamni
      # tizimdan chiqarib yuborardi. 403 ham sessiyani tugatmaydi.
      - name: Auth va sessiya
        run: node scripts/test-auth-session.mjs

      # BOG'LANGAN NFC QURILMALARI. Bu yo'l produksiyada 404 berardi
      # ("handler bor" != "so'rov yetib boradi"). Test haqiqiy
      # worker'ga so'rov yuboradi va egalik tekshiruvlarini ham
      # qo'riqlaydi (to'liq chip token hech qachon chiqmaydi).
      - name: NFC qurilmalari
        run: node scripts/test-nfc-devices.mjs

      # TARJIMA QOPLAMI — RATCHET.
      # Lug'atda yo'q matn ekranni buzmaydi (o'zbekcha manba matn
      # qaytadi), lekin rus/ingliz tilidagi odam o'zbekcha jumla
      # ko'radi. Test hammasini bir yo'la tuzatishni talab qilmaydi —
      # faqat SONNING O'SISHINI to'xtatadi.
      - name: Tarjima qoplami
        run: node scripts/test-i18n-coverage.mjs

      # EKRANDA "NaN" CHIQMASIN.
      # Profilda "Faol bo'lgan: NaN kun oldin" ko'rindi: `timeAgo()`
      # kiruvchi qiymatni albatta son deb hisoblardi, amalda esa u
      # ISO satr ham, sekund ham, umuman yo'q ham bo'lishi mumkin.
      - name: Format xavfsizligi
        run: node scripts/test-format-safety.mjs

      # SO'ROV BUDJETI — sayt nega sekin ochilardi.
      # Profil sahifasi 27 ta API so'rovi yuborardi, 10 tasi aynan
      # takror. Endi 14 ta, takror 0. Test o'sha uch sababning
      # (takror effekt, butun katalog, mos kelmaydigan modullar)
      # qaytib kelishini to'xtatadi.
      - name: So'rov budjeti
        run: node scripts/test-request-budget.mjs

      # BIZNES STATISTIKASI — yozishdan grafikka qadar.
      # Bir paytlar "BACKEND REQUIRED" deb belgilangan edi; aslida
      # to'liq ishlaydi. Endi buni test aytadi, taxmin emas.
      - name: Biznes statistikasi
        run: node scripts/test-company-analytics.mjs

      # E2E MARKERI. Produksiya postlarini o'chirish qoidasi —
      # bitta yolg'on ijobiy javob odamning haqiqiy postini
      # o'chirib yuborardi.
      - name: E2E markeri
        run: node scripts/test-e2e-marker.mjs

      - name: Build (vite build + prepare-sites-build)
        run: npm run build

      # CLOUDFLARE_API_TOKEN — FAQAT GitHub Secrets orqali keladi, bu
      # faylda yoki boshqa hech qayerda yozilmagan. Repo sozlamalarida
      # qo'shilishi kerak: Settings → Secrets and variables → Actions →
      # New repository secret → nomi aynan CLOUDFLARE_API_TOKEN.
      # Token yo'q/noto'g'ri bo'lsa `wrangler deploy` xato bilan
      # to'xtaydi va shu step (demak butun workflow) FAIL bo'ladi.
      - name: Cloudflare Workers'ga deploy qilish
        run: npx wrangler@4.129.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
