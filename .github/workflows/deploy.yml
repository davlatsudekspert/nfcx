name: Deploy to Cloudflare (nfcstore.uz)

# Faqat `main` branchga merge/push bo'lganda ishga tushadi — boshqa
# branchlarda (feature/PR branchlari) hech qanday deploy bo'lmaydi.
on:
  push:
    branches:
      - main

# Ikkita push ketma-ket kelsa, oldingi deploy tugamasdan yangisi
# boshlanmaydi (production'ga bir vaqtda ikkita deploy yugurmasin uchun).
concurrency:
  group: cloudflare-deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Dependency'larni o'rnatish
        run: npm ci

      - name: Build (vite build + prepare-sites-build)
        run: npm run build

      # CLOUDFLARE_API_TOKEN — FAQAT GitHub Secrets orqali keladi, bu
      # faylda yoki boshqa hech qayerda yozilmagan. Repo sozlamalarida
      # qo'shilishi kerak: Settings → Secrets and variables → Actions →
      # New repository secret → nomi aynan CLOUDFLARE_API_TOKEN.
      # Token yo'q/noto'g'ri bo'lsa `wrangler deploy` xato bilan
      # to'xtaydi va shu step (demak butun workflow) FAIL bo'ladi.
      - name: Cloudflare Workers'ga deploy qilish
        run: npx wrangler@4.129.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
