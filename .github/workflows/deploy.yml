name: Deploy to Cloudflare (nfcstore.uz)

# Faqat `main` branchga merge/push bo'lganda ishga tushadi — boshqa
# branchlarda (feature/PR branchlari) hech qanday deploy bo'lmaydi.
on:
  push:
    branches:
      - main
  # QO'LDA QAYTA DEPLOY — "Run workflow" tugmasi.
  #
  # Nima uchun kerak bo'ldi: sayt ishdan chiqqanda yagona chora
  # `main` ga yangi commit push qilish edi — ya'ni tuzatadigan
  # o'zgarish bo'lmasa ham, faqat deploy'ni qayta yurgizish uchun.
  # Cloudflare'ning o'z Git integratsiyasi esa alohida "build token"
  # ga bog'liq va u buzilganda umuman ishga tushmaydi (2026-09-15 da
  # aynan shunday bo'ldi).
  #
  # Bu tugma HECH NARSANI o'zgartirmaydi: o'sha `main` dagi kodni
  # qaytadan chiqaradi, ya'ni ishlab turgan holatga qaytarish uchun
  # eng qisqa yo'l. Actions -> "Deploy to Cloudflare (nfcstore.uz)"
  # -> Run workflow.
  workflow_dispatch:

# Ikkita push ketma-ket kelsa, oldingi deploy tugamasdan yangisi
# boshlanmaydi (production'ga bir vaqtda ikkita deploy yugurmasin uchun).
concurrency:
  group: cloudflare-deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Dependency'larni o'rnatish
        run: npm ci

      # MARSHRUTLAR TEKSHIRUVI — DEPLOY'DAN OLDIN.
      #
      # `hosting/worker.js` da marshrutlash ikki qavat: tashqi `if`
      # `coreApi()` ni chaqiradimi, ichkarisi esa qaysi ishlovchiga
      # berishni hal qiladi. Ichkariga yozib, tashqariga qo'shishni
      # unutish oson va natija JIM: so'rov umumiy tutqichga tushib
      # `{"error":"not_found"}` qaytaradi. `GET /api/feed` aynan
      # shunday bo'ldi va ilovadagi Reels tabi ishlamay turdi.
      # WORKER YIQILSA SABAB KO'RINADIMI.
      #
      # `handleRequest` himoyasiz chaqirilsa, undagi istalgan
      # istisno BO'SH TANALI 500 bo'lib chiqadi — na sabab, na yo'l.
      # Ulashish havolasi (`nfcstore.uz/KOD`) aynan shunday 500
      # berardi va sababi bir necha kun ko'rinmadi.
      # BINDING E'LON QILINGANMI.
      #
      # `wrangler.jsonc` dagi `assets` blokida `binding` yo'q edi va
      # `env.ASSETS` undefined bo'lib qoldi: bosh sahifadan boshqa
      # HAR BIR yo'l 500 qaytardi. Xato konfiguratsiyada edi, kodda
      # emas — shuning uchun birorta kod testi uni tutolmasdi.
      - name: Kod ishlatadigan binding'lar e'lon qilinganmi
        run: node scripts/test-worker-bindings.mjs

      # BILDIRISHNOMALAR — ilova va sayt uchun BITTA tizim.
      #
      # O'qildi holati backendda saqlanadi, shuning uchun telefonda
      # o'qilgan xabar saytda ham o'qilgan bo'lib ko'rinadi. Test
      # egalik, takrorlanmaslik va o'ziga xabar yubormaslikni ham
      # tekshiradi.
      - name: Bildirishnomalar (obuna / like / izoh)
        run: node scripts/test-notifications.mjs
      # Muddati (24 soat) o'tgan "kutilmoqda" buyurtmalar kunlik cron va
      # admin ro'yxatida yopiladi; yangi, to'langan va Payme maydonlariga
      # tegilmaydi.
      - name: Eskirgan buyurtmalarni avtomatik yopish
        run: node scripts/test-order-expire-sweep.mjs
      # Google/Yandex: bizneslar sitemap'i va profil kartochkalari. Shaxsiy
      # NFC ID hech qachon sitemap'da emas va har doim noindex (maxfiylik).
      - name: SEO — biznes sitemap va profil kartochkalari
        run: node scripts/test-seo-profiles.mjs
      - name: SEO — sayt sahifalari meta'si, haqiqiy 404 va sitemap
        run: node scripts/test-spa-routes-seo.mjs
      # O'zbekiston serveri (547-son Qonun, 27-1-modda): env.DB/UPLOADS
      # adapterlari (hosting/uz-store.js) D1/R2 kabi ishlaydimi va asosiy
      # oqimlar adapter orqali ham o'zgarishsiz o'tadimi.
      - name: UZ server adapterlari (sqld/Garage) — D1/R2 bilan moslik
        run: |
          node scripts/test-uz-store.mjs
          node scripts/test-uz-sql-keywords.mjs
          node scripts/test-uz-cold-start.mjs
          for t in test-auth test-account-deletion test-media test-stories test-seo-profiles test-order-expire-sweep test-follow-count-consistency test-company-follow-stats test-upload-edge-cache test-audio-upload test-content-views test-carousel test-product-tags test-highlights test-story-replies test-saves-collections test-nearby test-scheduled-posts test-post-contact test-feed-following test-support-replies test-reels-ranking test-legal-requests test-trial-reminders test-admin-premium-grant test-trial-promo test-apple-jws test-iap-apple test-iap-apple-boost test-featured-sales test-referral-rewards test-admin-apple test-admin-audit test-phone-unchanged test-unchecked-queue; do
            echo "== UZ adapter: $t"; UZ_ADAPTER_TEST=1 node scripts/$t.mjs | tail -n 1
            [ "${PIPESTATUS[0]}" = 0 ] || exit 1
          done
      - name: Izoh moderatsiyasi — soft-delete va dalil arxivi
        run: node scripts/test-comment-moderation.mjs
      # Izohga JAVOB va izohga LIKE. Javob bir qavat, begona
      # kontentning izohiga javob yozib bo'lmaydi, o'chirilganga
      # na javob na like, xabar esa ota izoh muallifiga ketadi.
      - name: Izoh mavzulari — javob va like
        run: node scripts/test-comment-threads.mjs
      # Izoh: 2026-10-04 dan HAMMAGA bepul (Premium/sinov shart emas);
      # faqat bloklangan yozolmaydi, o'qish hammaga ochiq.
      - name: Izoh — hammaga bepul, ban yopadi
        run: node scripts/test-comment-trial.mjs
      # Post, video/Reels, istorya va izoh — bepul hisob (sinov tugagan,
      # Premium yo'q) ham yozadi; bloklangan yozolmaydi; spam chegarasi.
      # App Store 3.1.1: asosiy imkoniyat tashqi to'lovga bog'lanmasin.
      - name: Bepul nashr — post, Reels, istorya, izoh
        run: node scripts/test-free-publishing.mjs
      # Admin shikoyatlar: istalgan so'z bo'yicha qidiruv, sahifalash,
      # avtomatik sinov (E2E) yozuvlari ro'yxatga chiqmaydi.
      - name: Admin shikoyatlar — qidiruv va E2E filtri
        run: node scripts/test-admin-reports-search.mjs
      # Ilovadagi "Odamlar": yangi ro'yxatdan o'tganlar ko'rinadi, sotuv
      # katalogi (/api/records) esa o'zgarmaydi.
      - name: Ilova "Odamlar" ro'yxati
        run: node scripts/test-people-directory.mjs
      # Google Play tekshiruvchisi hisobi: faqat admin, kodsiz kirish,
      # qayta bosilsa yangi parol, jurnalda parol yo'q.
      - name: Google Play tekshiruvchisi hisobi
        run: node scripts/test-review-account.mjs
      # Ro'yxat: band telefon/email KOD YUBORISHDAN OLDIN aytiladi,
      # band chiqsa kod yondirilmaydi.
      - name: Ro'yxatda band telefon/email
        run: node scripts/test-register-conflict.mjs
      # Promokod: taklif qilinganlar ro'yxati ism/email/sana bilan.
      - name: Promokod ro'yxati
        run: node scripts/test-referrals.mjs
      # Promokod mukofoti: har tasdiqlangan do'st uchun +30 kun Premium (sinovdan
      # keyin), bir marta, yillik chegara; /i/:code havolasi; xulosa va reyting.
      - name: Promokod mukofoti — +1 oy Premium, /i/ havola, reyting
        run: node scripts/test-referral-rewards.mjs
      # Qayta ishlatilgan post raqami: eski izoh yangi postda ko'rinmasin.
      - name: Eski izoh yangi postga yopishmasin
        run: node scripts/test-comment-recycled-id.mjs
      # Rasmlar Cloudflare chegara keshida: ikkinchi so'rov R2'ga bormaydi.
      - name: Rasm chegara keshi
        run: node scripts/test-upload-edge-cache.mjs
      # Avtomatik filtr: rasm VA video (18+, zo'ravonlik, ekstremizm,
      # siyosiy, giyohvandlik, nafrat) — Gemini soxtalashtiriladi.
      - name: Avto-filtr — rasm va video
        run: node scripts/test-content-filter.mjs
      - name: NFCSTORE FEATURED — slot faqat haqiqiy to'lovdan keyin yonadi
        run: node scripts/test-featured.mjs
      # Ko'tarish sotuvi 1000 foydalanuvchida ochiladi: yopiq paytda 409,
      # bepul navbat, ochilish saqlanadi, 48 soatlik ustuvor oyna, bitta xabar.
      - name: Ko'tarish sotuvi — 1000 foydalanuvchi va navbat
        run: node scripts/test-featured-sales.mjs
      # IJTIMOIY IMKONIYATLAR (2026-10). Har biri o'z testida: egalik,
      # tekshiruv, eski ilovalar bilan moslik va maxfiylik (sizib chiqish).
      # Karusel: postda 10 tagacha rasm, birinchisi eski `imageUrl`.
      - name: Karusel — postda 10 tagacha rasm
        run: node scripts/test-carousel.mjs
      # Reels "Obunalar" tabi: faqat obuna bo'lingan odam/kompaniya kontenti.
      - name: Obunalar lentasi (scope=following)
        run: node scripts/test-feed-following.mjs
      # Reels "Siz uchun": saralash (yangilik, faollik, obuna, ko'rilgan),
      # "qiziq emas", xilma-xillik, kursor bilan barqaror sahifalash, reklama.
      - name: Reels saralash (/api/reels)
        run: node scripts/test-reels-ranking.mjs
      # Admin "Huquqiy so'rov": bitta odamning hozir turgan va o'chirilgan
      # kontenti, hold (purge to'siladi), eksport, rollar va jurnal.
      - name: Huquqiy so'rov — dosye, hold va eksport
        run: node scripts/test-legal-requests.mjs
      # Aksiya: mavjud sinovlar bir marta 90 kunga uzaytiriladi (qisqarmaydi).
      - name: Mavjud sinovlarni 90 kunga uzaytirish (bir marta)
        run: node scripts/test-trial-promo.mjs
      # Apple In-App Purchase (iOS Premium): JWS imzosi Apple Root CA - G3 ga
      # pin, zanjir, OID va muddat; soxta zanjir rad etiladi.
      - name: Apple JWS — imzo va sertifikat zanjiri
        run: node scripts/test-apple-jws.mjs
      # verify/notifications: max() bilan berish, idempotent, egalik (403/409),
      # tugagan/qaytarilgan berilmaydi, REFUND sayt (Payme/Click) vaqtini olmaydi.
      - name: Apple IAP — Premium obunasi (verify va bildirishnomalar)
        run: node scripts/test-iap-apple.mjs
      # Ko'tarish (FEATURED) iOS'da — consumable: ushlab turish, xarid → slot,
      # idempotent/poyga, sold out → kredit → redeem, REFUND to'xtatadi.
      - name: Apple IAP — Ko'tarish (consumable)
        run: node scripts/test-iap-apple-boost.mjs
      # Admin "Apple / iOS": holat, obunalar, tranzaksiyalar (maskalash), kartochka,
      # faol Apple obunasida Premium olib qo'yish 409, Apple slotiga kredit qayta berish.
      - name: Admin — Apple / iOS bo'limi
        run: node scripts/test-admin-apple.mjs
      # Admin audit: serverda sahifalash va filtrlar (hasMore), content_manager uchun
      # niqoblash, chipToken yo'q, ruxsatsiz boshqaruvlar yashirilgan, tasdiq oynalari.
      - name: Admin audit — sahifalash, niqoblash, ruxsatlar
        run: node scripts/test-admin-audit.mjs
      # Bepul sinov: admin tarif filtri, "sinov tugayapti" eslatmasi (cron,
      # bir marta, Premium'ga emas) va aksiya muddati (2026 oxirigacha 90 kun).
      - name: Bepul sinov — filtr, eslatma va aksiya muddati
        run: node scripts/test-trial-reminders.mjs
      # Admin Premium beradi/oladi: 1/3/6/12 oy, muddatsizga tegilmaydi, izoh shart.
      - name: Admin Premium berish
        run: node scripts/test-admin-premium-grant.mjs
      # Murojaatga admin javobi egasiga bildirishnoma bo'lib boradi;
      # holatlar (javob berilgan / hal qilindi / rejada), filtr va sanoq.
      - name: Murojaat javoblari va bildirishnoma
        run: node scripts/test-support-replies.mjs
      # Biznes postida o'z katalogidan 5 tagacha mahsulot belgisi.
      - name: Postda mahsulot belgilash
        run: node scripts/test-product-tags.mjs
      # Biznes postidagi "Bog'lanish": faqat ochiq telefon/Telegram/xarita.
      - name: Biznes postidagi kontakt tugmasi
        run: node scripts/test-post-contact.mjs
      # Aktual: istoriya o'chsa ham nusxa va fayl qoladi.
      - name: Aktual (highlights)
        run: node scripts/test-highlights.mjs
      # Istoriyaga javob, kim ko'rdi (faqat egasi), javoblar qutisi.
      - name: Istoriyaga javob va ko'rganlar
        run: node scripts/test-story-replies.mjs
      # Saqlanganlar: postlar va nomli to'plamlar (o'chirish saqlanganni o'chirmaydi).
      - name: Saqlanganlar — postlar va to'plamlar
        run: node scripts/test-saves-collections.mjs
      - name: Yaqin atrofdagi bizneslar
        run: node scripts/test-nearby.mjs
      # Rejadagi post vaqti kelguncha egasidan boshqaga ko'rinmaydi;
      # issiq yo'llarga yangi to'lqin qo'shilmagani ham shu yerda.
      - name: Rejalashtirilgan postlar
        run: node scripts/test-scheduled-posts.mjs
      # Shaxsiy NFC ID xaridi: narxni SERVER hisoblaydi, bitta kodni
      # ikki kishi ola olmaydi va to'lanmaguncha ID biriktirilmaydi.
      - name: NFC ID xaridi — narx, band qilish va to'lov
        run: node scripts/test-nova-id-purchase.mjs
      - name: Admin "NFCSTORE ILOVASI" — tugmalar haqiqatdan ishlaydimi
        run: node scripts/test-admin-nova-tab.mjs
      # O'chirilgan kontent dalil arxivi: nusxa o'chirishdan OLDIN yoziladi,
      # fayl R2 da qoladi, arxivni faqat admin ko'radi.
      - name: Dalil arxivi — o'chirilgan post, istoriya, video, izoh
        run: node scripts/test-content-archive.mjs
      - name: Ilova foydalanuvchilari — kim ishlatyapti (admin)
        run: node scripts/test-app-usage.mjs
      # Admin "NFCSTORE ILOVASI": avto-filtr jurnali, ilova kontenti,
      # biznes buyurtmalari (faqat admin) va ilova build raqami.
      - name: Ilova admin — avto-filtr, kontent, buyurtmalar, build
        run: node scripts/test-app-admin.mjs
      # posts.id qayta ishlatiladi: o'chirilgan postning izoh va layklari
      # keyingi yangi postga o'tib qolmasin.
      - name: Post raqami qayta ishlatilganda eski izoh/layk yopishmaydi
        run: node scripts/test-post-id-reuse.mjs
      - name: Bir martalik tuzatish — yopishgan eski izoh/layk, admin ro'yxatida E2E yo'q
        run: node scripts/test-recycled-post-repair.mjs
      # Reels/post ko'rishlari (bir odam — bir marta, egasi sanalmaydi)
      # va ilovadagi Sozlamalar → Analitika (/api/my/analytics).
      - name: Ko'rishlar hisoblagichi va analitika
        run: node scripts/test-content-views.mjs
      # Ulashilgan Reels/post havolasi (/post/:id) profilni emas, aynan
      # shu videoni ochadi; og:video kartochkasi, o'chirilgani — 404.
      - name: Ulashilgan post sahifasi
        run: node scripts/test-post-page.mjs
      # Katalog tovarlarida ko'rishlar soni (necha kishi) — Tanlov va vitrina.
      - name: Katalog tovarlari ko'rishlari
        run: node scripts/test-catalog-views.mjs
      # Manifestdagi yaroqsiz XML ilova qurilishini yiqitadi, lekin
      # `flutter analyze` ham, `flutter test` ham uni o'qimaydi.
      # Eski ilovaning CI'si esa faqat QO'LDA ishga tushadi —
      # ya'ni u yerdagi xato oylab sezilmay turardi.
      - name: AndroidManifest fayllari yaroqli XML mi
        run: node scripts/test-android-manifests.mjs

      - name: Worker yiqilsa sabab ko'rinadimi
        run: node scripts/test-worker-error-visibility.mjs

      - name: API marshrutlari yetib boradimi
        run: node scripts/api-route-reachability-test.mjs

      # CSS QAMROVI TEKSHIRUVI.
      #
      # `src/company-system.css` global emas — u faqat uni import
      # qilgan sahifa bilan birga yuklanadi. Undagi sinfni boshqa
      # sahifada ishlatish JIM xato beradi: element brauzerning
      # uslubsiz standart ko'rinishida chiqadi. Bu loyihada shu xato
      # uch marta takrorlangan (oxirgisi — shaxsiy kabinetdagi
      # "＋ Istorya qo'shish" tugmasi).
      - name: Sahifa ishlatayotgan CSS unga yuklanadimi
        run: node scripts/css-scope-test.mjs

      # PROFIL O'CHIRILGANDA HAMMASI O'CHADIMI.
      #
      # Jadvallar `cards` ga FK bilan bog'lanmagan, ya'ni CASCADE
      # yo'q va tozalash qo'lda qilinadi. Yangi jadval ro'yxatdan
      # tushib qolsa hech qanday xato chiqmaydi — faqat ma'lumot
      # qoladi. Istorya aynan shunday qolib ketgan va 8 xonali kod
      # qayta sotilganda yangi egaga "meros" bo'lib o'tardi.
      - name: Profil o'chirilganda ma'lumot qolmaydimi
        run: node scripts/test-card-cleanup.mjs

      # O'CHIRILGAN HISOB KONTENTI KO'RINMAYDIMI.
      #
      # Admin paneldagi "foydalanuvchini o'chirish" — yumshoq
      # o'chirish (`users.deleted_at`), qator esa buyurtma va to'lov
      # tarixi uchun ataylab qoladi. Ommaviy so'rovlarning birortasi
      # ham bu belgini tekshirmasdi: o'chirilgan hisobning profili,
      # posti va storysi katalogda ham, Reels'da ham turaverardi —
      # egasi buni uch marta xabar qildi. Test har bir ommaviy yo'lni
      # (profil, postlar, storylar, lenta, story lentasi, katalog,
      # qidiruv, kompaniya sahifasi) alohida tekshiradi.
      - name: O'chirilgan hisob kontenti ommaga chiqmaydimi
        run: node scripts/test-deleted-user-content.mjs

      # HISOBNI O'CHIRISH, 1-BOSQICH (ACCOUNT_DELETION_PLAN.md, PR-1).
      #
      # O'chirish navbatidagi hisob emaili yoki telefoni bilan qayta
      # ro'yxatdan o'tish va sovg'a faollashtirish 409 qaytaradi: eski
      # yo'l `DELETE FROM users` qilardi va CASCADE to'lov yozuvlarini
      # ham olib ketardi. O'chirilgan hisobning izohlari ko'rinmaydi,
      # kutilayotgan sovg'a takliflari bekor qilinadi.
      - name: Hisob o'chirishda qaytarilmas yo'llar yopiqmi
        run: node scripts/test-account-deletion-pr1.mjs

      # HISOBNI BUTUNLAY O'CHIRISH (PURGE) — hosting/api/account-purge.js.
      #
      # 30 kun ichida hech narsa o'chmaydi; dry-run bazaga tegmaydi;
      # purge shaxsiy ma'lumotni o'chiradi, to'lov yozuvlarini (ismsiz)
      # va dalil arxivini saqlaydi; o'chirilgan hisobning ID'lari 90 kun
      # hech kimga berilmaydi; loglarda email/telefon yo'q. Yangi jadval
      # purge siyosatiga kiritilmasa test yiqiladi.
      - name: Hisobni butunlay o'chirish (purge) to'g'rimi
        run: node scripts/test-account-deletion.mjs

      # DALIL ARXIVI 6 OYLIK MUDDATI (account-purge.js runEvidenceRetention):
      # eski nusxa o'chadi, "shubhali" va legal hold qoladi, dry-run tegmaydi.
      - name: Dalil arxivi 6 oydan keyin tozalanadimi
        run: node scripts/test-evidence-retention.mjs

      # TO'LOVLAR — FAQAT PAYME/CLICK HISOBGA (egasining qarori, 2026-09-25).
      #
      # Admin daromadi, Moliya va Excel faqat Payme/Click orqali tushgan
      # va qaytarilmagan pulni hisoblaydi; qo'lda tasdiqlangan, eski,
      # sinov va bot yozuvlari «Boshqa»da (o'chirilmaydi). Click Prepare/
      # Complete marshruti ulanmagan edi — endi imzo, summa va takror
      # so'rovlar bilan tekshiriladi.
      - name: Click to'lovi (Prepare/Complete) ishlaydimi
        run: node scripts/test-click-webhook.mjs

      - name: Admin daromadi faqat Payme/Click bo'yichami
        run: node scripts/test-admin-revenue.mjs

      - name: Moliya bo'limi va Excel hisobot to'g'rimi
        run: node scripts/test-admin-finance.mjs

      # ADMIN BOSHQARUV MARKAZI (2026-09-25): bosh sahifa, Premium
      # obunachilar va foydalanuvchi kartochkasi faqat o'qiydi; tushum faqat
      # Payme/Click. Rollar: xavfli amallar serverda ham rol bo'yicha yopiq.
      - name: Admin boshqaruv markazi to'g'ri sanaydimi
        run: node scripts/test-admin-control.mjs

      - name: Admin amallari rol bo'yicha yopiqmi
        run: node scripts/test-admin-roles.mjs

      # STIKERDAGI UMUMIY QR (/qr-<partiya>) — oynadagi stikerni qayta
      # bosib bo'lmaydi, manzil ishlashdan to'xtasa butun partiya o'ladi.
      - name: Stiker QR yo'naltirishi ishlaydimi
        run: node scripts/test-qr-sticker-redirect.mjs
      - name: Katalog — ommabop tartib va tovar ko'rishlari
        run: node scripts/test-catalog-popular.mjs
      - name: Katalog — "Narxi tez kunda" va ochiq javobda egasining emaili yo'q
        run: node scripts/test-catalog-price-soon.mjs
      - name: Shikoyatlar — kontentning o'zi ko'rinadi
        run: node scripts/test-admin-reports-preview.mjs
      - name: Musiqa kutubxonasi (ruxsat, manzil, o'chirish)
        run: node scripts/test-music-library.mjs
      - name: Tezlik diagnostikasi (server-timing, /tezlik)
        run: node scripts/test-speed-diag.mjs
      - name: Postga musiqa va rasmli reel
        run: node scripts/test-post-music.mjs
      # Profil musiqasi limiti: oddiy 5, Premium 10; faol bepul sinov ham 10.
      - name: Profil musiqasi limiti (sinov = Premium)
        run: node scripts/test-music-limits.mjs
      # Telefon uzunligi faqat O'ZGARGAN raqamga; eski raqam saqlashni bloklamasin.
      - name: Telefon — faqat o'zgargan raqam tekshiriladi
        run: node scripts/test-phone-unchanged.mjs
      # Filtr ishlamay qolsa: fayl o'tadi, lekin admin navbatiga tushadi.
      - name: Tekshirilmagan yuklash — admin navbati
        run: node scripts/test-unchecked-queue.mjs
      # Kalitlar (Reels/video): standart o'chiq, env override, admin toggle.
      - name: Kalitlar (feature flags)
        run: node scripts/test-flags.mjs
      - name: Ro'yxat — email imlosi, domen va telefon uzunligi
        run: node scripts/test-register-contact-check.mjs
      # App Store: /support, /contact, /terms haqiqiy sahifa (NFC ID emas),
      # sahifa nomlari serverda ham band; maxfiylik va shartlar matni.
      - name: Yordam sahifasi, shartlar va band qilingan sahifa nomlari
        run: node scripts/test-support-routes.mjs
      - name: Ro'yxat kodi emailga (OTP, limit, Resend rad etgan manzil — 422, boshqasi 503)
        run: node scripts/test-auth-email-otp.mjs
      - name: Namuna bizneslar (yaratish, belgi, buyurtma, lenta, o'chirish, rasmlar)
        run: node scripts/test-demo-businesses.mjs
      - name: Biznes profil avto-tasdiq (bepul — active, pullik — approved, bayroq)
        run: node scripts/test-company-auto-approve.mjs
      - name: Shikoyatlar — kim kimdan, o'chib ketgan kontent shikoyati yopiladi
        run: node scripts/test-admin-reports-people.mjs
      - name: NFCSTORE yangiliklari seed (bir marta, o'chirilsa qaytmaydi)
        run: node scripts/test-news-seed.mjs

      # PROFIL SAHIFALARINING MAKETI.
      #
      # Ikkala profilda ham (shaxsiy `/:code` va biznes `/c/:id`)
      # "Kontaktni saqlash" pastda YOPISHIB turadi. `position:sticky`
      # esa ota-blokda `overflow:hidden` bo'lsa JIMGINA ishlamay
      # qoladi — hech qanday xato chiqmaydi, tugma shunchaki pastga
      # tushib ketadi. Bu ikki test o'sha maketni qo'riqlaydi.
      - name: Shaxsiy profil maketi
        run: node scripts/test-profile-page.mjs

      # OCHIQ PROFIL TEPASI — ko'rish uchun, boshqaruv uchun emas.
      # Ilgari u yerda TOP nishoni katta blok bo'lib, yonida egaga
      # tegishli "Tahrirlash", "Story qo'shish" va "Boshqa raqamli
      # tashrif qog'ozlaringiz" ro'yxati turardi. Ega amallari endi
      # ⋮ menyusida; mehmon ularni umuman ko'rmaydi.
      - name: Ochiq profil tepasi
        run: node scripts/test-public-profile-top.mjs

      # OCHIQ PROFIL BOSHI — BITTA TIZIM.
      # Tartib qat'iy: [nusxalash] [ulashish] [⋮] [♥]. Yurak ilgari
      # obunachilar soni bilan bir qatorda "statistika" bo'lib
      # turardi. Shu yerda avatar atrofidagi ikki halqa (tashqi =
      # story, ichki = musiqa) ustma-ust tushmasligi va musiqa yo'q
      # bo'lganda halqa UMUMAN chizilmasligi ham qo'riqlanadi.
      - name: Ochiq profil boshi va musiqa halqasi
        run: node scripts/test-profile-header.mjs

      - name: Biznes profil maketi
        run: node scripts/test-quick-profile-screen.mjs

      # MUSIQA YUKLASH — E'LON QILINGAN TUR va FAYLNING O'ZI.
      #
      # SHIKOYAT (2026-09, egasi): "androidda mp3 tanlasam
      # qo'llab-quvvatlamaydi deydi". Sabab: yuklovchi brauzer aytgan
      # `Content-Type` ni faylning sehrli baytlari bilan solishtiradi
      # va farq bo'lsa rad etadi. Android esa mp3 ni `audio/mp3` deb
      # e'lon qiladi, baytlar esa `audio/mpeg` beradi — ikkalasi bir
      # xil fayl, nomi boshqa. FLAC umuman tanilmasdi.
      #
      # Test HAQIQIY sehrli baytlar bilan (ID3, xom mp3 kadri, wav,
      # ogg, flac, m4a, webm) yuklaydi va yot faylni (jpg, pdf)
      # hamon rad etishini tekshiradi — ya'ni taqqoslash yumshatildi,
      # olib tashlanmadi.
      - name: Musiqa yuklash formatlari
        run: node scripts/test-audio-upload.mjs

      # SAHIFA FONI.
      #
      # Bu ishda topilgan haqiqiy xato: `theme.css` dagi bitta izohda
      # yulduzcha va qiyshiq chiziq yonma-yon kelib qolgan va IZOHNI
      # ERTA TUGATGAN. Undan keyingi `body{...}` qoidalari jimgina
      # yo'qolgan — faylda bor, brauzerda yo'q, xato ham chiqmaydi.
      # Test shu holatni va fon qatlamlarining o'rnini qo'riqlaydi.
      - name: Sahifa foni va kontrast
        run: node scripts/test-page-background.mjs

      # STORY VA POST MUSTAQILLIGI.
      #
      # Haqiqiy xato: story yuklash bloki IKKI JOYDA ikki xil yozilgan
      # edi va tuzatish faqat bittasiga tushgan. Ikkinchisida saqlash
      # tugmasi umuman yo'q edi — fayl tanlangan zahoti e'lon
      # qilinardi, yonidagi post blokida esa "Postni saqlash" turardi.
      # Egasi shundan "story postsiz saqlanmaydi" degan xulosaga
      # kelgan. Test nusxa qaytib kelishiga yo'l qo'ymaydi.
      # MARKETPLACE — UNIVERSAL NFC AKTIVATSIYA.
      #
      # Bu qo'riqchi eng avvalo PARALLEL TIZIM YARATILMAGANINI
      # tekshiradi: yangi ID generatori yo'q (auth.js dagi allokator
      # chaqiriladi), alohida tarif/limit jadvali yo'q, alohida profil
      # modeli yo'q. Qolgani — pul va egalik bilan bog'liq: bitta
      # kodni ikki odam egallab ololmasligi (qo'lda aralashtirilgan
      # haqiqiy poyga bilan), yarim qolgan aktivatsiyadan orfan ID
      # qolmasligi va tugmani ikki marta bosish ikkinchi ID
      # yaratmasligi.
      - name: Marketplace aktivatsiyasi
        run: node scripts/test-marketplace.mjs

      # KONTAKTNI SAQLASH (vCard) — NFC KARTANING BUTUN MA'NOSI.
      # Odam tegizadi, sahifani yopadi — raqam uning telefonida
      # QOLADI. Tugma BIZNES profilida umuman yo'q edi, shaxsiy
      # profil esa o'z, buzuq nusxasini ishlatardi (vergul
      # qalqonlanmasdi, CRLF yo'q, `NOTE2:` degan mavjud bo'lmagan
      # maydon). Endi uchalasi ham bitta yozuvchidan.
      - name: Kontaktni saqlash (vCard)
        run: node scripts/test-vcard.mjs

      - name: Story va post mustaqilligi
        run: node scripts/test-story-post-separate.mjs

      # STORY VA POST ARALASHMASLIGI — BACKEND KAFOLATI.
      # Interfeys ajratilgani yetarli emas: story yaratish POST
      # jadvaliga tushmasligi va aksincha. Test haqiqiy worker'ga
      # so'rov yuborib, HAR IKKALA sonni bir vaqtda o'lchaydi va
      # shaxsiy/biznes kontekstlari aralashmasligini ham tekshiradi.
      - name: Story va post ajralishi
        run: node scripts/test-story-post-isolation.mjs

      # IZOH TOZALAGICHI — QO'RIQCHILARNING O'ZINI QO'RIQLAYDI.
      #
      # Tekshiruvlar manbadan izohlarni olib tashlab ishlaydi. Ilgari bu
      # oddiy regex bilan qilinardi va u `accept="image/*"` dagi `/*` ni
      # izoh boshi deb o'qib, 117 KB tirik kodni o'chirib yuborardi —
      # natijada qo'riqchi mavjud kodni "yo'q" deb YOLG'ON yiqilardi.
      # Eng yomoni, manbaga yangi izoh qo'shilishi juftlikni surib,
      # minani har safar boshqa joyga ko'chirardi.
      - name: Izoh tozalagich (qo'riqchilar asosi)
        run: node scripts/test-strip-comments.mjs

      # STORY OQIMI — YARATISHDAN KO'RINISHGACHA.
      #
      # Egasining xabari: "3-4 ta story qo'ysam bittasi ko'rinadi".
      # Test haqiqiy worker va SQLite ustida yuradi: ketma-ket to'rtta
      # story yaratadi va GET to'rttasini ham qaytarishini tekshiradi;
      # muddati o'tganlar chegaraga kirmasligini, 11-chisi 409
      # berishini va har bir xato kodining o'z o'zbekcha xabari
      # borligini ham qo'riqlaydi.
      - name: Story oqimi
        run: node scripts/test-story-flow.mjs

      # ISTORYA QOIDALARI — 79 tekshiruv. Bu to'plam repoda bor edi,
      # lekin deploy qo'riqchisiga ULANMAGAN edi. 24 soatlik muddat,
      # egalik, daraja chegarasi va media manbai shu yerda.
      - name: Istorya qoidalari
        run: node scripts/test-stories.mjs

      # LENTA KATAGI — "son bor, rasm yo'q" holatining oldini oladi.
      #
      # Egasining xabari: VIP001 da "Stories 7" deb turardi, lekin
      # bitta rasm ko'rinib, olti katak qop-qora edi. Sababi: video
      # katagida `poster` yo'q edi (brauzer kadr olmaydi) va `<img>`
      # da `onError` umuman yo'q edi (fayl 404 bo'lsa jim yiqilardi)
      # — ikkalasi ham ekranda BIR XIL qora to'rtburchak berardi.
      # Test har katakda yo chizilgan media, yo NOMLANGAN qatlam
      # (xato / video) borligini qo'riqlaydi.
      # GLOBAL MEDIA QO'RIQCHISI.
      #
      # Productionda VIP001 da to'qqizta storydan yettitasi va o'n
      # sakkizta postning ko'pi qop-qora to'rtburchak edi. Ikkala
      # joyda ham sabab bitta: media ko'rsatadigan har bir joy o'zicha
      # <img>/<video> chizardi va "media kelmasa nima ko'rsatamiz?"
      # degan savolga javob bermasdi. Javob endi bitta joyda —
      # MediaThumb da — va bu test o'shani qo'riqlaydi.
      - name: Media qatlami (global)
        run: node scripts/test-media-guard.mjs

      - name: Lenta katagi
        run: node scripts/test-story-grid.mjs

      # POST RO'YXATI. Mediasiz post `<img src="">` chizib qora slot
      # berardi; endi u MATN kartasi bo'ladi.
      - name: Post ro'yxati
        run: node scripts/test-post-grid.mjs

      # NO-OP AUDITI — "bosiladi, lekin hech narsa qilmaydi".
      # `/api/feed`, `/api/my/nfc-devices` va biznes profilidagi
      # "Workspace" tugmasi aynan shu turdagi xato edi.
      - name: No-op auditi
        run: node scripts/test-noop-audit.mjs

      # AUTH / SESSIYA. Asosiy shart: ANONIM TASHRIFCHI XATO EMAS.
      # `/api/auth/me` 200 + user:null berishi kerak, 401 emas —
      # aks holda frontend buni "sessiya tugadi" deb o'qib, odamni
      # tizimdan chiqarib yuborardi. 403 ham sessiyani tugatmaydi.
      - name: Auth va sessiya
        run: node scripts/test-auth-session.mjs

      # BOG'LANGAN NFC QURILMALARI. Bu yo'l produksiyada 404 berardi
      # ("handler bor" != "so'rov yetib boradi"). Test haqiqiy
      # worker'ga so'rov yuboradi va egalik tekshiruvlarini ham
      # qo'riqlaydi (to'liq chip token hech qachon chiqmaydi).
      - name: NFC qurilmalari
        run: node scripts/test-nfc-devices.mjs

      # TARJIMA QOPLAMI — RATCHET.
      # Lug'atda yo'q matn ekranni buzmaydi (o'zbekcha manba matn
      # qaytadi), lekin rus/ingliz tilidagi odam o'zbekcha jumla
      # ko'radi. Test hammasini bir yo'la tuzatishni talab qilmaydi —
      # faqat SONNING O'SISHINI to'xtatadi.
      - name: Tarjima qoplami
        run: node scripts/test-i18n-coverage.mjs

      # EKRANDA "NaN" CHIQMASIN.
      # Profilda "Faol bo'lgan: NaN kun oldin" ko'rindi: `timeAgo()`
      # kiruvchi qiymatni albatta son deb hisoblardi, amalda esa u
      # ISO satr ham, sekund ham, umuman yo'q ham bo'lishi mumkin.
      - name: Format xavfsizligi
        run: node scripts/test-format-safety.mjs

      # SO'ROV BUDJETI — sayt nega sekin ochilardi.
      # Profil sahifasi 27 ta API so'rovi yuborardi, 10 tasi aynan
      # takror. Endi 14 ta, takror 0. Test o'sha uch sababning
      # (takror effekt, butun katalog, mos kelmaydigan modullar)
      # qaytib kelishini to'xtatadi.
      - name: So'rov budjeti
        run: node scripts/test-request-budget.mjs

      # BIZNES STATISTIKASI — yozishdan grafikka qadar.
      # Bir paytlar "BACKEND REQUIRED" deb belgilangan edi; aslida
      # to'liq ishlaydi. Endi buni test aytadi, taxmin emas.
      - name: Biznes statistikasi
        run: node scripts/test-company-analytics.mjs

      # E2E MARKERI. Produksiya postlarini o'chirish qoidasi —
      # bitta yolg'on ijobiy javob odamning haqiqiy postini
      # o'chirib yuborardi.
      - name: E2E markeri
        run: node scripts/test-e2e-marker.mjs

      - name: Build (vite build + prepare-sites-build)
        run: npm run build

      # CLOUDFLARE_API_TOKEN — FAQAT GitHub Secrets orqali keladi, bu
      # faylda yoki boshqa hech qayerda yozilmagan. Repo sozlamalarida
      # qo'shilishi kerak: Settings → Secrets and variables → Actions →
      # New repository secret → nomi aynan CLOUDFLARE_API_TOKEN.
      # Token yo'q/noto'g'ri bo'lsa `wrangler deploy` xato bilan
      # to'xtaydi va shu step (demak butun workflow) FAIL bo'ladi.
      - name: Cloudflare Workers'ga deploy qilish
        run: npx wrangler@4.129.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # JONLI WORKERDA SOZLAMALAR TO'LIQMI — DEPLOY'DAN KEYIN.
      #
      # Kod ko'chadi, SECRETLAR KO'CHMAYDI: ular skriptga emas,
      # Worker'ga biriktirilgan. 2026-09-15 da domen `nfcstore-api`
      # dan `nfcstore-uz` ga o'tganda aynan shu bo'ldi — 15 ta
      # sozlamadan 6 tasi ko'chdi va emailga kod yuborish bir hafta
      # JIMGINA o'chiq turdi.
      #
      # HOZIRCHA DEPLOY'NI YIQITMAYDI (`continue-on-error`): sakkizta
      # sozlama hali tiklanmagan va har bir deploy'ni qizil qilib
      # turishdan foyda yo'q. Xabar `::error::` bo'lib ko'rinadi.
      # Sozlamalar tiklangach bu qator OLIB TASHLANSIN — shunda
      # kelajakdagi yo'qolish jim o'tmaydi.
      - name: Jonli Workerda sozlamalar to'liqmi
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: 31c4b3d8ece4b65de515debc4552334a
        run: |
          node scripts/test-worker-secrets.mjs || \
            echo "::error title=Jonli Workerda sozlama yetishmayapti::Yuqoridagi ro'yxatga qarang."

