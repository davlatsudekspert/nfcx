name: Mobile check

# Premium UI o'zgarganda APK chiqarmasdan Flutter kodini tekshirish.
#
# ENDI AVTOMATIK HAM (2026-10). Ilgari faqat qo'lda ishga tushardi va
# oqibati shu bo'ldi: `mobile/` `main`da 19 kun davomida o'z
# tekshiruvidan o'tmay turdi — `flutter analyze` xato bilan, 9 ta test
# yiqilgan holda — va Play Market'ga APK aynan shu holatdan chiqdi.
# Hech kim sezmadi, chunki `main`ga push bo'lganda faqat `deploy.yml`
# chopadi va u `mobile/` ga umuman qaramaydi.
#
# Faqat `mobile/` o'zgarganda ishlaydi: sayt PR'lari bu 20 daqiqalik
# ishni kutmaydi.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile-check.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-check.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Bog'liqliklar
        run: flutter pub get --enforce-lockfile

      - name: Kod tekshiruvi
        run: flutter analyze --no-fatal-infos

      - name: Testlar
        run: flutter test
