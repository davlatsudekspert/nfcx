# VAQTINCHA — EMULYATOR QULASHI SABABINI AJRATISH (E2E #47-#51).
#
# Har variant O'Z runner'ida, YANGI emulyatorda — ketma-ketlik ta'siri
# yo'q. Sinov hisobi, sirlar va tarmoqdagi backend ISHLATILMAYDI
# (layout to'plami soxta ma'lumot bilan, 127.0.0.1:9). Sabab
# aniqlangach bu fayl va tool/crash_probe.sh o'chiriladi.
name: NFCSTORE Mobile crash probe (vaqtincha)

on:
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/nova-crash-probe.yml'
      - 'tool/crash_probe.sh'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1-probe: swiftshader_indirect da 5/5 qulagan (b34bbbd ham).
          # 2-probe: emulyator GPU yo'li va renderer bo'yicha.
          - { ref: HEAD, mode: layout, gpu: swangle_indirect }
          - { ref: HEAD, mode: full, gpu: swangle_indirect }
          - { ref: HEAD, mode: layout, gpu: guest }
          - { ref: HEAD, mode: skia, gpu: swiftshader_indirect }
          - { ref: HEAD, mode: noshot, gpu: swiftshader_indirect }
    name: probe ${{ matrix.ref }} ${{ matrix.mode }} ${{ matrix.gpu }}
    defaults:
      run:
        working-directory: mobile_nova
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable
          cache: true

      - name: Bog'liqliklar
        run: flutter pub get --enforce-lockfile

      - name: KVM ni yoqish
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD keshi (faqat o'qish)
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64

      - name: Probe
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PROBE_REF: ${{ matrix.ref }}
          PROBE_MODE: ${{ matrix.mode }}
          PROBE_GPU: ${{ matrix.gpu }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu ${{ matrix.gpu }} -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          working-directory: mobile_nova
          script: bash ../tool/crash_probe.sh
