# ANDROID APK QURISH
#
# NIMA UCHUN CI DA: Android SDK `dl.google.com` dan keladi va u ba'zi
# tarmoqlarda yopiq bo'ladi. GitHub runner'ida SDK ALLAQACHON
# o'rnatilgan, shuning uchun APK shu yerda qurilib, tayyor fayl
# sifatida yuklab olinadi.
#
# QANDAY OLINADI: Actions -> "Android APK" -> oxirgi ishga tushish ->
# pastdagi "Artifacts" bo'limidan `nfcstore-apk` ni yuklab olasiz.
#
# IMZOLASH: sozlangan bo'lsa haqiqiy kalit bilan, bo'lmasa debug kaliti
# bilan imzolanadi (o'rnatiladi va ishlaydi, lekin Play Store'ga
# yaramaydi — quyidagi izohga qarang).
name: Android APK

on:
  # Qo'lda ishga tushirish — Actions sahifasidagi "Run workflow" tugmasi.
  workflow_dispatch:
  push:
    branches: [main]
    # Faqat ilova o'zgarganda. Saytdagi o'zgarish uchun APK qayta
    # qurilmaydi — bu bekorga 5-6 daqiqa vaqt olardi.
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

# `write` — APK ni Release'ga biriktirish uchun. Kod o'zgartirilmaydi:
# faqat `apk-latest` tegiga fayl qo'yiladi.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Versiya QAT'IY belgilangan: ilova aynan shu versiyada yozilgan
      # va sinovdan o'tgan. "latest" qo'yilsa, Flutter yangilanishi
      # qurilishni kutilmaganda buzishi mumkin.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      # `--enforce-lockfile` — RELIZ QAYTARILUVCHI BO'LSIN.
      # Oddiy `pub get` cheklovlar ichida yangi versiyani olib
      # kelishi mumkin, ya'ni bir xil commit'dan ikki xil APK
      # chiqardi va xatoni takrorlash imkonsiz bo'lardi.
      - name: Bog'liqliklar
        run: flutter pub get --enforce-lockfile

      # Kod tekshiruvi va testlar APK dan OLDIN: buzuq kodni paketlab
      # qo'yishdan ko'ra, qurilishni shu yerda to'xtatish ma'qul.
      - name: Kod tekshiruvi
        run: flutter analyze --no-fatal-infos

      - name: Testlar
        run: flutter test

      # GOLDEN TEST YIQILSA — KADRNI KO'RSATISH.
      #
      # Vizual testning butun ma'nosi ko'rishda. CI da esa faqat
      # "pixels differ" degan qator qolardi va odam farqni ko'rmay,
      # kadrni ko'r-ko'rona yangilashga majbur bo'lardi. Endi
      # `failures/` papkasi (kutilgan / chiqqan / farq) artifact
      # bo'lib yuklanadi.
      - name: Yiqilgan kadrlar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-farqlari
          path: mobile/test/audit/failures/
          if-no-files-found: ignore
          retention-days: 7

      # HAQIQIY IMZO — faqat sozlangan bo'lsa.
      #
      # Uchta secret kerak (Settings -> Secrets and variables ->
      # Actions): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS. Kalitni shunday yasaysiz:
      #
      #   keytool -genkey -v -keystore nfcstore.jks -keyalg RSA \
      #     -keysize 2048 -validity 10000 -alias nfcstore
      #   base64 -w0 nfcstore.jks > nfcstore.jks.b64
      #
      # `nfcstore.jks` faylini YO'QOTMANG va repozitoriyaga QO'YMANG:
      # Play Store yangilanishlari faqat shu kalit bilan imzolanadi.
      # TEKSHIRUV SKRIPT ICHIDA, `if:` da emas: GitHub Actions `secrets`
      # kontekstini qadam darajasidagi `if:` da ko'rmaydi ("Unrecognized
      # named-value: 'secrets'"). Shuning uchun qadam har doim ishlaydi
      # va kalit bor-yo'qligini o'zi hal qiladi.
      - name: Imzo kalitini tayyorlash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "Imzo kaliti sozlanmagan — debug kaliti ishlatiladi."
            exit 0
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 bor, lekin PASSWORD yoki ALIAS yo'q."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > android/app/nfcstore.jks
          cat > android/key.properties <<PROPS
          storeFile=nfcstore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          PROPS
          echo "HAQIQIY KALIT bilan imzolanadi."

      # VERSIYA RAQAMI — HAR QURILISHDA KATTAROQ.
      #
      # `pubspec.yaml` da `1.0.0+1` yozilgan va u O'ZGARMAYDI:
      # `+1` ni har safar qo'lda oshirish unutiladi. Play Store esa
      # bir xil `versionCode` li ikkinchi faylni QABUL QILMAYDI va
      # telefon ham "yangilanish" deb ko'rmaydi. Shuning uchun raqam
      # CI dan keladi: `github.run_number` hech qachon kamaymaydi.
      #
      # Ko'rinadigan versiya (`versionName`) pubspec'dan olinadi —
      # uni odam o'zi, ma'no bilan qo'yadi.
      - name: Versiya raqami
        id: ver
        env:
          RUN: ${{ github.run_number }}
        run: |
          NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$RUN" >> "$GITHUB_OUTPUT"
          echo "Versiya: $NAME ($RUN)"

      - name: APK qurish
        run: |
          flutter build apk --release --split-per-abi \
            --build-name=${{ steps.ver.outputs.name }} \
            --build-number=${{ steps.ver.outputs.code }}

      # Universal APK ham: qaysi protsessor ekanini bilmasdan
      # o'rnatish uchun (fayl kattaroq, lekin har qurilmada ishlaydi).
      - name: Universal APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.ver.outputs.name }} \
            --build-number=${{ steps.ver.outputs.code }}

      # AAB — PLAY STORE UCHUN YAGONA QABUL QILINADIGAN FORMAT.
      #
      # 2021-yildan beri Play Store yangi ilovadan faqat `.aab`
      # oladi. APK esa to'g'ridan-to'g'ri tarqatish uchun qoladi
      # (sayt, Telegram, sinov). Shuning uchun IKKALASI ham
      # quriladi — reliz kuni "aa, AAB yo'q ekan" degan holat
      # bo'lmasin.
      - name: AAB qurish (Play Store)
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.ver.outputs.name }} \
            --build-number=${{ steps.ver.outputs.code }}

      # IMZONI HAQIQATAN TEKSHIRISH.
      #
      # "key.properties bor" degani APK o'sha kalit bilan imzolangan
      # degani EMAS: Gradle sozlamasi noto'g'ri bo'lsa, fayl jimgina
      # debug kaliti bilan chiqib ketardi va buni faqat Play Store
      # rad etganda bilardik. Shuning uchun tayyor fayl `apksigner`
      # bilan OCHIB ko'riladi.
      #
      # SHA-256 BARMOQ IZI SHU YERDA CHIQADI — App Links aynan shuni
      # talab qiladi (`ANDROID_APP_FINGERPRINTS`). Uni qo'lda
      # `keytool` bilan qidirib yurish shart emas.
      - name: Imzoni tekshirish
        id: sign
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner topilmadi — imzo tekshirilmadi."
            exit 0
          fi
          "$APKSIGNER" verify --print-certs "$APK" > certs.txt || {
            echo "::error::APK imzosi yaroqsiz."
            exit 1
          }
          # Chiqishdagi ikki nuqtali bo'lmagan olti burchakli qator
          # assetlinks kutadigan ko'rinishga o'tkaziladi:
          # AA:BB:CC:... (katta harf, ikki nuqta bilan).
          RAW=$(grep -i 'SHA-256 digest' certs.txt | head -1 | awk '{print $NF}')
          FP=$(echo "$RAW" | tr -d ':' | tr 'a-z' 'A-Z' | sed 's/../&:/g; s/:$//')
          SUBJECT=$(grep -i 'Signer #1 certificate DN' certs.txt | head -1)
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"
          echo "## Imzo" >> "$GITHUB_STEP_SUMMARY"
          echo "$SUBJECT" >> "$GITHUB_STEP_SUMMARY"
          if [ -f android/key.properties ]; then
            echo "release=1" >> "$GITHUB_OUTPUT"
            echo "HAQIQIY kalit — Play Store uchun yaroqli." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release=0" >> "$GITHUB_OUTPUT"
            echo "DIQQAT: DEBUG kaliti. Play Store'ga yaramaydi va har" >> "$GITHUB_STEP_SUMMARY"
            echo "qurilishda kalit yangi bo'ladi (eski versiya ustiga" >> "$GITHUB_STEP_SUMMARY"
            echo "o'rnatilmaydi — avval o'chiring)." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "App Links uchun barmoq izi (ANDROID_APP_FINGERPRINTS):" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$FP\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Barmoq izi: $FP"

      # RUXSATLAR AUDITI — HAR QURILISHDA.
      #
      # Manifestda ikkita ruxsat yozilgan, lekin TAYYOR APK dagi
      # ro'yxat undan uzunroq bo'lishi mumkin: har bir plagin o'z
      # manifestini qo'shadi. Yangi kutubxona jimgina kamera yoki
      # joylashuvni so'rab qo'ysa, buni do'kon sharhida yoki
      # foydalanuvchi shikoyatida bilib olish juda kech bo'lardi.
      #
      # RO'YXAT EMAS, XAVFLILARI to'xtatadi: har bir yangi zararsiz
      # ruxsat qurilishni yiqitsa, ogohlantirish qiymatini yo'qotardi.
      - name: Ruxsatlar auditi
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ -z "$AAPT" ]; then
            echo "::warning::aapt2 topilmadi — ruxsatlar tekshirilmadi."
            exit 0
          fi
          "$AAPT" dump permissions "$APK" | grep -o "android.permission.[A-Z_]*" | sort -u > perms.txt || true
          echo "## Ruxsatlar" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/- /' perms.txt >> "$GITHUB_STEP_SUMMARY"
          cat perms.txt
          # Shaxsiy ma'lumotga tegadigan ruxsatlar. NFCSTORE ularning
          # BIRORTASINI ishlatmaydi: rasm `image_picker` ning tizim
          # tanlagichi orqali keladi (ruxsat kerak emas).
          BAD='ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|RECORD_AUDIO|READ_CONTACTS|WRITE_CONTACTS|READ_SMS|SEND_SMS|READ_PHONE_STATE|READ_CALL_LOG|BODY_SENSORS|ACTIVITY_RECOGNITION|READ_CALENDAR'
          if grep -Eq "android.permission.($BAD)" perms.txt; then
            echo "::error::Kutilmagan xavfli ruxsat qo'shilgan — quyidagi ro'yxatga qarang."
            grep -E "android.permission.($BAD)" perms.txt
            exit 1
          fi
          echo "Xavfli ruxsat yo'q."

      - name: Qurilgan fayllar
        run: |
          ls -la build/app/outputs/flutter-apk/ build/app/outputs/bundle/release/
          echo "--- SHA-256 ---"
          sha256sum build/app/outputs/flutter-apk/*.apk build/app/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: nfcstore-apk
          path: |
            mobile/build/app/outputs/flutter-apk/*.apk
            mobile/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      # DOIMIY YUKLAB OLISH HAVOLASI.
      #
      # Artifact uchun GitHub'ga kirish, Actions'ni ochish, ZIP ni
      # yuklab, ochish kerak — telefondan bu og'ir. Release'dagi APK
      # to'g'ridan-to'g'ri bosib o'rnatiladi va havola O'ZGARMAYDI:
      # har qurilishda shu yerdagi fayl yangilanadi.
      #
      # `apk-latest` — oxirgi qurilish. Bu RELIZ EMAS (prerelease),
      # ya'ni versiya tarixini ifloslantirmaydi.
      - name: Release'ga biriktirish
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.ver.outputs.name }}+${{ steps.ver.outputs.code }}
          FINGERPRINT: ${{ steps.sign.outputs.fingerprint }}
          RELEASE_KEY: ${{ steps.sign.outputs.release }}
        run: |
          OUT=build/app/outputs
          # AAB boshqa papkada yotadi — bitta joyga yig'ib yuboriladi.
          cp "$OUT"/bundle/release/*.aab "$OUT"/flutter-apk/ || true
          cd "$OUT/flutter-apk"
          # Izohni FAYLGA yozamiz: ko'p qatorli matnni to'g'ridan
          # to'g'ri buyruqqa qo'yish YAML va qobiqda chalkashtiradi.
          cat > notes.md <<'NOTES'
          Avtomatik qurilgan fayllar. Har yangi qurilishda shu yerdagilar yangilanadi.

          - `app-release.apk` — universal, har qanday telefonga.
          - `app-arm64-v8a-release.apk` — zamonaviy telefonlar, kichikroq fayl.
          - `app-release.aab` — **faqat Play Store uchun**. Telefonga
            to'g'ridan-to'g'ri o'rnatilmaydi.
          NOTES
          echo "" >> notes.md
          echo "**Versiya:** $VERSION" >> notes.md
          if [ "$RELEASE_KEY" = "1" ]; then
            echo "**Imzo:** haqiqiy kalit — Play Store uchun yaroqli." >> notes.md
          else
            echo "**Imzo:** DEBUG kaliti. O'rnatiladi va ishlaydi, lekin Play" >> notes.md
            echo "Store'ga yaramaydi va yangi versiyadan oldin eskisini o'chirish" >> notes.md
            echo "kerak (har qurilishda kalit yangi bo'ladi)." >> notes.md
          fi
          if [ -n "$FINGERPRINT" ]; then
            echo "" >> notes.md
            echo "**Sertifikat SHA-256** (App Links uchun \`ANDROID_APP_FINGERPRINTS\`):" >> notes.md
            echo "\`$FINGERPRINT\`" >> notes.md
          fi
          echo "" >> notes.md
          echo "Commit: $COMMIT" >> notes.md

          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest ./*.apk ./*.aab --clobber
            gh release edit apk-latest --notes-file notes.md
          else
            gh release create apk-latest ./*.apk ./*.aab \
              --prerelease \
              --title "NFCSTORE — oxirgi qurilish" \
              --notes-file notes.md
          fi
          echo "Havola: https://github.com/$REPO/releases/tag/apk-latest"
