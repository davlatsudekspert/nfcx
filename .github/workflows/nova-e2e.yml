# NFCSTORE NOVA — HAQIQIY HISOB E2E (emulyatorda)
#
# Bu workflow HAQIQIY `nfcstore.uz` backendiga, HAQIQIY hisob bilan
# ulanadi. Shuning uchun u:
#
#   * FAQAT qo'lda ishga tushiriladi (`workflow_dispatch`) — har
#     push'da emas;
#   * bir vaqtda BITTA bo'ladi (`concurrency`) — ikki ish parallel
#     kirsa, backendning kirish chegarasi yeb qo'yilardi;
#   * HECH QANDAY APK/AAB yuklamaydi.
#
# ## NIMA UCHUN APK YUKLANMAYDI
#
# `--dart-define` qiymatlari qurilgan ikkilik fayl ICHIGA tushadi.
# Demak sinov APK'si artefakt bo'lib chiqsa, uni yuklab olgan har
# kim paroldan nusxa ko'chira olardi. Reliz APK'si alohida
# `nova-apk.yml` da, sinov hisobisiz quriladi.
#
# ## KIRISH CHEGARASI — MUHIM
#
# `hosting/worker.js` kirishni hisob bo'yicha 15 daqiqada 5 marta
# cheklaydi va hisoblagich MUVAFFAQIYATLI kirishda ham oshadi
# (`rateLimitD1` parol tekshirilishidan OLDIN chaqiriladi). Bu ish
# 4 ta urinish sarflaydi: backend to'plami 2 ta (kirish + noto'g'ri
# parol), UI to'plami 1 ta, oqimlar to'plami 1 ta. Bittasi zaxira
# bo'lib qoladi.
#
# Ya'ni: ketma-ket ikki marta ishga tushirmang. Ikkinchisi 429 oladi
# va hisob EGASI ham 15 daqiqa kira olmaydi.
name: NFCSTORE Mobile E2E (real account)

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Bu ishga tushirish nima uchun (hisobotda ko'rinadi)"
        required: false
        default: "real account E2E"

  # `workflow_dispatch` ni API orqali chaqirish uchun fayl STANDART
  # branchda turishi kerak — aks holda GitHub 404 beradi. Nova hali
  # `main` ga qo'shilmagan, shuning uchun sinov branchida ishga
  # tushirishning yagona yo'li — push.
  #
  # Yo'l ATAYLAB tor: FAQAT E2E fayllari o'zgarganda. `lib/` ga
  # tegilganda bu ish ishga tushmaydi, ya'ni oddiy tahrirlar haqiqiy
  # hisobga bormaydi va kirish chegarasi yeyilmaydi.
  push:
    branches: ['claude/**']
    paths:
      - 'mobile_nova/integration_test/**'
      - '.github/workflows/nova-e2e.yml'
      - 'tool/e2e_summary.py'
      - 'tool/e2e_device.sh'

concurrency:
  group: nova-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Qurilma bosqichi <= 28 daq + haqiqiy hisob <= 48 daq (to'plam
    # chegaralari 16+10+16) + tayyorgarlik. Har emulyator qadamining
    # O'Z chegarasi bor (quyida) — biri osilsa, keyingisi baribir ishlaydi.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile_nova

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable
          cache: true

      - name: Bog'liqliklar
        run: flutter pub get --enforce-lockfile

      # ARZON QO'RIQCHI — EMULYATORDAN OLDIN.
      #
      # `test/e2e_safety_test.dart` E2E manbasini o'qib, buzg'unchi
      # metod (NFC o'chirish, sovg'a qabul qilish, to'lov boshlash)
      # chaqirilmaganini tekshiradi va parol kodga yozilmaganiga
      # ishonch hosil qiladi. Bu bir soniya turadi va haqiqiy hisobga
      # tegmasdan oldin to'xtatadi.
      - name: Xavfsizlik qo'riqchisi va oddiy testlar
        run: flutter test

      - name: Kod tekshiruvi
        run: flutter analyze

      # Sinov hisobi sozlanmagan bo'lsa, emulyatorni behuda
      # ko'tarmaymiz.
      #
      # SIR NOMLARI — IKKITA MANBA, BITTA MA'NO.
      #
      # Repozitoriyada `NFC_LOGIN_EMAIL` / `NFC_LOGIN_PASSWORD`
      # allaqachon bor. Bu workflow esa `NOVA_TEST_*` nomlari bilan
      # yozilgan edi. Sir NOMINI o'zgartirish o'rniga ikkalasi ham
      # qabul qilinadi: mavjudi ishlatiladi.
      #
      # `||` GitHub ifodasi — bo'sh (mavjud bo'lmagan) sir "yolg'on"
      # sanaladi va ikkinchisiga o'tadi. Qiymat HECH QACHON chop
      # etilmaydi; pastdagi tekshiruv faqat BO'SH-EMASLIGINI
      # ko'radi.
      - name: Sinov hisobi bormi
        env:
          LOGIN: ${{ secrets.NFC_LOGIN_EMAIL || secrets.NOVA_TEST_LOGIN }}
          PASSWORD: ${{ secrets.NFC_LOGIN_PASSWORD || secrets.NOVA_TEST_PASSWORD }}
          LOGIN2: ${{ secrets.NOVA_TEST_LOGIN_2 }}
          PASSWORD2: ${{ secrets.NOVA_TEST_PASSWORD_2 }}
        run: |
          if [ -z "$LOGIN" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Sinov hisobi siri yo'q: NFC_LOGIN_EMAIL / NFC_LOGIN_PASSWORD (yoki eski NOVA_TEST_LOGIN / NOVA_TEST_PASSWORD)."
            echo "Settings -> Secrets and variables -> Actions da qo'shing."
            exit 1
          fi
          # IKKINCHI HISOB — MAJBURIY EMAS, LEKIN BAHOSI BOR.
          #
          # Follow / unfollow / bildirishnoma oqimini BITTA hisob
          # bilan sinab bo'lmaydi: server o'ziga obuna bo'lishni
          # ataylab taqiqlaydi (409 CANNOT_FOLLOW_SELF) va bu
          # TO'G'RI qoida — uni test uchun yumshatish mumkin emas.
          # Shuning uchun ikkinchi hisob bo'lmasa o'sha qatorlar
          # CONFIG REQUIRED bo'lib qoladi, ish esa qizarmaydi.
          if [ -z "$LOGIN2" ] || [ -z "$PASSWORD2" ]; then
            echo "::warning::Ikkinchi sinov hisobi yo'q (NOVA_TEST_LOGIN_2 / NOVA_TEST_PASSWORD_2) — follow/bildirishnoma qatorlari CONFIG REQUIRED bo'ladi."
          fi
          # Qiymat ham, uzunlik ham chop etilMAYDI: uzunlik ham
          # parol haqidagi ma'lumot. Qisqa parol haqida ogohlantirish
          # Dart tomonda, `credWarning` orqali chiqadi va u qiymatni
          # ko'rsatmaydi.
          echo "Sinov hisobi sozlangan."

      # Emulyator KVM'siz sudralib yuradi va ko'pincha muddatdan oshadi.
      - name: KVM ni yoqish
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD keshi
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64

      # Kesh bo'sh bo'lsa AVD ni bir marta yaratib, uni keshlaymiz:
      # keyingi ishlar 3-4 daqiqa tejaydi.
      #
      # EMULYATOR GPU: `swangle_indirect` (ANGLE -> SwiftShader Vulkan).
      #
      # `swiftshader_indirect` (eski host GLES tarjimoni) E2E #47-#51 va
      # alohida probe'larda (nova-crash-probe, 2026-09-23) emulyatorni
      # o'ldirdi: qemu jarayoni ekranlar o'rtasida yo'qoladi, logda
      # gfxstream `glWaitSync error 0x501`. Bu ILOVA KODIDAN EMAS: #46 da
      # o'tgan b34bbbd kodi ham yangi emulyatorda 390 dp da qulagan;
      # xotira yetarli edi (avail 3.5-11 GB, swap 0, OOM yo'q). Xuddi shu
      # HEAD `swangle_indirect` da release APK + 360/390/430 layout —
      # 27/27 ekran PASS, Impeller bilan. Ilova, renderer va test
      # o'zgarmadi — faqat emulyatorning host GPU yo'li.
      - name: AVD ni tayyorlash (faqat kesh bo'sh bo'lsa)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD tayyor"

      # ── HAQIQIY QURILMA: RELEASE APK + LAYOUT, 3 O'LCHAM ────────
      #
      # Egasining talabi: yakuniy tekshiruv haqiqiy Android release
      # APK'da, 360x800 / 390x844 / 430x932 da. Bu bosqich HISOBGA
      # KIRMAYDI va production'ga yozmaydi: release APK faqat ochiladi
      # (splash/kirish), layout to'plami esa soxta ma'lumot bilan
      # ishlaydi. Natija va qurilmada olingan suratlar — artefakt.
      - name: Qurilma — release APK va layout (360/390/430)
        id: device
        continue-on-error: true
        # FAIL-FAST: odatda 15-17 daq (release build ~7.5 + 3 o'lcham).
        # Osilsa shu qadam to'xtaydi, real hisobli bosqich baribir yuradi.
        timeout-minutes: 28
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          working-directory: mobile_nova
          script: bash ../tool/e2e_device.sh

      - name: Qurilma suratlari va logi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-device-shots
          path: |
            mobile_nova/device-shots/
            mobile_nova/e2e-device.log
          if-no-files-found: warn
          retention-days: 14


      # QOLIB KETGAN EMULYATORNI O'CHIRISH (E2E #58).
      #
      # Qurilma qadami timeout bilan to'xtatilsa, action emulyatorni
      # o'chirmaydi. Keyingi qadam yangi emulyator ocha olmasdi
      # ("multiple emulators with the same AVD"), adb esa ESKI, osilgan
      # emulyatorga ulanib qolardi — natijada UI va OQIMLAR to'plamlari
      # birinchi testdayoq osilib, butun ish qizil bo'lardi.
      - name: Qolib ketgan emulyatorni o'chirish
        if: always()
        run: |
          adb devices || true
          for s in $(adb devices | awk '/^emulator-/{print $1}'); do
            adb -s "$s" emu kill || true
          done
          sleep 5
          pkill -9 -f qemu-system || true
          pkill -9 -f crashpad_handler || true
          rm -f "$HOME/.android/avd/"*.avd/*.lock || true
          adb kill-server || true
          echo "Emulyator jarayonlari: $(pgrep -fc qemu-system || true)"

      # ── ASOSIY BOSQICH ────────────────────────────────────────
      #
      # `script:` `bash` ORQALI chaqiriladi. Action bu blokni
      # `/usr/bin/sh` (dash) bilan bajaradi, shuning uchun bu yerda
      # bitta qator turadi va butun mantiq `tool/e2e_run.sh` ichida.
      # Birinchi urinish aynan shu sababdan yiqilgan edi:
      # `set: Illegal option -o pipefail`.
      #
      # `continue-on-error` ataylab: FAIL bo'lsa ham hisobot CHOP
      # ETILISHI kerak. Ishning qizil/yashilligi keyingi bosqichlarda,
      # HAQIQIY loglarga qarab hal qilinadi.
      - name: E2E — haqiqiy hisob
        id: e2e
        continue-on-error: true
        # FAIL-FAST: uch to'plam chegarasi 16+10+16 daq + build/boot.
        timeout-minutes: 48
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # Mavjud `NFC_LOGIN_*` birinchi; eski nom zaxira (yuqoridagi
          # "Sinov hisobi bormi" qadamidagi mantiq bilan bir xil).
          NOVA_TEST_LOGIN: ${{ secrets.NFC_LOGIN_EMAIL || secrets.NOVA_TEST_LOGIN }}
          NOVA_TEST_PASSWORD: ${{ secrets.NFC_LOGIN_PASSWORD || secrets.NOVA_TEST_PASSWORD }}
          NOVA_TEST_LOGIN_2: ${{ secrets.NOVA_TEST_LOGIN_2 }}
          NOVA_TEST_PASSWORD_2: ${{ secrets.NOVA_TEST_PASSWORD_2 }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          working-directory: mobile_nova
          script: bash ../tool/e2e_run.sh

      # ── SINOV HAQIQATAN ISHLADIMI ─────────────────────────────
      #
      # Bu bosqich ataylab hisobotdan OLDIN turadi. Birinchi urinishda
      # emulyator ko'tarilgan, lekin birorta `flutter test` ishga
      # tushmagan edi — va buni faqat log fayllari yo'qligidan bilish
      # mumkin edi. Endi bu holat jimgina o'tib ketmaydi.
      - name: Sinov haqiqatan ishladimi
        if: always()
        run: |
          missing=0
          for f in e2e-backend.log e2e-ui.log e2e-flows.log; do
            if [ ! -s "$f" ]; then
              echo "::error::$f yaratilmadi yoki bo'sh — to'plam ishga tushmagan."
              missing=1
            else
              echo "$f: $(wc -l < "$f") qator"
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "SINOV UMUMAN ISHLAMADI — hisobot ma'nosiz." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Matritsa bloki bo'lmasa, sinov hisobot yozishdan oldin
          # to'xtagan degani.
          if ! grep -q "<<<E2E_MATRIX_JSON>>>" e2e-backend.log; then
            echo "::error::Backend logida matritsa bloki yo'q."
            exit 1
          fi
          echo "Ikkala to'plam ham ishladi va matritsa yozildi."

      # ── HISOBOT ───────────────────────────────────────────────
      # Hisobot HAR DOIM chiqadi va bu bosqich HECH QACHON ishni
      # yiqitmaydi.
      #
      # Ilgari skript FAIL qatori bo'lsa 1 bilan tugardi va
      # `bash -e` shu yerda to'xtardi — natijada jadval faqat ish
      # sahifasiga tushib, LOGDA umuman ko'rinmasdi. Qizil/yashilni
      # oxirgi bosqich hal qiladi, bu esa faqat ko'rsatadi.
      - name: PASS/FAIL matritsasi
        if: always()
        run: |
          python3 ../tool/e2e_summary.py \
              e2e-backend.log e2e-ui.log e2e-flows.log \
            | tee -a "$GITHUB_STEP_SUMMARY" || true

      # Loglar — maxfiy qiymatlar `redact` dan o'tgan, GitHub esa
      # secret'ni qo'shimcha ravishda `***` qiladi. APK YO'Q.
      - name: E2E loglari
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-e2e-logs
          path: |
            mobile_nova/e2e-backend.log
            mobile_nova/e2e-ui.log
            mobile_nova/e2e-flows.log
          if-no-files-found: warn
          retention-days: 14

      - name: Qurilma bahosi
        if: always()
        run: |
          dcode=$(cat e2e-device-exit-code 2>/dev/null || echo 1)
          grep -E "^(DEVICE|LAYOUT)\\|" e2e-device.log 2>/dev/null | sort -u | tee -a "$GITHUB_STEP_SUMMARY" || true
          if [ "$dcode" != "0" ]; then
            echo "::error::Qurilma bosqichi yiqildi (release APK yoki layout)."
            exit 1
          fi

      - name: Yakuniy baho
        if: always()
        run: |
          code=$(cat e2e-exit-code 2>/dev/null || echo 1)
          if [ "$code" != "0" ]; then
            echo "::error::E2E da FAIL qatorlari bor — yuqoridagi matritsaga qarang."
            exit 1
          fi
          echo "E2E to'liq o'tdi."
