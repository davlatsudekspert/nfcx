name: Android Standalone Test APK

# Minimal, self-contained CI job: build a STANDALONE, Metro-free test APK
# from android-app/ on a real Ubuntu + JDK 17 + Android SDK runner, since
# the local sandbox this app was developed in has none of those (see
# android/docs/07..16 phase reports).
#
# Why "release" build type and not "debug": React Native's Gradle plugin
# only embeds the JS bundle (index.android.bundle + assets) into non-debug
# variants by default — a plain `assembleDebug` APK expects a live Metro
# dev server and crashes standalone with "Unable to load script". The
# `release` build type always bundles JS, and since this repo has no
# keystore.properties at the project root (no real keystore was generated,
# per the project's own non-negotiables), plugins/withReleaseSigning.js
# no-ops and the generated build.gradle falls back to Android's own
# automatic debug-keystore signing for the release build type too — so
# this is an internal-test-only APK, not a Play-Store-signed artifact. No
# release keystore, no Play Store step, no app code changes.
on:
  push:
    branches:
      - claude/nfcstore-android-app-ku07dm
    paths:
      - "android-app/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch: {}

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-standalone-test-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    outputs:
      apk_path: ${{ steps.locate-apk.outputs.apk_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      # Uses the committed lockfile exactly (no dependency version bumps) —
      # android-app/.npmrc already sets legacy-peer-deps=true.
      - name: Install dependencies (npm ci, lockfile-exact)
        run: npm ci

      - name: Expo prebuild (Android)
        run: npx expo prebuild -p android --no-install

      # node_modules/@react-native-cookies/cookies/android/build.gradle (a
      # deprecated upstream package, already flagged as such in
      # src/native/cookies.ts) calls the removed `jcenter()` DSL method,
      # which no longer exists on modern Gradle — "Could not find method
      # jcenter()". This does not touch android-app/ code or dependency
      # versions; it's a build-time-only Gradle init script that makes
      # `jcenter()` resolve to `mavenCentral()` for every subproject.
      - name: Workaround removed Gradle jcenter() DSL (legacy dependency build.gradle)
        run: |
          cat > /tmp/jcenter-compat-init.gradle <<'EOF'
          allprojects {
              repositories.metaClass.jcenter = { -> delegate.mavenCentral() }
          }
          EOF

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android-app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # release build type: bundles JS into the APK by default and (with no
      # keystore.properties present) falls back to Android's own automatic
      # debug-keystore signing — see the top-of-file comment.
      - name: Build standalone test APK (release build type, debug-keystore signing)
        working-directory: android-app/android
        run: ./gradlew assembleRelease --stacktrace --init-script /tmp/jcenter-compat-init.gradle

      - name: Locate APK
        id: locate-apk
        working-directory: android-app/android
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_PATH"

      - name: Confirm the APK is actually signed (not left unsigned)
        working-directory: android-app/android
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n1)
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK_PATH" | tee /tmp/apksigner-out.txt
          # Newer apksigner prints "V2 Signer: certificate DN: ...", older
          # ones "Signer #1 certificate DN: ..." — match the common part.
          grep -q "certificate DN" /tmp/apksigner-out.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfcstore-standalone-test-apk
          path: android-app/android/${{ env.APK_PATH }}
          if-no-files-found: error

  smoke-test:
    needs: build-standalone-test-apk
    runs-on: ubuntu-latest
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: nfcstore-standalone-test-apk
          path: apk

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted Ubuntu runners have nested virtualization (/dev/kvm)
      # available, so this boots a real emulator image in CI — no physical
      # device or Metro server involved, exactly what "standalone" means.
      # api-level 30 (vs. 33 originally) boots noticeably faster/more
      # reliably in this kind of headless CI environment.
      - name: Boot emulator, install APK, confirm it launches without Metro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            APK_FILE=$(find apk -name "*.apk" | head -n1)
            echo "Installing $APK_FILE"
            adb install -r "$APK_FILE"
            adb logcat -c
            adb shell monkey -p uz.nfcstore.app -c android.intent.category.LAUNCHER 1
            sleep 15
            adb logcat -d > /tmp/logcat.txt
            echo "---- last 200 lines of logcat ----"
            tail -n 200 /tmp/logcat.txt
            if grep -qi "Unable to load script" /tmp/logcat.txt; then
              echo "SMOKE TEST FAILED: JS bundle is not embedded (Metro-dependent crash reproduced)."
              exit 1
            fi
            if grep -q "FATAL EXCEPTION" /tmp/logcat.txt; then
              echo "SMOKE TEST FAILED: app crashed on launch (see logcat above)."
              exit 1
            fi
            RUNNING=$(adb shell "pidof uz.nfcstore.app" || true)
            if [ -z "$RUNNING" ]; then
              echo "SMOKE TEST FAILED: process is not running after launch attempt."
              exit 1
            fi
            echo "SMOKE TEST PASSED: app launched and is running, no JS-bundle-load crash, no Metro connection used."
