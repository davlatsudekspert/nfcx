name: Android Debug APK

# Minimal, self-contained CI job: build a DEBUG APK from android-app/ on a
# real Ubuntu + JDK 17 + Android SDK runner, since the local sandbox this
# app was developed in has none of those (see android/docs/07..16 phase
# reports). No signing, no release build, no Play Store step — debug only.
on:
  push:
    branches:
      - claude/nfcstore-android-app-ku07dm
    paths:
      - "android-app/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch: {}

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      # Uses the committed lockfile exactly (no dependency version bumps) —
      # android-app/.npmrc already sets legacy-peer-deps=true.
      - name: Install dependencies (npm ci, lockfile-exact)
        run: npm ci

      - name: Expo prebuild (Android)
        run: npx expo prebuild -p android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android-app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        working-directory: android-app/android
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfcstore-debug-apk
          path: android-app/android/${{ env.APK_PATH }}
          if-no-files-found: error
