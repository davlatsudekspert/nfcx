# NFCSTORE NOVA — ANDROID APK / AAB
#
# NIMA UCHUN CI DA: Android SDK `dl.google.com` dan keladi va u ba'zi
# tarmoqlarda (jumladan ushbu ishlab chiqish muhitida) yopiq. GitHub
# runner'ida SDK ALLAQACHON o'rnatilgan, shuning uchun APK shu yerda
# qurilib, tayyor fayl sifatida yuklab olinadi.
#
# ESKI ILOVA BILAN ARALASHMAYDI: bu workflow faqat `mobile_nova/` ni
# quradi va paket nomi `uz.nfcstore.nova`. Eski `mobile/` uchun
# alohida `android-apk.yml` bor va u o'zgartirilmagan.
#
# QANDAY OLINADI: Actions -> "NFCSTORE Nova APK" -> oxirgi ishga
# tushish -> pastdagi "Artifacts" -> `nfcstore-nova-apk`.
name: NFCSTORE Nova APK

on:
  workflow_dispatch:
  push:
    # `claude/**` ham bor: `workflow_dispatch` ni API orqali chaqirish
    # uchun fayl STANDART branchda turishi kerak, aks holda GitHub 404
    # qaytaradi. Nova hali `main` ga qo'shilmagan, shuning uchun uni
    # o'z branchiga push qilish orqali sinab ko'riladi.
    branches: [main, 'claude/**']
    paths:
      - 'mobile_nova/**'
      # E2E sinovlari va hujjatlar reliz APK'siga KIRMAYDI, shuning
      # uchun ular o'zgarganda qayta qurish shart emas. Inkor qilingan
      # naqsh aynan shuning uchun bor: aks holda har sinov tahriri
      # 6 daqiqalik buildni behuda ishga tushirardi.
      - '!mobile_nova/integration_test/**'
      - '!mobile_nova/**.md'
      - '.github/workflows/nova-apk.yml'
      # SHU WORKFLOW YURGIZADIGAN QO'RIQCHILAR.
      #
      # Ular `scripts/` da yotadi va yuqoridagi ro'yxatga kirmasdi —
      # ya'ni qo'riqchi tuzatilsa ham build QAYTA ISHGA TUSHMASDI va
      # oxirgi natija eski (qizil) holicha qolib ketardi. Aynan shu
      # yuz berdi. Butun `scripts/**` emas: unda har bir sayt
      # qo'riqchisining tahriri ham 6 daqiqalik APK buildini behuda
      # ishga tushirardi.
      - 'scripts/test-app-identity.mjs'
      - 'scripts/test-catalog-kind-parity.mjs'
      - 'scripts/test-nova-api-parity.mjs'
      - 'scripts/test-nova-id-purchase.mjs'
      - 'scripts/test-nova-response-contract.mjs'
      - 'scripts/lib/**'

concurrency:
  group: nova-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # `contents: write` — APK'ni GitHub Release sifatida chiqarish
  # uchun. Faqat shu ish uchun; boshqa hech narsa yozilmaydi.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile_nova

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Versiya QAT'IY belgilangan: ilova aynan shu versiyada yozilgan
      # va sinovdan o'tgan.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable
          cache: true

      # `--enforce-lockfile` — RELIZ QAYTARILUVCHI BO'LSIN. Oddiy
      # `pub get` cheklovlar ichida yangi versiyani olib kelishi mumkin,
      # ya'ni bir xil commit'dan ikki xil APK chiqardi.
      - name: Bog'liqliklar
        run: flutter pub get --enforce-lockfile

      # Kod tekshiruvi va testlar APK dan OLDIN: buzuq kodni paketlab
      # qo'yishdan ko'ra, qurilishni shu yerda to'xtatish ma'qul.
      - name: Kod tekshiruvi
        run: flutter analyze

      - name: Testlar
        run: flutter test

      # ── ILOVA CHAQIRADIGAN ENDPOINT SERVERDA BORMI ──────────────
      #
      # `flutter analyze` buni KO'RA OLMAYDI: yo'l shunchaki satr.
      # Marshrut serverda ro'yxatga qo'shilmay qolsa, ilovadagi
      # butun bir bo'lim birinchi kundan beri bo'sh turaverardi —
      # aynan `/api/feed` bilan shunday bo'lgan.
      #
      # Tekshiruv matn taqqoslash EMAS: haqiqiy `hosting/worker.js`
      # xotiradagi SQLite ustida ishga tushiriladi va har bir
      # chaqiruv ilova ishlatadigan AYNAN o'sha usul bilan
      # yuboriladi. Production D1 ga tegilmaydi.
      # `node:sqlite` Node 22 dan boshlab bor — runner'ning standart
      # versiyasi eski bo'lsa test "module not found" bilan yiqilardi.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Nova API parity — endpointlar serverda bormi
        working-directory: ${{ github.workspace }}
        run: node scripts/test-nova-api-parity.mjs

      # ── JAVOB KONTRAKTI ─────────────────────────────────────────
      #
      # Yuqoridagi qo'riqchi endpoint MAVJUDLIGINI tekshiradi va
      # aynan shu sababdan qurilmadagi xatoni o'tkazib yuborgan
      # edi: `/api/follow-list/` 200 qaytarardi, lekin ilova
      # noto'g'ri query nomini yuborar va javobdan mavjud
      # bo'lmagan kalitni o'qirdi. Bu qo'riqchi shuni tekshiradi.
      - name: Javob kontrakti — ilova o'qiydigan kalit bormi
        working-directory: ${{ github.workspace }}
        run: node scripts/test-nova-response-contract.mjs

      # NFC ID XARIDI — ilova saytning O'SHA endpointlaridan
      # ishlashi, narxni SERVER hisoblashi va to'lanmagan ID hech
      # qachon biriktirilmasligi.
      - name: NFC ID xaridi — narx, band qilish va to'lov shartnomasi
        # Bu ishning standart papkasi `mobile_nova`, skript esa
        # repo ildizida — shuning uchun yo'l aniq ko'rsatiladi
        # (yonidagi qo'riqchi qadamida ham xuddi shunday).
        working-directory: ${{ github.workspace }}
        run: node scripts/test-nova-id-purchase.mjs

      # ── ILOVA NOMI VA PAKET ID ──────────────────────────────────
      #
      # Bu tekshiruv `deploy.yml` da EMAS, ataylab: u `main` da
      # ishlaydi, `main` da esa `mobile_nova/` yo'q va test
      # "fayl topilmadi" bilan yiqilib, saytning deployini
      # to'sib qo'yardi. Ikkala ilova ham SHU branchda bor.
      - name: Ikki ilovaning nomi va paket ID'si
        working-directory: ${{ github.workspace }}
        run: node scripts/test-app-identity.mjs

      # Katalog turi qoidasi ikki joyda (server va ilova) va
      # ular ajralib ketsa, odam "mahsulot qo'shib bo'lmadi"
      # degan xatoni ko'radi. `deploy.yml` da EMAS: ilova
      # manbasi `main` da yo'q.
      - name: Katalog turi — server/ilova parity
        working-directory: ${{ github.workspace }}
        run: node scripts/test-catalog-kind-parity.mjs

      # HAQIQIY IMZO — faqat sozlangan bo'lsa.
      #
      # Uchta secret kerak (Settings -> Secrets and variables ->
      # Actions): NOVA_KEYSTORE_BASE64, NOVA_KEYSTORE_PASSWORD,
      # NOVA_KEY_ALIAS. Kalitni shunday yasaysiz:
      #
      #   keytool -genkey -v -keystore nova.jks -keyalg RSA \
      #     -keysize 2048 -validity 10000 -alias nova
      #   base64 -w0 nova.jks > nova.jks.b64
      #
      # `nova.jks` faylini YO'QOTMANG va repozitoriyaga QO'YMANG.
      #
      # ESKI ILOVANING KALITIDAN FOYDALANMANG: Nova boshqa paket,
      # unga o'z kaliti kerak.
      #
      # TEKSHIRUV SKRIPT ICHIDA, `if:` da emas: GitHub Actions `secrets`
      # kontekstini qadam darajasidagi `if:` da ko'rmaydi.
      - name: Imzo kalitini tayyorlash
        env:
          KEYSTORE: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "Imzo kaliti sozlanmagan — debug kaliti ishlatiladi."
            exit 0
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::NOVA_KEYSTORE_BASE64 bor, lekin PASSWORD yoki ALIAS yo'q."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > android/app/nova.jks
          cat > android/key.properties <<PROPS
          storeFile=nova.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          PROPS
          echo "HAQIQIY KALIT bilan imzolanadi."

      # VERSIYA RAQAMI — HAR QURILISHDA KATTAROQ.
      #
      # `pubspec.yaml` dagi `+1` ni har safar qo'lda oshirish
      # unutiladi, Play Store esa bir xil `versionCode` li ikkinchi
      # faylni QABUL QILMAYDI. Shuning uchun raqam CI dan keladi.
      - name: Versiya raqami
        id: ver
        env:
          RUN: ${{ github.run_number }}
        run: |
          NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$RUN" >> "$GITHUB_OUTPUT"
          echo "Versiya: $NAME ($RUN)"

      # Universal APK — qaysi protsessor ekanini bilmasdan o'rnatish
      # uchun (fayl kattaroq, lekin har qurilmada ishlaydi).
      - name: Universal APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.ver.outputs.name }} \
            --build-number=${{ steps.ver.outputs.code }} \
            --dart-define=NOVA_VERSION=${{ steps.ver.outputs.name }}

      # ABI bo'yicha bo'lingan APK'lar — arm64 qurilmalar uchun hajm
      # sezilarli kichrayadi.
      - name: ABI bo‘yicha APK
        run: |
          flutter build apk --release --split-per-abi \
            --build-name=${{ steps.ver.outputs.name }} \
            --build-number=${{ steps.ver.outputs.code }} \
            --dart-define=NOVA_VERSION=${{ steps.ver.outputs.name }}

      # AAB — Play Store uchun yagona qabul qilinadigan format.
      - name: AAB qurish (Play Store)
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.ver.outputs.name }} \
            --build-number=${{ steps.ver.outputs.code }} \
            --dart-define=NOVA_VERSION=${{ steps.ver.outputs.name }}

      # ESKI ILOVA USTIGA TUSHMASLIGINI TEKSHIRISH.
      #
      # Butun loyihaning birinchi shartи — Nova eski NFCSTORE ni
      # ALMASHTIRMASLIGI. Agar paket nomi tasodifan `uz.nfcstore.app`
      # bo'lib qolsa, Play Store buni eski ilovaning yangilanishi deb
      # qabul qilardi va foydalanuvchilar ishlab turgan ilovani
      # yo'qotardi. Shuning uchun bu TEKSHIRUV, ogohlantirish emas.
      - name: Paket nomini tekshirish
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ -z "$AAPT" ]; then
            echo "::error::aapt2 topilmadi — paket nomi tekshirilmadi."
            exit 1
          fi
          PKG=$("$AAPT" dump packagename "$APK")
          echo "Paket: $PKG"
          if [ "$PKG" != "uz.nfcstore.nova" ]; then
            echo "::error::Paket nomi uz.nfcstore.nova EMAS ($PKG) — eski ilova xavf ostida."
            exit 1
          fi
          echo "## Paket" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$PKG\` — eski \`uz.nfcstore.app\` dan ajratilgan, yonma-yon o‘rnatiladi." >> "$GITHUB_STEP_SUMMARY"

      # RUXSATLAR AUDITI.
      #
      # Manifestda uchta yozuv bor, lekin tayyor APK dagi ro'yxat
      # undan uzunroq bo'lishi mumkin: har bir plagin o'z manifestini
      # qo'shadi. Yangi kutubxona jimgina joylashuv yoki mikrofonni
      # so'rab qo'ysa, buni do'kon sharhida bilib olish juda kech.
      - name: Ruxsatlar auditi
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$AAPT" dump permissions "$APK" | grep -o "android.permission.[A-Z_]*" | sort -u > perms.txt || true
          echo "## Ruxsatlar" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/- /' perms.txt >> "$GITHUB_STEP_SUMMARY"
          cat perms.txt
          # Shaxsiy ma'lumotga tegadigan ruxsatlar. Nova ularning
          # BIRORTASINI ishlatmaydi: rasm `image_picker` ning tizim
          # tanlagichi orqali keladi (ruxsat kerak emas).
          BAD='ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|RECORD_AUDIO|READ_CONTACTS|WRITE_CONTACTS|READ_SMS|SEND_SMS|READ_PHONE_STATE|READ_CALL_LOG|BODY_SENSORS|ACTIVITY_RECOGNITION|READ_CALENDAR'
          if grep -Eq "android.permission.($BAD)" perms.txt; then
            echo "::error::Kutilmagan xavfli ruxsat qo'shilgan."
            grep -E "android.permission.($BAD)" perms.txt
            exit 1
          fi
          echo "Xavfli ruxsat yo'q."

      - name: Imzoni tekshirish
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner topilmadi — imzo tekshirilmadi."
            exit 0
          fi
          "$APKSIGNER" verify --print-certs "$APK" > certs.txt || {
            echo "::error::APK imzosi yaroqsiz."
            exit 1
          }
          RAW=$(grep -i 'SHA-256 digest' certs.txt | head -1 | awk '{print $NF}')
          FP=$(echo "$RAW" | tr -d ':' | tr 'a-z' 'A-Z' | sed 's/../&:/g; s/:$//')
          # IMZO TURI XULOSAGA EMAS, LOGGA ham yoziladi.
          #
          # Ilgari bu faqat `GITHUB_STEP_SUMMARY` ga borardi va
          # tashqaridan "bu RELEASE mi yoki DEBUG mi" degan savolga
          # javob topib bo'lmasdi. Hisobotda taxmin qilish esa
          # Play Store uchun yaroqsiz paketni yaroqli deb ko'rsatish
          # xavfini tug'diradi.
          if [ -f android/key.properties ]; then
            echo "SIGNING: RELEASE"
            echo "HAQIQIY kalit — Play Store uchun yaroqli." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SIGNING: DEBUG"
            echo "DIQQAT: DEBUG kaliti. Play Store'ga yaramaydi." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "## Imzo" >> "$GITHUB_STEP_SUMMARY"
          echo "App Links barmoq izi: \`$FP\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Barmoq izi: $FP"

      # O'RNATISHGA TAYYOR, TUSHUNARLI NOMLAR.
      #
      # `app-release.apk` va `app-arm64-v8a-release.apk` telefonga
      # yuklab olinganda qaysi ilova ekani bilinmaydi. Bu yerda
      # fayllar ko'chiriladi (asl nusxalar ham qoladi) va yagona
      # `SHA256SUMS.txt` yoziladi — yuklab olgandan keyin
      # tekshirish uchun.
      - name: Yakuniy paketlarni nomlash
        run: |
          OUT=release-final
          mkdir -p "$OUT"
          cp build/app/outputs/flutter-apk/app-release.apk \
             "$OUT/NFCSTORE-Nova-final.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "$OUT/NFCSTORE-Nova-final-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             "$OUT/NFCSTORE-Nova-final-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
             "$OUT/NFCSTORE-Nova-final-x86_64.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
             "$OUT/NFCSTORE-Nova-final.aab"
          ( cd "$OUT" && sha256sum * > SHA256SUMS.txt )
          ls -la "$OUT"
          echo "--- SHA-256 ---"
          cat "$OUT/SHA256SUMS.txt"

      # O'RNATISHGA YAROQLILIK — uchala tekshiruv ham QATTIQ.
      - name: O'rnatish tekshiruvi
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          ALIGN=$(ls "$ANDROID_HOME"/build-tools/*/zipalign 2>/dev/null | sort -V | tail -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          APK=release-final/NFCSTORE-Nova-final.apk

          echo "--- badging ---"
          "$AAPT" dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion"

          echo "--- zipalign ---"
          if [ -n "$ALIGN" ]; then
            "$ALIGN" -c -v 4 "$APK" > /dev/null && echo "zipalign: OK"
          else
            echo "::warning::zipalign topilmadi."
          fi

          echo "--- apksigner verify ---"
          "$APKSIGNER" verify --verbose "$APK" | head -5

      - name: Qurilgan fayllar
        run: |
          ls -la build/app/outputs/flutter-apk/ build/app/outputs/bundle/release/
          echo "--- SHA-256 ---"
          sha256sum build/app/outputs/flutter-apk/*.apk build/app/outputs/bundle/release/*.aab
          echo "## Fayllar" >> "$GITHUB_STEP_SUMMARY"
          du -h release-final/* >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: nfcstore-nova-apk
          path: |
            mobile_nova/build/app/outputs/flutter-apk/*.apk
            mobile_nova/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      # Telefonga o'rnatish va Play Store uchun — tushunarli nomlar
      # bilan alohida artifakt.
      # ── TELEFONGA — FAQAT BITTA FAYL ──────────────────────────
      #
      # To'liq to'plam ~110 MB: universal APK, uchta ABI varianti va
      # Play Store uchun AAB. Telefonga esa ULARDAN BITTASI kerak.
      # Ustiga GitHub artefaktni ZIP qiladi, APK esa allaqachon
      # siqilgan — ya'ni ZIP hajmni kamaytirmaydi, faqat qo'shimcha
      # ish qiladi.
      #
      # Zamonaviy Android telefonlarning deyarli hammasi arm64-v8a.
      - uses: actions/upload-artifact@v4
        with:
          name: NFCSTORE-Nova-telefon
          path: mobile_nova/release-final/NFCSTORE-Nova-final-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      # ── GITHUB RELEASE ────────────────────────────────────────
      #
      # NIMA UCHUN: Actions artefaktlari Azure omboridan beriladi va
      # ular sekin — O'zbekistondan 110 MB ~27 daqiqa ketdi. Release
      # assetlari esa CDN orqali keladi va ochiq repozitoriyada
      # LOGIN ham talab qilmaydi: havola to'g'ridan-to'g'ri `.apk`
      # ga olib boradi, ZIP ham yo'q.
      #
      # Teg QAT'IY: `nova-latest`. Har qurilishda yangilanadi,
      # shuning uchun havola O'ZGARMAYDI — bir marta saqlab qo'yib,
      # keyin doim o'shani ochish mumkin.
      # QURILISHNI YIQITMAYDI — ATAYLAB.
      #
      # Bu qadam APK'ni GitHub Release sifatida chiqaradi. Yuqorida
      # `permissions: contents: write` yozilgan, LEKIN token baribir
      # 403 ("Resource not accessible by integration") qaytarishi
      # mumkin: repozitoriya sozlamasida Actions tokeni faqat
      # o'qish uchun cheklangan bo'lsa, workflow'dagi ruxsat uni
      # KENGAYTIRA OLMAYDI.
      #
      # APK'ning O'ZI esa allaqachon artefakt sifatida yuklangan
      # (pastdagi `upload-artifact`) — ya'ni fayl bor, faqat
      # Release sahifasida ko'rinmaydi. Shuning uchun bu qadam
      # tufayli butun qurilishni qizil qilish noto'g'ri bo'lardi:
      # odam "APK qurilmadi" deb o'ylab qolardi.
      #
      # Tuzatish (egasi uchun): Settings -> Actions -> General ->
      # Workflow permissions -> "Read and write permissions".
      - name: Release — oxirgi qurilish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-final
          # Eski relizni tegi bilan birga olib tashlaymiz, aks holda
          # `create` "allaqachon bor" deb to'xtardi.
          gh release delete nova-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create nova-latest \
            NFCSTORE-Nova-final-arm64-v8a.apk \
            NFCSTORE-Nova-final-armeabi-v7a.apk \
            NFCSTORE-Nova-final.apk \
            NFCSTORE-Nova-final.aab \
            SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "NFCSTORE Nova — oxirgi qurilish (#${{ github.run_number }})" \
            --prerelease \
            --notes "Telefon uchun: **NFCSTORE-Nova-final-arm64-v8a.apk** — qurilish #${{ github.run_number }}, commit ${{ github.sha }}, branch ${{ github.ref_name }}. Sinov qurilishi: har yangi push'da yangilanadi."

      - uses: actions/upload-artifact@v4
        with:
          name: NFCSTORE-Nova-final
          path: mobile_nova/release-final/*
          if-no-files-found: error
          retention-days: 90
