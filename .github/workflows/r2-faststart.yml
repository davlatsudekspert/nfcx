# REELS VIDEOSI TEZROQ OCHILSIN — BIR MARTALIK (egasi, 2026-09-28:
# "reels keyingisiga o'tishda qora ekran, o'rtada aylana"; ruxsat berildi).
#
# Lentadagi 7 ta videodan bittasida (21 MB) `moov` ("mundarija") fayl
# OXIRIDA — pleyer boshlashdan oldin faylning oxirini ham so'raydi.
# Bu ish uni boshga ko'chiradi (tool/mp4_faststart.py — ilovadagi
# algoritm bilan baytma-bayt bir xil; ffmpeg framemd5: 880 kadr asl
# bilan bir xil). Qayta siqilmaydi, sifat o'zgarmaydi.
#
# XAVFSIZLIK:
#   * asl fayl SHA-256 bilan tekshiriladi — boshqa bayt bo'lsa to'xtaydi;
#   * asl nusxa `uploads-backup/` ga saqlanadi (ochiq yo'lda emas);
#   * natija SHA-256 bilan tekshiriladi, keyin saytdan qayta o'qiladi;
#   * allaqachon tuzatilgan bo'lsa — hech narsa yozilmaydi.
name: R2 video faststart (bir martalik)

on:
  push:
    paths:
      - '.github/workflows/r2-faststart.yml'

permissions:
  contents: read

concurrency:
  group: r2-faststart
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 31c4b3d8ece4b65de515debc4552334a
      BUCKET: nfcstore-uploads
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Faststart
        run: |
          set -euo pipefail
          W="npx --yes wrangler@4.129.0"
          # nom  asl_sha256  kutilgan_natija_sha256
          while read -r f want out; do
            [ -n "$f" ] || continue
            echo "── $f"
            cur=$(curl -sS https://nfcstore.uz/uploads/$f | sha256sum | cut -d' ' -f1)
            if [ "$cur" = "$out" ]; then echo "allaqachon tuzatilgan — o'tkazildi"; continue; fi
            $W r2 object get "$BUCKET/uploads/$f" --remote --file "orig_$f" >/dev/null </dev/null
            got=$(sha256sum "orig_$f" | cut -d' ' -f1)
            if [ "$got" != "$want" ]; then echo "::error::$f kutilgan fayl emas — to'xtadi"; exit 1; fi
            rc=0; python3 tool/mp4_faststart.py "orig_$f" "fs_$f" || rc=$?
            if [ $rc -ne 0 ]; then echo "::error::$f faststart rc=$rc"; exit 1; fi
            res=$(sha256sum "fs_$f" | cut -d' ' -f1)
            if [ "$res" != "$out" ]; then echo "::error::$f natija kutilgandan farq qiladi"; exit 1; fi
            $W r2 object put "$BUCKET/uploads-backup/$f" --remote --file "orig_$f" \
              --content-type video/mp4 >/dev/null </dev/null
            echo "zaxira: uploads-backup/$f"
            $W r2 object put "$BUCKET/uploads/$f" --remote --file "fs_$f" \
              --content-type video/mp4 --cache-control "public, max-age=31536000, immutable" >/dev/null </dev/null
            live=$(curl -sS https://nfcstore.uz/uploads/$f | sha256sum | cut -d' ' -f1)
            if [ "$live" != "$out" ]; then echo "::error::$f saytda yangi nusxa ko'rinmadi"; exit 1; fi
            curl -sS -r 0-65535 https://nfcstore.uz/uploads/$f -o head.bin
            python3 -c "
          import struct
          b=open('head.bin','rb').read();p=0;t=[]
          while p+8<=len(b):
              s,ty=struct.unpack('>I4s',b[p:p+8])
              if s==1: s=struct.unpack('>Q',b[p+8:p+16])[0]
              t.append(ty.decode('latin1'))
              if s==0 or ty==b'mdat': break
              p+=s
          print('qutilar:',' '.join(t)); assert t.index('moov')<t.index('mdat')"
            echo "✓ $f — moov boshda" | tee -a "$GITHUB_STEP_SUMMARY"
          done <<'LIST'
          cardvid_e6a52dee5deab73750ac852b.mp4 aed43161e624c2693b92c0b073baad17328672a0db3b48fd66fc9c47dad76fa5 6aec0de6c523ce31ce27c93b394734d35ffae9ef672bddbdcc8a2557ddfde427
          LIST
