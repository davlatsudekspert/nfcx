name: Build NFCSTORE mobile debug APK

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nfcstore-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (generate native android/ project)
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: nfcstore-mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfcstore-mobile-debug-apk
          path: nfcstore-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
