<!DOCTYPE html>
<html lang="uz" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover — iPhone (notch/Dynamic Island) uchun: sahifa
       xavfsiz zonaga cheklanib qolmasdan butun ekranni egallaydi, ichki
       joylashuv esa env(safe-area-inset-*) orqali to'g'ri hisoblanadi
       (src/index.css'dagi .vz-safe-x va body qoidalariga qarang). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>NFCSTORE — raqamli profil va NFC karta</title>
  <meta name="description" content="Telefon, ijtimoiy tarmoqlar, sayt va boshqa muhim ma’lumotlaringizni bitta raqamli profilda jamlang va NFC karta orqali ulashing." />
  <meta name="theme-color" content="#0a0805" />
  <meta name="robots" content="index,follow" />
  <link rel="canonical" href="https://nfcstore.uz/" />
  <meta property="og:title" content="NFCSTORE — raqamli profil va NFC karta" />
  <meta property="og:description" content="Barcha kontaktlaringiz — bitta profilda. NFCSTORE bilan ularni qulay ulashing." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://nfcstore.uz/" />
  <!-- Ulashish rasmi 1200x630 KENG banner (og-cover.png), kvadrat logo
       emas. Kvadrat rasm Telegram/Facebook da kichkina kvadratcha
       bo'lib chiqadi; keng format esa katta karta bo'lib ochiladi.
       Fayl nomi ham yangi — eski keshlangan ko'rinish shu bilan
       almashadi (ijtimoiy tarmoqlar rasmni MANZIL bo'yicha keshlaydi). -->
  <meta property="og:image" content="https://nfcstore.uz/og-cover.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="NFCSTORE — bitta teginish, barcha kontaktlaringiz" />
  <meta property="og:site_name" content="NFCSTORE.UZ" />
  <meta property="og:locale" content="uz_UZ" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="NFCSTORE — raqamli profil va NFC karta" />
  <meta name="twitter:description" content="Barcha kontaktlaringiz — bitta profilda. NFCSTORE bilan ularni qulay ulashing." />
  <meta name="twitter:image" content="https://nfcstore.uz/og-cover.png" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "NFCSTORE.UZ",
    "url": "https://nfcstore.uz",
    "logo": "https://nfcstore.uz/logo-512.png"
  }
  </script>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/logo-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NFCSTORE" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- 2026-09: shriftlar Google CDN'dan EMAS, o'z domenimizdan beriladi.
       Qarang: src/fonts.css (Fontsource npm paketlari). -->
</head>
<!-- Sahifa foni: avval `bg-base-100` (#0a0908 — JIGARRANG tus, R>G>B) va
     ikkita radial "yorug'lik" gradienti shu yerda QATTIQ YOZILGAN edi —
     aynan shu bosh sahifadagi jigarrang-qoramtir dog'ni va bo'limlar
     orasidagi rang choklarini hosil qilardi. Endi yagona `bg-page-bg`
     tokeni (src/theme.css: --color-page-bg = #000000, /narxlar sahifasidan
     olingan). `--color-base-100` O'ZGARMADI — u kartalar, inputlar va
     modallarda ishlatiladi. -->
<body class="overflow-x-hidden bg-page-bg font-sans leading-normal text-base-content antialiased">
  <div id="root"></div>
  <!-- Sahifa/canvas foni — YAGONA qora token (src/theme.css: --color-page-bg).
       Bu yerda inline turibdi, chunki daisyUI hujjat (canvas) fonini o'zining
       `--root-bg` o'zgaruvchisi orqali boshqaradi va CSS minifikatori
       stylesheetdagi `html{background}` qoidasini o'sha qoidaga birlashtirib
       yuboradi. Faqat SAHIFA foni — komponentlarning `--color-base-100`
       rangiga tegilmagan. -->
  <style>:root{--root-bg:#000000;background-color:#000000}</style>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
