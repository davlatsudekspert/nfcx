<!doctype html><html><head><meta charset="utf8"><style>
body{background:#151312;margin:0;height:100vh;font-family:system-ui,sans-serif;color:#ccc}
@keyframes spinSlow{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(255,255,255,.25)}100%{box-shadow:0 0 0 14px rgba(255,255,255,0)}}
.wrap{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;user-select:none}
.vid{overflow:hidden;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:#000;box-shadow:0 12px 34px rgba(0,0,0,.55);transition:all .2s}
.vid iframe{display:block;width:190px;height:107px;border:0}
.pill{display:flex;align-items:center;gap:4px;border-radius:999px;background:rgba(0,0,0,.7);padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.45);backdrop-filter:blur(6px)}
.grip{display:flex;height:44px;width:16px;align-items:center;justify-content:center;color:rgba(255,255,255,.35);cursor:grab;touch-action:none}
.play{display:flex;height:44px;width:44px;align-items:center;justify-content:center;border-radius:999px;color:#fff;border:0;background:#c9962f;animation:spinSlow 6s linear infinite}
.lbl{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px;font-size:12px;font-weight:600;color:rgba(255,255,255,.85)}
.chev{display:flex;height:28px;width:28px;align-items:center;justify-content:center;border-radius:999px;color:rgba(255,255,255,.6);border:0;background:transparent;cursor:pointer}
</style></head><body>
<p style="padding:24px">Musiqa pleeri — ixcham, suriladigan (chap "⣿" belgidan ushlab suring), video ▾ bilan yig'iladi.</p>
<div class="wrap" id="w">
  <div class="vid" id="vid"><iframe src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?modestbranding=1&rel=0"></iframe></div>
  <div class="pill">
    <span class="grip" id="grip"><svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor"><circle cx="2.5" cy="3" r="1.4"/><circle cx="7.5" cy="3" r="1.4"/><circle cx="2.5" cy="8" r="1.4"/><circle cx="7.5" cy="8" r="1.4"/><circle cx="2.5" cy="13" r="1.4"/><circle cx="7.5" cy="13" r="1.4"/></svg></span>
    <button class="play"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
    <span class="lbl">🎵 Musiqa</span>
    <button class="chev" id="chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>
</div>
<script>
let open=true;const vid=document.getElementById('vid');
document.getElementById('chev').onclick=()=>{open=!open;vid.style.width=open?'190px':'0';vid.style.height=open?'107px':'0';vid.style.opacity=open?1:0;};
const w=document.getElementById('w');let pos={x:0,y:0},d=null;const grip=document.getElementById('grip');
grip.onpointerdown=e=>{d={sx:e.clientX,sy:e.clientY,ox:pos.x,oy:pos.y};grip.setPointerCapture(e.pointerId);};
grip.onpointermove=e=>{if(!d)return;pos.x=Math.min(0,Math.max(-(innerWidth-96),d.ox+e.clientX-d.sx));pos.y=Math.min(0,Math.max(-(innerHeight-96),d.oy+e.clientY-d.sy));w.style.transform=`translate(${pos.x}px,${pos.y}px)`;};
grip.onpointerup=()=>d=null;
</script></body></html>
