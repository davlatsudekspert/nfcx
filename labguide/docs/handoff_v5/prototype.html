<style>

switch(S.screen){case 'welcome':main.innerHTML=`<div class="eyebrow">${tr('Sizning laboratoriya yordamchingiz','Ваш лабораторный помощник','Your laboratory companion')}</div><img class="hero-art" src="${heroAsset}" alt="">`+head(tr('Biokimyo.<br>Tushunarli va amaliy.','Биохимия.<br>Понятно и практично.','Biochemistry.<br>Clear and practical.'),tr('Tahlillar, laboratoriya amaliyoti va o‘rganish — bir joyda.','Анализы, лабораторная практика и обучение в одном месте.','Tests, laboratory practice and learning in one place.'))+`<div class="panel"><div class="inline"><span class="tag">UZ · RU · EN</span><span class="small">${tr('Telefon va planshet','Телефон и планшет','Phone and tablet')}</span></div><p>${tr('Shifokor · laborant · student · ustoz','Врач · лаборант · студент · преподаватель','Physician · lab professional · student · teacher')}</p></div>`+B(tr('Boshlash / ro‘yxatdan o‘tish','Начать / зарегистрироваться','Get started / sign up'),'auth')+B(tr('Mehmon sifatida ko‘rish','Посмотреть как гость','Explore as guest'),'roles','secondary')+B(tr('Kirish','Войти','Sign in'),'auth','link');break;
case 'auth':main.innerHTML=back()+head(tr('Xush kelibsiz','Добро пожаловать','Welcome'),tr('Email orqali kirish yoki yangi hisob ochish.','Вход или регистрация по email.','Sign in or create an account with email.'))+`<div class="notice">${tr('Demo: haqiqiy email va kod yuborilmaydi.','Демо: письмо и код не отправляются.','Demo: no real email or code is sent.')}</div><form id="lg-auth-form"><label for="lg-email">Email</label><input type="email" id="lg-email" required autocomplete="email" placeholder="name@example.com" value="${esc(S.email)}"><label class="check"><input id="lg-consent" type="checkbox" required><span>${tr('Foydalanish shartlari va maxfiylik siyosatini qabul qilaman.','Я принимаю условия и политику конфиденциальности.','I accept the terms and privacy policy.')}</span></label><button type="submit" class="primary cursor-interaction">${tr('Demo kod olish','Получить демо-код','Get demo code')}</button></form>`+B(tr('Shartlarni ko‘rish','Посмотреть условия','View terms'),'legal','link');break;
case 'otp':main.innerHTML=back()+head(tr('Emailni tasdiqlash','Подтвердите email','Verify your email'),esc(S.email))+`<div class="notice">${tr('Sinash uchun kod: 123456. Email yuborilmadi.','Демо-код: 123456. Письмо не отправлено.','Demo code: 123456. No email was sent.')}</div><form id="lg-otp-form"><label for="lg-code">${tr('6 xonali kod','6-значный код','6-digit code')}</label><input id="lg-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required placeholder="123456"><div id="lg-otp-error" role="alert"></div><button class="primary cursor-interaction" type="submit">${tr('Tasdiqlash','Подтвердить','Verify')}</button></form>`+B(tr('Kodni qayta olish · demo','Повторный код · демо','Resend code · demo'),'resend','link');break;
case 'roles':main.innerHTML=roleView();break;case 'home':main.innerHTML=home();break;case 'atlas':main.innerHTML=atlas();break;case 'topic':main.innerHTML=topic();break;case 'lab':main.innerHTML=lab();break;case 'library':main.innerHTML=library();break;case 'learn':main.innerHTML=learn();break;case 'calibration':main.innerHTML=calibration();break;case 'calculator':main.innerHTML=calculator();break;case 'profile':main.innerHTML=profile();break;case 'quiz':main.innerHTML=quiz();break;default:main.innerHTML=auxiliary()}
if(['home','learn','purchase'].includes(S.screen)){const h=main.querySelector('.hero');if(h){const img=document.createElement('img');img.src=heroAsset;img.alt='';img.className='hero-art';h.prepend(img)}}
const toast=root.querySelector('#lg-toast');toast.hidden=!S.toast;toast.textContent=S.toast;if(typeof lucide!=='undefined')lucide.createIcons({attrs:{width:19,height:19}});
}
root.addEventListener('change',e=>{if(e.target.id==='lg-lang'){S.lang=e.target.value;render()}});
root.addEventListener('input',e=>{if(e.target.id==='lg-search'){S.query=e.target.value;const pos=e.target.selectionStart;render();const f=root.querySelector('#lg-search');f.focus();f.setSelectionRange(pos,pos)}});
root.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='lg-auth-form'){S.email=root.querySelector('#lg-email').value;go('otp')}else if(e.target.id==='lg-otp-form'){if(root.querySelector('#lg-code').value==='123456')go('roles');else root.querySelector('#lg-otp-error').textContent=tr('Kod noto‘g‘ri. Demo kod: 123456.','Неверный код. Демо: 123456.','Incorrect code. Demo: 123456.')}});
root.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
if(a==='back'){S.screen=S.history.pop()||'home';render();return}if(a==='role'){S.role=b.dataset.role;render();return}if(a==='enter'){S.tab='home';go('home');return}if(a==='theme'){S.theme=b.dataset.theme;render();return}if(a==='filter'){S.filter=b.dataset.filter;render();return}if(a==='clear'){S.query='';S.filter='all';render();return}if(a==='topic'){S.topic=Number(b.dataset.id);go('topic');return}if(a==='save'){S.saved=S.saved.includes(S.topic)?S.saved.filter(x=>x!==S.topic):[...S.saved,S.topic];render();return}if(a==='download'){const i=Number(b.dataset.pack);S.downloads=S.downloads.includes(i)?S.downloads.filter(x=>x!==i):[...S.downloads,i];render();return}if(a==='answer'){S.answer=Number(b.dataset.answer);render();return}if(a==='next'){S.quiz++;S.answer=null;render();return}if(a==='restart'){S.quiz=0;S.answer=null;go('quiz');return}
if(a==='calculate'){const c1=Number(root.querySelector('#lg-c1').value),c2=Number(root.querySelector('#lg-c2').value),v2=Number(root.querySelector('#lg-v2').value),r=root.querySelector('#lg-result');if(![c1,c2,v2].every(x=>Number.isFinite(x)&&x>0)||c2>c1){r.innerHTML=`<div class="notice" role="alert">${tr('Musbat qiymatlar kiriting. C₂ C₁ dan katta bo‘lmasin.','Введите положительные значения. C₂ не должна превышать C₁.','Enter positive values. C₂ must not exceed C₁.')}</div>`;return}r.innerHTML=`<div class="panel"><div class="result">V₁ = ${(c2*v2/c1).toLocaleString(S.lang==='ru'?'ru-RU':'en-US',{maximumFractionDigits:6})} mL</div><p>${tr('Boshlang‘ich eritmadan olinadigan hajm. Yakuniy umumiy hajmni V₂ gacha yetkazing.','Объём исходного раствора. Доведите общий конечный объём до V₂.','Volume of stock solution. Bring the total final volume to V₂.')}</p></div>`;return}
if(a==='match'){S.toast=tr('Mos yo‘riqnoma ulanmagan. Parametr tavsiya qilinmaydi.','Инструкция не подключена. Параметры не рекомендуются.','Matching instructions are not connected. No parameters are recommended.');const t=root.querySelector('#lg-toast');t.hidden=false;t.textContent=S.toast;return}
if(a==='outline'){root.querySelector('#lg-outline').innerHTML=`<div class="panel">${[tr('Savol va maqsad','Вопрос и цель','Question and aim'),tr('Manbalar sharhi','Обзор источников','Literature review'),tr('Metod va haqiqiy ma’lumotlar','Метод и реальные данные','Methods and real data'),tr('Natija, cheklov va xulosa','Результаты, ограничения и выводы','Results, limitations and conclusions')].map((x,i)=>`<div class="step"><div class="num">${i+1}</div>${x}</div>`).join('')}</div>`;return}
if(['buy','restore','resend','publishassignment'].includes(a)){S.toast=tr('Demo holati. Haqiqiy operatsiya bajarilmadi.','Демонстрация. Реальная операция не выполнена.','Demo state. No real operation was performed.');render();return}if(a==='logout'){S.email='';S.saved=[];S.downloads=[];S.history=[];S.screen='welcome';render();return}
if(['home','atlas','lab','library','learn'].includes(a))S.tab=a;go(a);
});render();
})();
</script>
</div>
