name: nfcstore
description: "NFCSTORE — raqamli profil va NFC karta."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  # Tarmoq. `http` — oddiy va yengil; API klienti bitta joyda
  # (lib/data/api_client.dart) o'ralgan, shuning uchun kerak bo'lsa
  # boshqasiga almashtirish bir faylni o'zgartiradi.
  http: ^1.2.2
  # Rasm keshi — brief talabi. Xotira + disk keshi, skeletondan
  # yumshoq o'tish (240ms) shu paketning placeholder/fade imkoniyati
  # bilan beriladi.
  cached_network_image: ^3.4.1
  # Sessiya tokeni — Keystore/Keychain ichida. SharedPreferences EMAS:
  # token bu — hisobga to'liq kirish.
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  # QR — sof Dart, native bog'liqliksiz.
  qr_flutter: ^4.1.0
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  # Barmoq izi / yuz bilan ochish. Biometrik ma'lumot ilovaga
  # BERILMAYDI — tizim faqat "tasdiqlandi/yo'q" javobini qaytaradi.
  local_auth: ^2.3.0
  # PIN kodni HASH qilish uchun. Kodning o'zi hech qayerda
  # saqlanmaydi — faqat tuz bilan olingan SHA-256.
  crypto: ^3.0.6
  # NFC o'qish/yozish. Ilova NFCSTORE deb ataladi va NFC tab uning
  # o'zagi — kartani telefonga tegizish ishlashi SHART.
  nfc_manager: ^3.5.0
  # Jismoniy karta tegizilganda ilova o'zi ochilishi uchun (App Links)
  # kelgan havolani o'qiydi.
  app_links: ^6.3.2
  image_picker: ^1.2.3
  video_player: ^2.14.0

dev_dependencies:
  # `RefreshIndicator` belgisi qancha ushlab turishini SOAT
  # KUTMASDAN o'lchash uchun — test 4 soniya real kutib o'tirmaydi.
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/
  fonts:
    # DISPLAY — Playfair Display. Yuqori kontrastli didone: qalin
    # vertikal, ingichka gorizontal chiziqlar. Katta o'lchamda
    # (44–56) u sarlavhani "jurnal muqovasi" qiladi; kichik
    # o'lchamda ishlatilmaydi — u yerda ingichka joylari yo'qoladi.
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-400.ttf
          weight: 400
        - asset: assets/fonts/PlayfairDisplay-500.ttf
          weight: 500
        - asset: assets/fonts/PlayfairDisplay-600.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-700.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay-400Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/PlayfairDisplay-500Italic.ttf
          weight: 500
          style: italic
    # MATN — Plus Jakarta Sans. Geometrik, keng ochilgan; o'zbek
    # lotin belgilarini (o', g', sh, ch) to'liq qamraydi.
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
    # MONO — Space Mono. ID kodlari va narxlar uchun: raqamlar bir
    # xil kenglikda, shuning uchun ro'yxatda ustma-ust tekis turadi.
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-400.ttf
          weight: 400
        - asset: assets/fonts/SpaceMono-700.ttf
          weight: 700
