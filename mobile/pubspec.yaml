name: nfcstore
description: "NFCSTORE — raqamli profil va NFC karta."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  # Tarmoq. `http` — oddiy va yengil; API klienti bitta joyda
  # (lib/data/api_client.dart) o'ralgan, shuning uchun kerak bo'lsa
  # boshqasiga almashtirish bir faylni o'zgartiradi.
  http: ^1.2.2
  # Rasm keshi — brief talabi. Xotira + disk keshi, skeletondan
  # yumshoq o'tish (240ms) shu paketning placeholder/fade imkoniyati
  # bilan beriladi.
  cached_network_image: ^3.4.1
  # Sessiya tokeni — Keystore/Keychain ichida. SharedPreferences EMAS:
  # token bu — hisobga to'liq kirish.
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  # QR — sof Dart, native bog'liqliksiz.
  qr_flutter: ^4.1.0
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  # Barmoq izi / yuz bilan ochish. Biometrik ma'lumot ilovaga
  # BERILMAYDI — tizim faqat "tasdiqlandi/yo'q" javobini qaytaradi.
  local_auth: ^2.3.0
  # PIN kodni HASH qilish uchun. Kodning o'zi hech qayerda
  # saqlanmaydi — faqat tuz bilan olingan SHA-256.
  crypto: ^3.0.6
  # NFC o'qish/yozish. Ilova NFCSTORE deb ataladi va NFC tab uning
  # o'zagi — kartani telefonga tegizish ishlashi SHART.
  nfc_manager: ^3.5.0
  # Jismoniy karta tegizilganda ilova o'zi ochilishi uchun (App Links)
  # kelgan havolani o'qiydi.
  app_links: ^6.3.2
  image_picker: ^1.2.3
  video_player: ^2.14.0

dev_dependencies:
  # HAQIQIY QURILMADA SINOV.
  #
  # `test/` dagi 244 ta sinov widget'larni SOXTA muhitda chizadi:
  # tarmoq yo'q, platforma plaginlari yo'q, ilovaning `main()` i
  # umuman ishga tushmaydi. Ular maketni isbotlaydi, lekin
  # "ilova telefonda ochiladimi, tugmalar ishlaydimi" degan
  # savolga JAVOB BERMAYDI. Aynan shu bo'shliq sabab qurilmada
  # ochilmaydigan build "tayyor" deb topshirilgan edi.
  #
  # `integration_test` ilovaning O'ZINI emulyatorda ishga tushiradi.
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/
  fonts:
    # PROTOTIPDAGI UCHLIK (NFCSTORE V2): Playfair Display —
    # sarlavha, Plus Jakarta Sans — matn, Space Mono — kod va raqam.
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-400.ttf
          weight: 400
        - asset: assets/fonts/PlayfairDisplay-400Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/PlayfairDisplay-500.ttf
          weight: 500
        - asset: assets/fonts/PlayfairDisplay-500Italic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/PlayfairDisplay-600.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-700.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-400.ttf
          weight: 400
        - asset: assets/fonts/SpaceMono-700.ttf
          weight: 700
    # KIRILL ZAXIRASI. Plus Jakarta Sans va Space Mono'da kirill
    # YO'Q (Google Fonts'da bu subset umuman chiqarilmagan), ya'ni
    # ruscha matn ularda bo'sh kvadratlar bo'lib chiqardi. Shrift
    # almashtirilmadi — prototip aynan shu ikkisini belgilaydi;
    # o'rniga FAQAT kirill uchun zaxira oila ulanadi va u lotin
    # matnga hech qachon tegmaydi.
    - family: ManropeCyr
      fonts:
        - asset: assets/fonts/ManropeCyr-400.ttf
          weight: 400
        - asset: assets/fonts/ManropeCyr-500.ttf
          weight: 500
        - asset: assets/fonts/ManropeCyr-600.ttf
          weight: 600
        - asset: assets/fonts/ManropeCyr-700.ttf
          weight: 700
        - asset: assets/fonts/ManropeCyr-800.ttf
          weight: 800
    - family: PlexMonoCyr
      fonts:
        - asset: assets/fonts/PlexMonoCyr-400.ttf
          weight: 400
        - asset: assets/fonts/PlexMonoCyr-700.ttf
          weight: 700
